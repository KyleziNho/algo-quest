  const swap = (i, j) => { const t = a[i]; a[i] = a[j]; a[j] = t; swaps++; };
  if (algo === "insertion") {
    snap("Insertion sort — exactly how you sort cards in your hand. It only ever swaps <b>neighbours</b>.");
    for (let i = 1; i < a.length; i++) {
      snap("Pick up <b>" + a[i] + "</b> and slide it left until it fits.", { [i]: "n-look" });
      let j = i;
      while (j > 0) {
        comps++;
        if (a[j - 1] <= a[j]) { snap("<b>" + a[j - 1] + "</b> is not bigger than <b>" + a[j] + "</b>, so it is already in place.", { [j]: "n-lock", [j - 1]: "n-seen" }); break; }
        snap("<b>" + a[j - 1] + "</b> beats <b>" + a[j] + "</b> — wrong order, so swap. Each swap fixes exactly <b>one inversion</b>.", { [j]: "n-look", [j - 1]: "n-look" });
        swap(j - 1, j); j--;
      }
    }
    snap("Sorted in <b>" + swaps + " swaps</b>. That number is not a coincidence: it is exactly the number of <b>inversions</b> the array started with.",
      Object.fromEntries(a.map((_, i) => [i, "n-lock"])));
  } else {
    snap("Shell sort — same idea, but it first swaps items <b>far apart</b>, so one swap can fix several inversions at once.");
    for (const gap of [3, 1]) {
      snap("Pass with stride <b>" + gap + "</b>: only compare items " + gap + " apart" + (gap === 1 ? " — this last pass is just plain insertion sort, but the array is nearly sorted by now." : "."), {});
      for (let i = gap; i < a.length; i++) {
        let j = i;
        while (j >= gap) {
          comps++;
          if (a[j - gap] <= a[j]) break;
          snap("<b>" + a[j - gap] + "</b> beats <b>" + a[j] + "</b> across a distance of " + gap + " — swap them.", { [j]: "n-look", [j - gap]: "n-look" }, [j - gap, j]);
          swap(j - gap, j); j -= gap;
        }
      }
    }
    snap("Sorted in <b>" + swaps + " swaps</b> — fewer than insertion sort's 10 on the same array, because the long-distance swaps each fixed more than one inversion.",
      Object.fromEntries(a.map((_, i) => [i, "n-lock"])));
  }
  return {
    shape: "bars", frames: F, vb: "0 0 360 220",
    reads: f => [["drop", f.swaps, "swaps"], ["look", f.comps, "comparisons"]],
    note: "Run both on this same array <b>[4, 2, 6, 1, 0, 3]</b>: insertion sort needs <b>10</b> swaps, Shell needs <b>6</b>. It is the identical array from the mock paper.",
  };
}

function mHash(o) {
  const how = o.how || "chain";
  const keys = [13, 14, 18, 7, 1, 5, 77];
  const F = [];
  const slots = new Array(7).fill(null), chains = {}, homes = {};
  let probes = 0;
  const snap = (say, hi, hiChain) => F.push({
    slots: slots.slice(), chains: how === "chain" ? JSON.parse(JSON.stringify(chains)) : null,
    homes: Object.assign({}, homes),
    hi: hi || {}, hiChain: hiChain, say: say, probes: probes,
  });
  snap("Seven slots and the hash function <b>h(k) = k mod 7</b> — the remainder after dividing by 7. That one division tells me where to look, with no searching at all.");
  for (const k of keys) {
    const home = k % 7;
    homes[k] = home;
    snap("Key <b>" + k + "</b>: " + k + " mod 7 = <b>" + home + "</b>. That is its home slot.", { [home]: "n-look" });
    if (how === "chain") {
      chains[home] = chains[home] || [];
      if (slots[home] == null && chains[home].length === 0) {
        slots[home] = k;
        snap("Slot " + home + " was empty, so <b>" + k + "</b> lives there.", { [home]: "n-lock" });
      } else {
        chains[home].push(k);
        snap("Slot " + home + " is taken — a <b>collision</b>. With chaining I just hang <b>" + k + "</b> on the end of that slot's little list. Nobody gets displaced.", { [home]: "n-look" }, home + ":" + (chains[home].length - 1));
      }
    } else {
      let s = home, steps = 0;
      while (slots[s] != null) {
        steps++;
        snap("Slot " + s + " already holds <b>" + slots[s] + "</b>. Linear probing says: <b>step to the next slot</b> and try again.", { [s]: "n-drop" });
        s = (s + 1) % 7;
      }
      slots[s] = k;
      probes += steps + 1;   /* every slot inspected, including the one it lands in */
      snap(steps === 0 ? "Slot " + s + " was free — <b>" + k + "</b> goes straight in. <b>1 look.</b>" :
        "Free at last. <b>" + k + "</b> ends up in slot <b>" + s + "</b> — that is <b>" + (steps + 1) + " slots looked at</b>, counting its home. Notice it has now <b>stolen someone else's home slot</b>, which is how clustering snowballs.", { [s]: "n-lock" });
    }
  }
  snap(how === "chain"
    ? "All seven keys stored. Finding <b>77</b> means walking slot 0's chain: 14, then 7, then 77 — <b>3 looks</b>."
    : "All seven keys stored, but look at the damage: key <b>77</b> alone needed <b>4 looks</b> (slots 0, 1, 2, then 3). Probing is fast in an empty table and much worse as it fills.", {});
  return {
    shape: "slots", frames: F, vb: "0 0 360 225",
    reads: f => [["drop", f.probes, "slots looked at"], ["lock", f.slots.filter(Boolean).length, "slots used"]],
    note: "Same seven keys, two collision strategies. <b>Chaining</b> never displaces anybody and copes past a full table; <b>probing</b> stays in one array but keys steal each other's homes. Which wins is genuinely data-dependent.",
  };
}

function mFloyd(o) {
  const wide = o.wide === true;
  const names = ["A", "B", "C", "D"];
  const INF = Infinity;
  /* Bandwidth is the mirror image of distance, so the two special values flip:
     no link = 0 capacity (was ∞ distance); yourself = ∞ capacity (was 0 distance). */
  const base = wide
    ? [[INF, 100, 0, 30], [100, INF, 56, 0], [0, 56, INF, 1000], [30, 0, 1000, INF]]
    : [[0, 4, INF, 8], [4, 0, 3, INF], [INF, 3, 0, 2], [8, INF, 2, 0]];
  const edges = wide
    ? [[0, 1, 100], [1, 2, 56], [2, 3, 1000], [3, 0, 30]]
    : [[0, 1, 4], [1, 2, 3], [2, 3, 2], [3, 0, 8]];
  const m = base.map(r => r.slice());
  const F = [];
  let improved = 0;
  const snap = (say, extra) => F.push(Object.assign({
    m: m.map(r => r.slice()), names: names, wide: wide, edges: edges, k: null, hot: null, better: false,
    say: say, improved: improved,
  }, extra || {}));
  snap(wide
    ? "Four sites in a ring. Each link has a <b>bandwidth</b>, and a route only carries as much as its <b>narrowest</b> link — so I want the route whose narrowest link is the <b>widest</b>. The table starts with direct links only: <b>0</b> means no cable, <b>∞</b> is a site to itself."
    : "Shortest path between <b>every</b> pair at once. The table starts with direct links only — <b>∞</b> means there is no direct link yet, <b>0</b> is a node to itself.");
  for (let k = 0; k < 4; k++) {
    snap("Now allow <b>" + names[k] + "</b> as a stopover. Every pair gets asked the same question: is routing through " + names[k] + " better than what I already have?", { k: k });
    for (let i = 0; i < 4; i++) {
      for (let j = 0; j < 4; j++) {
        if (i === j || i === k || j === k) continue;
        const via = wide ? Math.min(m[i][k], m[k][j]) : m[i][k] + m[k][j];
        const better = wide ? via > m[i][j] : via < m[i][j];
        const route = names[i] + " → " + names[k] + " → " + names[j];
        const cur = m[i][j] === INF ? "∞" : m[i][j];
        const say = wide
          ? (m[i][k] === 0 || m[k][j] === 0
              ? "<b>" + route + "</b> is not a real route — one of those legs has <b>0</b> bandwidth, so nothing gets through. Current best stays <b>" + cur + "</b>."
              : "<b>" + route + "</b>: the two legs carry <b>" + m[i][k] + "</b> and <b>" + m[k][j] + "</b>, so the whole route is throttled to the smaller — min(" + m[i][k] + ", " + m[k][j] + ") = <b>" + via + "</b>. Against the current best of <b>" + cur + "</b>: " +
                (better ? "that is <b>wider</b>, so take it." : "no wider, so keep what I had."))
          : "<b>" + route + "</b> costs " + m[i][k] + " + " + m[k][j] + " = <b>" + (via === INF ? "∞" : via) + "</b>, against the current <b>" + cur + "</b>. " +
            (better ? "Shorter — take it." : "No better, keep what I had.");
        /* commit first, so the cell shows its NEW value in the same frame that explains it */
        if (better) { m[i][j] = via; improved++; }
        snap(say, { k: k, hot: [i, j], better: better });
      }
    }
  }
  snap(wide
    ? "Finished. Look at <b>A → D</b>: the direct cable is only <b>30</b>, but going the long way round through B and C gives min(100, 56, 1000) = <b>56</b>. A longer route can be a <b>wider</b> one — which is exactly why this is not the shortest-path problem. Same three loops, only <b>+ became min</b> and <b>min became max</b>."
    : "Finished. Three nested loops over k, i, j — so <b>Θ(V³)</b>. Fine for hundreds of nodes, hopeless for 100,000.", { done: true });
  return {
    shape: "matrix", frames: F, vb: "0 0 360 350",
    reads: f => [["look", f.k == null ? "–" : f.names[f.k], "stopover"], ["lock", f.improved, wide ? "routes widened" : "routes shortened"]],
    note: wide
      ? "Two operators, two different jobs. <b>min</b> combines the legs of one route (a chain is only as good as its weakest link); <b>max</b> chooses between competing routes (you want the strongest weak link). Shortest path uses <b>+</b> to combine and <b>min</b> to choose — that is the entire difference, and it is the mock's 6-mark adaptation."
      : "Watch the ∞ cells fill in as stopovers become available. Then flip to <b>bandwidth</b>: same loops, same table, but <b>+</b> becomes <b>min</b> and <b>min</b> becomes <b>max</b>.",
  };
}

function mFib(o) {
  const n = o.n || 6, dp = o.dp === true;
  const F = [];
  if (dp) {
    const table = new Array(n + 1).fill(null);
    let adds = 0;
    const nodes = [];
    const snap = (say, thi) => F.push({ nodes: [], table: table.slice(), thi: thi, say: say, adds: adds, r: 14 });
    snap("Bottom-up dynamic programming: no recursion at all, just a table filled <b>left to right</b>.");
    table[0] = 1; snap("fib(0) = <b>1</b>, known outright.", 0);
    if (n >= 1) { table[1] = 1; snap("fib(1) = <b>1</b>, also known outright. These two are the seeds.", 1); }
    for (let i = 2; i <= n; i++) {
      table[i] = table[i - 1] + table[i - 2]; adds++;
      snap("fib(" + i + ") = fib(" + (i - 1) + ") + fib(" + (i - 2) + ") = " + table[i - 1] + " + " + table[i - 2] + " = <b>" + table[i] + "</b>. One addition, and the answer is stored so it is never computed twice.", i);
    }
    snap("fib(" + n + ") = <b>" + table[n] + "</b> in just <b>" + adds + " additions</b>. Each box is filled exactly once, so the whole thing is <b>Θ(n)</b>.", null);
    return {
      shape: "calls", frames: F, vb: "0 0 360 270",
      reads: f => [["lock", f.adds, "additions"], ["look", f.table.filter(v => v != null).length, "boxes filled"]],
      note: "Compare the counters with the naive version on the same n. Same answer, wildly different price — that is the whole point of dynamic programming.",
    };
  }
  /* naive recursion: build the call tree, in call order, so the repeats are visible */
  const nodes = []; let calls = 0, adds = 0;
  let leafX = 0;
  function build(k, depth, parent) {
    const id = nodes.length;
    nodes.push({ id: id, k: k, p: parent, d: depth, lab: k, cls: "n-idle", x: 0, y: 0 });
    calls++;
    if (k >= 2) { build(k - 1, depth + 1, id); build(k - 2, depth + 1, id); adds++; }
    return id;
  }
  build(n, 0, null);
  const leaves = nodes.filter(nd => nd.k < 2);
  const W = 356, gap = Math.min(26, (W - 24) / Math.max(1, leaves.length - 1));
  let li = 0;
  const setX = id => {
    const kids = nodes.filter(nd => nd.p === id);
    if (!kids.length) { nodes[id].x = 12 + (li++) * gap; return nodes[id].x; }
    const xs = kids.map(kd => setX(kd.id));
    nodes[id].x = (Math.min(...xs) + Math.max(...xs)) / 2;
    return nodes[id].x;
  };
  setX(0);
  nodes.forEach(nd => nd.y = 22 + nd.d * 34);
  /* mark every call whose value was already worked out earlier in the tree */
  const seen = {}, dupes = new Set();
  nodes.forEach((nd, i) => { if (seen[nd.k] != null) dupes.add(i); else seen[nd.k] = i; });
  const r = Math.max(8, 13 - Math.floor(n / 2));
  const F2 = [];
  const shot = (upto, say) => F2.push({
    nodes: nodes.map((nd, i) => Object.assign({}, nd, {
      cls: i > upto ? "n-ghost" : i === upto ? "n-look" : dupes.has(i) ? "n-drop" : "n-lock",
    })),
    say: say, calls: upto + 1, waste: [...dupes].filter(d => d <= upto).length, r: r,
  });
  F2.push({ nodes: nodes.map(nd => Object.assign({}, nd, { cls: "n-ghost" })), calls: 0, waste: 0, r: r,
    say: "Naive recursion for <b>fib(" + n + ")</b>: every call splits into fib(k−1) and fib(k−2), and each of those splits again. Step through and count." });
  /* one frame per call, in the order the machine actually makes them */
  nodes.forEach((nd, i) => {
    const dup = dupes.has(i);
    let say;
    if (nd.k < 2) say = "<b>fib(" + nd.k + ") = 1</b> — a base case, so it returns straight away without splitting.";
    else say = "<b>fib(" + nd.k + ")</b> cannot answer on its own, so it calls <b>fib(" + (nd.k - 1) + ")</b> and <b>fib(" + (nd.k - 2) + ")</b>.";
    if (dup) say = "<b>fib(" + nd.k + ") again.</b> This exact value was already worked out elsewhere in the tree — but plain recursion has no memory, so the whole branch gets rebuilt from scratch. That is the waste, in coral.";
    shot(i, say);
  });
  F2.push({ nodes: nodes.map((nd, i) => Object.assign({}, nd, { cls: dupes.has(i) ? "n-drop" : "n-lock" })),
    calls: nodes.length, waste: dupes.size, r: r,
    say: "<b>" + nodes.length + " calls</b> to answer one question. <b>" + dupes.size + "</b> of them were pure repeats. Add 1 to n and the tree roughly doubles — the cost sits <b>between (3/2)ⁿ and 2ⁿ</b>." });
  return {
    shape: "calls", frames: F2, vb: "0 0 360 " + Math.max(170, 34 + n * 34 + 26),
    reads: f => [["drop", f.calls, "calls made"], ["look", f.waste, "wasted repeats"]],
    note: "Now switch to <b>DP table</b> at the same n, and compare the counters. The tree's calls explode as n grows; the table always needs just <b>n additions</b>. Nothing about the maths changed — only that answers get written down instead of recomputed.",
  };
}

function pgGo(i, fromScrub) {
  if (!PG.frames.length) return;

  PG.seen = new Set();
  SHAPES[PG.built.shape](f);
  sweep();

  const say = document.getElementById("vzsay");
  say.querySelector(".vs-text").innerHTML = f.say;
  say.classList.toggle("done", PG.i === PG.frames.length - 1);
  document.getElementById("vzstep").textContent = (PG.i + 1) + "/" + PG.frames.length;
  if (!fromScrub) document.getElementById("vzrange").value = PG.i;
  document.getElementById("vzprev").disabled = PG.i === 0;
  document.getElementById("vznext").disabled = PG.i === PG.frames.length - 1;

  const reads = PG.built.reads ? PG.built.reads(f) : null;
  const box = document.getElementById("vzreads");
  if (reads) {
    box.style.display = "";
    box.innerHTML = reads.map(([cls, num, lab]) =>
      `<div class="vz-read ${cls}"><div class="vr-num">${num}</div><div class="vr-lab">${lab}</div></div>`).join("");
  } else box.style.display = "none";
}
function pgPause() {
  pgStop();
  const b = document.getElementById("vzplay");
  if (b) b.textContent = PG.i >= PG.frames.length - 1 ? "Replay" : "Play";
}
function pgToggle() {
  if (PG.playing) { snd("pick"); return pgPause(); }
  snd("pick");
  if (PG.i >= PG.frames.length - 1) pgGo(0);
  PG.playing = true;
  document.getElementById("vzplay").textContent = "Pause";
  const tick = () => {
    if (!PG.playing) return;
    if (PG.i >= PG.frames.length - 1) { PG.playing = false; snd("win"); return pgPause(); }
    pgGo(PG.i + 1);
    PG.timer = setTimeout(tick, 1150 / PG.speed);
  };
  PG.timer = setTimeout(tick, 260 / PG.speed);
}

/* ---------- HOME ---------- */

/* ---------- STATS ---------- */
function levelLabel(m, att) {
  if (att < 3) return { cls: "na", txt: "More data needed" };
  if (m < 0.5) return { cls: "weak", txt: "Needs work" };
  if (m < 0.75) return { cls: "mid", txt: "Getting there" };
  return { cls: "strong", txt: "Strong" };
}
function renderStats() {
  S = null;
  window.scrollTo(0, 0);
  const acc = P.totAtt ? Math.round(100 * P.totFirst / P.totAtt) : 0;
  const rows = LEVELS.map(L => {
    const t = P.t[L.id];
    const att = t ? t.att : 0;
    const m = mastery(L.id);
    return { L, att, m: m === null ? 0 : m };
  }).sort((a, b) => (a.att < 3 ? 2 : a.m) - (b.att < 3 ? 2 : b.m));
  const weak = weakTopics(3).slice(0, 3);
  let html = statbarHTML() + `
  <h2 class="stats-h">📊 Your stats</h2>
  <div class="res-cards" style="justify-content:flex-start">
    <div class="res-card gold"><div class="rc-num">⚡ ${P.xp}</div><div class="rc-label">Total XP</div></div>
    <div class="res-card"><div class="rc-num">🔥 ${streakLive()}</div><div class="rc-label">Streak</div></div>
    <div class="res-card"><div class="rc-num">${P.totAtt}</div><div class="rc-label">Answered</div></div>
    <div class="res-card green"><div class="rc-num">${acc}%</div><div class="rc-label">First-try</div></div>
  </div>`;
  if (weak.length) {
    html += `<h2 class="stats-h">💪 Weak spots to attack</h2>`;
    weak.forEach(w => {
      const t = P.t[w.L.id];
      html += `<div class="weakspot">
        <span style="font-size:1.5rem">${w.L.emoji}</span>
        <div class="ws-text">
          <div class="ws-title">${w.L.title}</div>
          <div class="ws-sub">${Math.round(100 * t.first / t.att)}% first-try over ${t.att} answers — ${w.L.blurb}</div>
        </div>
        <button class="btn bad" data-lvl="${LVL_BY_ID[w.L.id].i}">Train</button>
      </div>`;
    });
  } else if (P.totAtt >= 10) {
    html += `<p class="muted">No weak spots right now — every practised topic is at 75%+ mastery. Smart Practice will focus on due reviews and fresh material. 🎉</p>`;
  }
  html += `<h2 class="stats-h">Mastery by topic <span class="muted small" style="font-weight:600">(weakest first)</span></h2>`;
  rows.forEach(r => {
    const lb = levelLabel(r.m, r.att);
    const pct = Math.round(100 * r.m);
    html += `<div class="mastery-row">

      <span class="m-title">${r.L.title} <span class="m-badge ${lb.cls}">${lb.txt}</span></span>
      <span class="m-pct">${r.att < 1 ? "—" : pct + "%"}</span>
      <div class="mbar"><div class="mfill ${lb.cls === "na" ? "" : lb.cls}" style="width:${r.att < 1 ? 0 : pct}%"></div></div>
    </div>`;
  });
  html += `
  <div class="howbox"><b>How Smart Practice picks your questions:</b> every answer updates a per-topic <b>mastery score</b> (recent answers weigh ~30%, so improving shows) and a per-question <b>review box</b> (miss → back tomorrow; nail it → retreats to 1, 3, 7, 14 days). Sessions rank every question by: topic weakness ×2.2 + misses on that exact question ×1.5 + overdue ×1.0 + a dash of randomness, and deal you the top ${SMART_N}.</div>
  <button class="btn ghost" id="back">← Back to path</button>`;

/* ---------- LESSON ---------- */
function startLesson(opt) {
  if (opt.mode === "level") {
    const L = LEVELS[opt.idx];
    if (!P.seenIntro[L.id]) {
      const cards = L.intro.map((c, i) => ({ e: c.e || L.emoji, k: (c.k || L.title) + " · " + (i + 1) + "/" + L.intro.length, t: c.t, v: c.v, f: c.f, code: c.code, gold: !!c.k }));
      return renderCards(cards, { skippable: true, goLabel: "Start lesson", onDone: () => { P.seenIntro[L.id] = true; save(); reallyStart(opt); } });
    }
  }
  reallyStart(opt);
}
function reallyStart(opt) {
  let qs, title;
  if (opt.mode === "quick") {
    const pool = [];
    LEVELS.slice(0, Math.max(1, firstLockedIdx())).forEach(L => L.qs.forEach(q => pool.push(q)));
    qs = shuffle(pool).slice(0, QUICK_N);
    title = "Quick 5";
  } else if (opt.mode === "smart") {
    qs = smartQueue();
    title = "Smart Practice";
  } else {
    const L = LEVELS[opt.idx];
    const unseen = [], missed = [], rest = [];
    L.qs.forEach(q => {
      const st = P.q[q.id];
      if (!st) unseen.push(q);
      else if (st.wrong > 0 && st.box === 0) missed.push(q);
      else rest.push(q);
    });
    qs = shuffle(unseen).concat(shuffle(missed), shuffle(rest)).slice(0, LESSON_N);
    title = L.title;
  }
  S = {
    mode: opt.mode, idx: opt.idx, title,
    queue: qs, retry: [],
    total: qs.length, solved: 0,
    hearts: HEARTS, xp: 0,
    firstTryRight: 0,
    inRetry: false, combo: 0,
    cur: null, sel: -1, phase: "answer",
    topicHits: {},
  };
  nextQuestion();
}
function nextQuestion() {
  if (S.queue.length === 0) {
    if (S.retry.length === 0) return renderResults();
    S.queue = shuffle(S.retry); S.retry = []; S.inRetry = true;
  }
  S.cur = S.queue.shift();
  S.sel = -1; S.phase = "answer";
  renderQuestion();
}
function renderQuestion() {
  window.scrollTo(0, 0);
  const q = S.cur;
  const pct = Math.round(100 * S.solved / S.total);
  const topicTag = (S.mode !== "level") ? `<span class="qtag topic">${LVL_BY_ID[q.lvlId].L.emoji} ${LVL_BY_ID[q.lvlId].L.title}</span>` : "";
  const infoBtn = (S.mode === "level") ? `<button class="infobtn" id="replayintro" title="Recap this topic" aria-label="Recap this topic">i</button>` : "";
  app.innerHTML = `
  <div class="${S.mode === "smart" ? "smart-run" : ""}">
  <div class="lesson-top">
    <button class="quit" aria-label="Quit lesson" title="Quit">✕</button>
    <div class="pbar"><div class="fill" style="width:${pct}%"></div></div>
    ${infoBtn}
    <span class="hearts" aria-label="${S.hearts} hearts left">${"❤️".repeat(S.hearts)}${"🤍".repeat(HEARTS - S.hearts)}</span>
  </div>
  ${S.combo >= 2 ? `<div class="combo">🔥 ${S.combo} in a row</div>` : ""}
  ${S.inRetry ? `<span class="qtag retry">↻ Retry — get it right to finish</span>` : ""}${topicTag}${q.tag && !S.inRetry ? `<span class="qtag">${q.tag}</span>` : ""}
  <p class="qprompt">${q.q}</p>
  ${q.code ? `<div class="qcode">${q.code}</div>` : ""}
  <div class="opts" role="listbox" aria-label="Answers">
    ${q.o.map((o, i) => `<button class="opt" data-i="${i}"><span class="key">${i + 1}</span><span>${o}</span></button>`).join("")}
  </div>
  <div class="spacer"></div>
  <div class="bottom"><div class="inner">
    <button class="btn" id="check" disabled>Check</button>
  </div></div>
  </div>`;
  const qb = app.querySelector(".quit");
  qb.addEventListener("click", () => {
    if (qb.dataset.armed) return renderHome();
    qb.dataset.armed = "1";
    qb.textContent = "leave?";
    qb.style.cssText = "color:var(--bad);font-weight:800;font-size:.9rem";
    setTimeout(() => {
      if (!qb.isConnected) return;
      delete qb.dataset.armed;
      qb.textContent = "✕";
      qb.style.cssText = "";
    }, 2500);
  });
  const ri = document.getElementById("replayintro");
  if (ri) ri.addEventListener("click", () => {
    const L = LEVELS[S.idx];
    S.phase = "intro";
    const cards = L.intro.map((c, i) => ({ e: c.e || L.emoji, k: (c.k || L.title) + " · " + (i + 1) + "/" + L.intro.length, t: c.t, v: c.v, f: c.f, code: c.code, gold: !!c.k }));
    renderCards(cards, { goLabel: "Back to question", onDone: () => { S.sel = -1; S.phase = "answer"; renderQuestion(); } });
  });
  app.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
    snd("pick");
    S.sel = +b.dataset.i;
    app.querySelectorAll(".opt").forEach(x => x.classList.toggle("sel", +x.dataset.i === S.sel));
    document.getElementById("check").disabled = false;
  }));
  document.getElementById("check").addEventListener("click", e => { e.stopPropagation(); check(); });
}
function check() {
  if (S.phase !== "answer" || S.sel < 0) return;
  S.phase = "feedback";
  const q = S.cur, right = S.sel === q.a;
  if (right) S.combo++; else S.combo = 0;
  snd(right ? "right" : "wrong", S.combo - 1);
  app.querySelectorAll(".opt").forEach(b => {
    const i = +b.dataset.i;
    b.disabled = true;
    if (i === q.a) b.classList.add("right");
    else if (i === S.sel && !right) b.classList.add("wrong");
  });
  if (!S.inRetry) {
    record(q, right);
    const th = S.topicHits[q.lvlId] || (S.topicHits[q.lvlId] = { r: 0, n: 0 });
    th.n++; if (right) th.r++;
  }
  const goalBefore = P.dayXP >= DAY_GOAL;
  let gained = 0, comboBonus = 0;
  if (right) {
    gained = S.inRetry ? XP_RETRY : XP_FIRST;
    if (!S.inRetry && S.combo >= 3) comboBonus = XP_COMBO;
    S.xp += gained + comboBonus;
    addXP(gained + comboBonus);
    if (!S.inRetry) S.firstTryRight++;
    S.solved++;
    confetti(S.combo >= 3 ? 26 : 12);
  } else {
    S.hearts--;
    S.retry.push(q);
    const h = app.querySelector(".hearts");
    if (h) h.classList.add("lost");
  }
  save();
  const goalJustHit = !goalBefore && P.dayXP >= DAY_GOAL;
  const bottom = app.querySelector(".bottom");
  bottom.classList.add(right ? "fb-good" : "fb-bad");
  const headline = right
    ? (S.combo >= 3 ? `${["Nice!", "Great!", "On fire!", "Unstoppable!"][Math.min(S.combo - 3, 3)]} +${gained}${comboBonus ? " +" + comboBonus + " combo" : ""} XP` : `Correct! +${gained} XP`)
    : `Not quite — the answer is highlighted`;
  bottom.querySelector(".inner").innerHTML = `
    ${right && !RM ? `<span class="xpfly">+${gained + comboBonus}</span>` : ""}
    <p class="fb-head" role="status">${headline}${goalJustHit ? " · 🏅 daily goal hit!" : ""}</p>
    <p class="fb-why">${q.why}</p>
    <button class="btn ${right ? "good" : "bad"}" id="cont">${right ? "Continue" : (S.hearts === 0 ? "See result" : "Got it")}</button>`;
  if (goalJustHit) { snd("goal"); confetti(40); }
  const proceed = () => {
    if (S.phase !== "feedback") return;
    S.phase = "advancing";
    if (S.hearts === 0) return renderFailed();
    nextQuestion();
  };
  document.getElementById("cont").addEventListener("click", e => { e.stopPropagation(); proceed(); });
  setTimeout(() => bottom.addEventListener("click", proceed), 0);  /* next tick, so the Check tap can't bubble into it */
  document.getElementById("cont").focus();
}
document.addEventListener("keydown", e => {
  if (PG.m && document.getElementById("vzplay")) {
    if (e.key === " ") { e.preventDefault(); pgToggle(); }
    else if (e.key === "ArrowRight") { e.preventDefault(); pgPause(); pgGo(PG.i + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); pgPause(); pgGo(PG.i - 1); }
    return;
  }
  if (cardState) {
    const onBtn = e.target && e.target.tagName === "BUTTON";
    if (e.key === "ArrowRight") { e.preventDefault(); cardNext(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); cardBack(); }
    else if ((e.key === "Enter" || e.key === " ") && !onBtn) { e.preventDefault(); cardNext(); }
    return;
  }
  if (!S || !S.cur) return;
  if (S.phase === "answer") {
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= S.cur.o.length) {
      const b = app.querySelector(`.opt[data-i="${n - 1}"]`);
      if (b) b.click();
    } else if (e.key === "Enter") {
      const c = document.getElementById("check");
      if (c && !c.disabled) c.click();
    }
  } else if (S.phase === "feedback" && e.key === "Enter") {
    const c = document.getElementById("cont");
    if (c) c.click();
  }
});

/* ---------- RESULTS ---------- */
function renderResults() {
  const acc = S.total ? Math.round(100 * S.firstTryRight / S.total) : 0;
  const isLevel = S.mode === "level";
  const wasNew = isLevel && !P.done[LEVELS[S.idx].id];
  if (isLevel) P.done[LEVELS[S.idx].id] = true;
  bumpStreak();
  touchDay();
  const goalHit = P.dayXP >= DAY_GOAL && P.goalDay !== today();
  if (goalHit) P.goalDay = today();
  save();
  snd("win");
  confetti(acc === 100 ? 70 : 40);
  const allDone = firstLockedIdx() === LEVELS.length;
  const topics = Object.keys(S.topicHits);
  const breakdown = (S.mode !== "level" && topics.length)
    ? `<p class="small" style="margin-top:.4rem">${topics.map(id => {
        const th = S.topicHits[id], L = LVL_BY_ID[id].L;

      }).join(" &nbsp; ")}</p>`
    : "";
  app.innerHTML = `
  <div class="center">
    <div class="big-emoji">${acc === 100 ? "🏆" : "🎉"}</div>
    <p class="res-title">${S.mode === "quick" ? "Quick 5 done!" : S.mode === "smart" ? "Smart session done!" : (wasNew ? `Level complete: ${S.title}` : `${S.title} — practised!`)}</p>

    <div class="res-cards">
      <div class="res-card gold"><div class="rc-num" id="xpnum">+0</div><div class="rc-label">XP</div></div>
      <div class="res-card green"><div class="rc-num">${acc}%</div><div class="rc-label">First try</div></div>
      <div class="res-card"><div class="rc-num">🔥 ${streakLive()}</div><div class="rc-label">Streak</div></div>
    </div>
    ${breakdown}
    ${(() => {
      if (!isLevel) return "";
      const left = LEVELS[S.idx].qs.filter(q => !P.q[q.id]).length;
      return left > 0 ? `<p class="small" style="font-weight:800; color: var(--accent)">✨ ${left} fresh question${left === 1 ? "" : "s"} left in this level — replay it to see new ones.</p>` : "";
    })()}
    ${S.mode === "smart" ? `<p class="muted small">Your mastery scores just updated — check 📊 to see the bars move.</p>` : acc < 100 ? `<p class="muted small">Missed ones were re-asked until you beat them. They'll resurface in Smart Practice tomorrow.</p>` : `<p class="muted small">Flawless. These questions retreat to longer review intervals — Smart Practice will bring them back before the exam.</p>`}
    ${allDone && isLevel ? `<p style="font-weight:800">🎓 All 12 levels complete — now let Smart Practice grind your weak spots down until exam day.</p>` : ""}
    <button class="btn" id="home">Continue</button>

}
function renderFailed() {
