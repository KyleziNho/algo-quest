/* ================= PROFILE & ADAPTIVE MODEL ================= */
const XP_FIRST = 10, XP_RETRY = 5, XP_COMBO = 2, HEARTS = 3, QUICK_N = 5, SMART_N = 7, LESSON_N = 7, DAY_GOAL = 30;
const KEY = "cm52070-algo-quest";
const BOX_DAYS = [0, 1, 3, 7, 14];
const EMA_A = 0.3;

function fresh() { return { v: 3, xp: 0, done: {}, streak: 0, lastDay: null, sound: true, q: {}, t: {}, totAtt: 0, totFirst: 0, dayXP: 0, dayDate: null, goalDay: null, onboarded: false, seenIntro: {} }; }
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.v === 3) {
      if (s.introV !== 4) { s.introV = 4; s.seenIntro = {}; }  /* re-show intros once: simpler text + formula/code cards */
      return s;
    }
    if (s && (s.v === 1 || s.v === 2)) {
      const f = fresh();
      f.xp = s.xp || 0; f.done = s.done || {}; f.streak = s.streak || 0; f.lastDay = s.lastDay || null;
      f.sound = s.sound !== false; f.q = s.q || {}; f.t = s.t || {}; f.totAtt = s.totAtt || 0; f.totFirst = s.totFirst || 0;
      f.onboarded = true; /* returning player — don't re-onboard */
      return f;
    }
  } catch (e) {}
  return fresh();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} }
let P = load();

function today() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function touchDay() { const t = today(); if (P.dayDate !== t) { P.dayDate = t; P.dayXP = 0; } }
function addXP(n) { touchDay(); P.xp += n; P.dayXP += n; }

function record(q, right) {
  const now = Date.now();
  const qs = P.q[q.id] || (P.q[q.id] = { box: 0, last: 0, att: 0, wrong: 0 });
  qs.att++; qs.last = now;
  if (right) qs.box = Math.min(qs.box + 1, BOX_DAYS.length - 1);
  else { qs.box = 0; qs.wrong++; }
  const t = P.t[q.lvlId] || (P.t[q.lvlId] = { att: 0, first: 0, ema: 0.5 });
  t.att++; if (right) t.first++;
  t.ema = t.ema * (1 - EMA_A) + (right ? 1 : 0) * EMA_A;
  P.totAtt++; if (right) P.totFirst++;
}
function isDue(q, now) {
  const qs = P.q[q.id];
  if (!qs) return true;
  return (now - qs.last) / 86400000 >= BOX_DAYS[qs.box];
}
function mastery(lvlId) {
  const t = P.t[lvlId];
  if (!t || t.att === 0) return null;
  return 0.5 * (t.first / t.att) + 0.5 * t.ema;
}
function weakTopics(min) {
  return LEVELS
    .map(L => ({ L, m: mastery(L.id), att: (P.t[L.id] || {}).att || 0 }))
    .filter(x => x.att >= (min || 3) && x.m !== null && x.m < 0.75)
    .sort((a, b) => a.m - b.m);
}
function smartQueue() {
  const now = Date.now();
  const unlocked = LEVELS.slice(0, Math.max(1, firstLockedIdx()));
  const pool = [];
  unlocked.forEach(L => L.qs.forEach(q => pool.push(q)));
  const scored = pool.map(q => {
    const qs = P.q[q.id];
    const m = mastery(q.lvlId);
    const weakness = m === null ? 0.5 : 1 - m;
    const missed = qs ? Math.min(qs.wrong, 3) / 3 : 0;
    const due = isDue(q, now) ? 1 : 0;
    const freshB = qs ? 0 : 0.35;
    const doneToday = qs && (now - qs.last) < 36e5 && qs.box > 0 ? 1 : 0;
    const r = Math.random() * 0.5;
    return { q, s: 2.2 * weakness + 1.5 * missed + 1.0 * due + freshB + r - 1.6 * doneToday };
  });
  scored.sort((a, b) => b.s - a.s);
  return shuffle(scored.slice(0, SMART_N).map(x => x.q));
}
function bumpStreak() {
  const t = today();
  if (P.lastDay === t) return;
  const y = new Date(); y.setDate(y.getDate() - 1);
  const yStr = y.getFullYear() + "-" + String(y.getMonth() + 1).padStart(2, "0") + "-" + String(y.getDate()).padStart(2, "0");
  P.streak = (P.lastDay === yStr) ? P.streak + 1 : 1;
  P.lastDay = t;
}
function streakLive() {
  if (!P.lastDay) return 0;
  if (P.lastDay === today()) return P.streak;
  const y = new Date(); y.setDate(y.getDate() - 1);
  const yStr = y.getFullYear() + "-" + String(y.getMonth() + 1).padStart(2, "0") + "-" + String(y.getDate()).padStart(2, "0");
  return (P.lastDay === yStr) ? P.streak : 0;
}
function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function firstLockedIdx() {
  for (let i = 0; i < LEVELS.length; i++) if (!P.done[LEVELS[i].id]) return i;
  return LEVELS.length;
}

/* ================= SOUND ================= */
let AC = null;
function tone(freq, start, dur, type, vol) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || "sine"; o.frequency.value = freq;
  const t0 = AC.currentTime + start;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.18, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(AC.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
function snd(kind, combo) {
  if (!P.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
    if (kind === "pick") tone(700, 0, 0.05, "sine", 0.06);
    if (kind === "right") {
      const r = Math.pow(2, Math.min(combo || 0, 8) / 12);   /* pitch climbs a semitone per combo step */
      tone(659 * r, 0, 0.10, "sine", 0.16); tone(880 * r, 0.09, 0.16, "sine", 0.16);
    }
    if (kind === "wrong") { tone(196, 0, 0.20, "triangle", 0.14); tone(147, 0.10, 0.24, "triangle", 0.12); }
    if (kind === "win") { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.09, 0.16, "sine", 0.15)); tone(1319, 0.36, 0.30, "sine", 0.12); }
    if (kind === "goal") { [784, 988, 1175, 1568].forEach((f, i) => tone(f, i * 0.07, 0.14, "sine", 0.14)); }
    if (kind === "fail") { tone(220, 0, 0.25, "triangle", 0.12); tone(175, 0.18, 0.35, "triangle", 0.12); }
  } catch (e) {}
}

/* ================= CONFETTI ================= */
const CONF_COLORS = ["#F5C542", "#4CC0A6", "#DD7361", "#86ABC9", "#9A8CD8"];
function confetti(n) {
  if (RM) return;
  const w = window.innerWidth;
  for (let i = 0; i < n; i++) {
    const b = document.createElement("div");
    b.className = "confetti-bit";
    const size = 5 + Math.random() * 7;
    b.style.width = size + "px";
    b.style.height = size * (0.6 + Math.random() * 0.8) + "px";
    b.style.left = Math.random() * w + "px";
    b.style.background = CONF_COLORS[Math.floor(Math.random() * CONF_COLORS.length)];
    document.body.appendChild(b);
    const dur = 1100 + Math.random() * 900;
    b.animate([
      { transform: "translateY(0) rotate(0deg)", opacity: 1 },
      { transform: "translateY(" + (window.innerHeight * 0.7 + Math.random() * 200) + "px) rotate(" + (300 + Math.random() * 400) + "deg)", opacity: 0.9, offset: 0.8 },
      { transform: "translateY(" + (window.innerHeight + 40) + "px) rotate(" + (500 + Math.random() * 300) + "deg)", opacity: 0 },
    ], { duration: dur, easing: "cubic-bezier(.2,.5,.6,1)" });
    setTimeout(() => b.remove(), dur);
  }
}
function countUp(el, target, prefix) {
  if (RM) { el.textContent = (prefix || "") + target; return; }
  const t0 = performance.now(), dur = 650;
  function tick(t) {
    const p = Math.min((t - t0) / dur, 1);
    el.textContent = (prefix || "") + Math.round(target * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

/* ================= CARD SCREENS (onboarding / topic intros) ================= */
let cardState = null;
function renderCards(cards, opts) {
  cardState = { cards, i: 0, opts };
  drawCard();
}
function cardNext() {
  if (!cardState) return;
  snd("pick");
  if (cardState.i < cardState.cards.length - 1) { cardState.i++; drawCard(); }
  else { const done = cardState.opts.onDone; cardState = null; done(); }
}
function cardBack() {
  if (!cardState || cardState.i === 0) return;
  snd("pick");
  cardState.i--; drawCard();
}
function drawCard() {
  const { cards, i, opts } = cardState;
  const c = cards[i];
  const last = i === cards.length - 1;
  app.innerHTML = `
  <div class="cardscreen" id="cardtap">
    ${c.v && VIS[c.v] ? `<div class="c-vis">${VIS[c.v]}</div>` : c.f ? `<div class="c-formula">${c.f}</div>` : c.code ? `<pre class="c-code">${c.code}</pre>` : `<span class="c-emoji">${c.e}</span>`}
    ${c.k ? `<span class="c-kicker"${c.gold ? ` style="color:var(--gold)"` : ""}>${c.k}</span>` : ""}
    <p class="c-text">${c.t}</p>
    <div class="cardnav">
      <button class="navbtn" id="cardback" aria-label="Previous card" ${i === 0 ? "disabled" : ""}>‹</button>
      <div class="dots">${cards.map((_, j) => `<span class="dot ${j <= i ? "on" : ""}"></span>`).join("")}</div>
      <button class="navbtn primary" id="cardnext" aria-label="Next card" ${last ? `style="visibility:hidden"` : ""}>›</button>
    </div>
    ${last ? `<button class="btn" id="cardgo" style="max-width:16rem">${opts.goLabel || "Let's go"}</button>` : `<span class="c-hint">tap, swipe, or ‹ ›</span>`}
    ${opts.skippable && !last ? `<button class="skip" id="cardskip">skip intro</button>` : ""}
  </div>`;
  const tap = document.getElementById("cardtap");
  tap.addEventListener("click", e => {
    if (e.target.closest("button")) return;
    cardNext();
  });
  let sx = null;
  tap.addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, { passive: true });
  tap.addEventListener("touchend", e => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx;
    sx = null;
    if (dx < -40) cardNext();
    else if (dx > 40) cardBack();
  }, { passive: true });
  document.getElementById("cardback").addEventListener("click", cardBack);
  const nx = document.getElementById("cardnext");
  if (nx) nx.addEventListener("click", cardNext);
  const sk = document.getElementById("cardskip");
  if (sk) sk.addEventListener("click", () => { const done = cardState.opts.onDone; cardState = null; done(); });
  const go = document.getElementById("cardgo");
  if (go) { go.addEventListener("click", cardNext); go.focus(); } else if (nx) nx.focus();
}

/* ---------- STATS ---------- */
function levelLabel(m, att) {
  if (att < 3) return { cls: "na", txt: "More data needed" };
  if (m < 0.5) return { cls: "weak", txt: "Needs work" };
  if (m < 0.75) return { cls: "mid", txt: "Getting there" };
  return { cls: "strong", txt: "Strong" };
}
function renderStats() {

  window.scrollTo(0, 0);

        <span style="font-size:1.5rem">${w.L.emoji}</span>
        <div class="ws-text">
          <div class="ws-title">${w.L.title}</div>
          <div class="ws-sub">${Math.round(100 * t.first / t.att)}% first-try over ${t.att} answers — ${w.L.blurb}</div>

  html += `

/* ---------- LESSON ---------- */
function startLesson(opt) {
  if (opt.mode === "level") {
    const L = LEVELS[opt.idx];
    if (!P.seenIntro[L.id]) {
      const cards = L.intro.map((c, i) => ({ e: c.e || L.emoji, k: (c.k || L.title) + " · " + (i + 1) + "/" + L.intro.length, t: c.t, v: c.v, f: c.f, code: c.code, gold: !!c.k }));
      return renderCards(cards, { skippable: true, goLabel: "Start lesson", onDone: () => { P.seenIntro[L.id] = true; save(); reallyStart(opt); } });
    }
  }
  reallyStart(opt);
}
function reallyStart(opt) {
  let qs, title;
  if (opt.mode === "quick") {
    const pool = [];
    LEVELS.slice(0, Math.max(1, firstLockedIdx())).forEach(L => L.qs.forEach(q => pool.push(q)));
    qs = shuffle(pool).slice(0, QUICK_N);
    title = "Quick 5";
  } else if (opt.mode === "smart") {
    qs = smartQueue();
    title = "Smart Practice";
  } else {
    const L = LEVELS[opt.idx];
    const unseen = [], missed = [], rest = [];
    L.qs.forEach(q => {
      const st = P.q[q.id];
      if (!st) unseen.push(q);
      else if (st.wrong > 0 && st.box === 0) missed.push(q);
      else rest.push(q);
    });
    qs = shuffle(unseen).concat(shuffle(missed), shuffle(rest)).slice(0, LESSON_N);
    title = L.title;
  }
  S = {
    mode: opt.mode, idx: opt.idx, title,
    queue: qs, retry: [],
    total: qs.length, solved: 0,
    hearts: HEARTS, xp: 0,
    firstTryRight: 0,
    inRetry: false, combo: 0,
    cur: null, sel: -1, phase: "answer",
    topicHits: {},
  };
  nextQuestion();
}
function nextQuestion() {
  if (S.queue.length === 0) {
    if (S.retry.length === 0) return renderResults();
    S.queue = shuffle(S.retry); S.retry = []; S.inRetry = true;
  }
  S.cur = S.queue.shift();
  S.sel = -1; S.phase = "answer";
  renderQuestion();
}
function renderQuestion() {
  window.scrollTo(0, 0);
  const q = S.cur;
  const pct = Math.round(100 * S.solved / S.total);
  const topicTag = (S.mode !== "level") ? `<span class="qtag topic">${LVL_BY_ID[q.lvlId].L.emoji} ${LVL_BY_ID[q.lvlId].L.title}</span>` : "";
  const infoBtn = (S.mode === "level") ? `<button class="infobtn" id="replayintro" title="Recap this topic" aria-label="Recap this topic">i</button>` : "";
  app.innerHTML = `
  <div class="${S.mode === "smart" ? "smart-run" : ""}">
  <div class="lesson-top">
    <button class="quit" aria-label="Quit lesson" title="Quit">✕</button>
    <div class="pbar"><div class="fill" style="width:${pct}%"></div></div>
    ${infoBtn}
    <span class="hearts" aria-label="${S.hearts} hearts left">${"❤️".repeat(S.hearts)}${"🤍".repeat(HEARTS - S.hearts)}</span>
  </div>
  ${S.combo >= 2 ? `<div class="combo">🔥 ${S.combo} in a row</div>` : ""}
  ${S.inRetry ? `<span class="qtag retry">↻ Retry — get it right to finish</span>` : ""}${topicTag}${q.tag && !S.inRetry ? `<span class="qtag">${q.tag}</span>` : ""}
  <p class="qprompt">${q.q}</p>
  ${q.code ? `<div class="qcode">${q.code}</div>` : ""}
  <div class="opts" role="listbox" aria-label="Answers">
    ${q.o.map((o, i) => `<button class="opt" data-i="${i}"><span class="key">${i + 1}</span><span>${o}</span></button>`).join("")}
  </div>
  <div class="spacer"></div>
  <div class="bottom"><div class="inner">
    <button class="btn" id="check" disabled>Check</button>
  </div></div>
  </div>`;
  const qb = app.querySelector(".quit");
  qb.addEventListener("click", () => {
    if (qb.dataset.armed) return renderHome();
    qb.dataset.armed = "1";
    qb.textContent = "leave?";
    qb.style.cssText = "color:var(--bad);font-weight:800;font-size:.9rem";
    setTimeout(() => {
      if (!qb.isConnected) return;
      delete qb.dataset.armed;
      qb.textContent = "✕";
      qb.style.cssText = "";
    }, 2500);
  });
  const ri = document.getElementById("replayintro");
  if (ri) ri.addEventListener("click", () => {
    const L = LEVELS[S.idx];
    S.phase = "intro";
    const cards = L.intro.map((c, i) => ({ e: c.e || L.emoji, k: (c.k || L.title) + " · " + (i + 1) + "/" + L.intro.length, t: c.t, v: c.v, f: c.f, code: c.code, gold: !!c.k }));
    renderCards(cards, { goLabel: "Back to question", onDone: () => { S.sel = -1; S.phase = "answer"; renderQuestion(); } });
  });
  app.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
    snd("pick");
    S.sel = +b.dataset.i;
    app.querySelectorAll(".opt").forEach(x => x.classList.toggle("sel", +x.dataset.i === S.sel));
    document.getElementById("check").disabled = false;
  }));
  document.getElementById("check").addEventListener("click", e => { e.stopPropagation(); check(); });
}
function check() {
  if (S.phase !== "answer" || S.sel < 0) return;
  S.phase = "feedback";
  const q = S.cur, right = S.sel === q.a;
  if (right) S.combo++; else S.combo = 0;
  snd(right ? "right" : "wrong", S.combo - 1);
  app.querySelectorAll(".opt").forEach(b => {
    const i = +b.dataset.i;
    b.disabled = true;
    if (i === q.a) b.classList.add("right");
    else if (i === S.sel && !right) b.classList.add("wrong");
  });
  if (!S.inRetry) {
    record(q, right);
    const th = S.topicHits[q.lvlId] || (S.topicHits[q.lvlId] = { r: 0, n: 0 });
    th.n++; if (right) th.r++;
  }
  const goalBefore = P.dayXP >= DAY_GOAL;
  let gained = 0, comboBonus = 0;
  if (right) {
    gained = S.inRetry ? XP_RETRY : XP_FIRST;
    if (!S.inRetry && S.combo >= 3) comboBonus = XP_COMBO;
    S.xp += gained + comboBonus;
    addXP(gained + comboBonus);
    if (!S.inRetry) S.firstTryRight++;
    S.solved++;
    confetti(S.combo >= 3 ? 26 : 12);
  } else {
    S.hearts--;
    S.retry.push(q);
    const h = app.querySelector(".hearts");
    if (h) h.classList.add("lost");
  }
  save();
  const goalJustHit = !goalBefore && P.dayXP >= DAY_GOAL;
  const bottom = app.querySelector(".bottom");
  bottom.classList.add(right ? "fb-good" : "fb-bad");
  const headline = right
    ? (S.combo >= 3 ? `${["Nice!", "Great!", "On fire!", "Unstoppable!"][Math.min(S.combo - 3, 3)]} +${gained}${comboBonus ? " +" + comboBonus + " combo" : ""} XP` : `Correct! +${gained} XP`)
    : `Not quite — the answer is highlighted`;
  bottom.querySelector(".inner").innerHTML = `
    ${right && !RM ? `<span class="xpfly">+${gained + comboBonus}</span>` : ""}
    <p class="fb-head" role="status">${headline}${goalJustHit ? " · 🏅 daily goal hit!" : ""}</p>
    <p class="fb-why">${q.why}</p>
    <button class="btn ${right ? "good" : "bad"}" id="cont">${right ? "Continue" : (S.hearts === 0 ? "See result" : "Got it")}</button>`;
  if (goalJustHit) { snd("goal"); confetti(40); }
  const proceed = () => {
    if (S.phase !== "feedback") return;
    S.phase = "advancing";
    if (S.hearts === 0) return renderFailed();
    nextQuestion();
  };
  document.getElementById("cont").addEventListener("click", e => { e.stopPropagation(); proceed(); });
  setTimeout(() => bottom.addEventListener("click", proceed), 0);  /* next tick, so the Check tap can't bubble into it */
  document.getElementById("cont").focus();
}
document.addEventListener("keydown", e => {
  if (cardState) {
    const onBtn = e.target && e.target.tagName === "BUTTON";
    if (e.key === "ArrowRight") { e.preventDefault(); cardNext(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); cardBack(); }
    else if ((e.key === "Enter" || e.key === " ") && !onBtn) { e.preventDefault(); cardNext(); }
    return;
  }
  if (!S || !S.cur) return;
  if (S.phase === "answer") {
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= S.cur.o.length) {
      const b = app.querySelector(`.opt[data-i="${n - 1}"]`);
      if (b) b.click();
    } else if (e.key === "Enter") {
      const c = document.getElementById("check");
      if (c && !c.disabled) c.click();
    }
  } else if (S.phase === "feedback" && e.key === "Enter") {
    const c = document.getElementById("cont");
    if (c) c.click();
  }
});

/* ---------- RESULTS ---------- */
function renderResults() {
  const acc = S.total ? Math.round(100 * S.firstTryRight / S.total) : 0;
  const isLevel = S.mode === "level";
  const wasNew = isLevel && !P.done[LEVELS[S.idx].id];
  if (isLevel) P.done[LEVELS[S.idx].id] = true;
  bumpStreak();
  touchDay();
  const goalHit = P.dayXP >= DAY_GOAL && P.goalDay !== today();
  if (goalHit) P.goalDay = today();
  save();
  snd("win");
  confetti(acc === 100 ? 70 : 40);
  const allDone = firstLockedIdx() === LEVELS.length;
  const topics = Object.keys(S.topicHits);
  const breakdown = (S.mode !== "level" && topics.length)
    ? `<p class="small" style="margin-top:.4rem">${topics.map(id => {
        const th = S.topicHits[id], L = LVL_BY_ID[id].L;
        return `${L.emoji} ${th.r}/${th.n}`;
      }).join(" &nbsp; ")}</p>`
    : "";
  app.innerHTML = `
  <div class="center">
    <div class="big-emoji">${acc === 100 ? "🏆" : "🎉"}</div>
    <p class="res-title">${S.mode === "quick" ? "Quick 5 done!" : S.mode === "smart" ? "Smart session done!" : (wasNew ? `Level complete: ${S.title}` : `${S.title} — practised!`)}</p>
    ${goalHit ? `<div class="goalbanner">🏅 Daily goal smashed — flame secured for today</div>` : ""}
    <div class="res-cards">
      <div class="res-card gold"><div class="rc-num" id="xpnum">+0</div><div class="rc-label">XP</div></div>
      <div class="res-card green"><div class="rc-num">${acc}%</div><div class="rc-label">First try</div></div>
      <div class="res-card"><div class="rc-num">🔥 ${streakLive()}</div><div class="rc-label">Streak</div></div>
    </div>
    ${breakdown}
    ${(() => {
      if (!isLevel) return "";
      const left = LEVELS[S.idx].qs.filter(q => !P.q[q.id]).length;
      return left > 0 ? `<p class="small" style="font-weight:800; color: var(--accent)">✨ ${left} fresh question${left === 1 ? "" : "s"} left in this level — replay it to see new ones.</p>` : "";
    })()}
    ${S.mode === "smart" ? `<p class="muted small">Your mastery scores just updated — check 📊 to see the bars move.</p>` : acc < 100 ? `<p class="muted small">Missed ones were re-asked until you beat them. They'll resurface in Smart Practice tomorrow.</p>` : `<p class="muted small">Flawless. These questions retreat to longer review intervals — Smart Practice will bring them back before the exam.</p>`}
    ${allDone && isLevel ? `<p style="font-weight:800">🎓 All 12 levels complete — now let Smart Practice grind your weak spots down until exam day.</p>` : ""}
    <button class="btn" id="home">Continue</button>
  </div>`;
  countUp(document.getElementById("xpnum"), S.xp, "+");
  document.getElementById("home").addEventListener("click", renderHome);
  document.getElementById("home").focus();
}
function renderFailed() {
  snd("fail");
  app.innerHTML = `
  <div class="center">
    <div class="big-emoji">💔</div>
    <p class="res-title">Out of hearts!</p>
    <p class="muted">No harm done — XP you earned is banked (+${S.xp}), and your stats recorded what to work on. The re-shuffle will feel easier.</p>
    <div style="display:flex; flex-direction:column; gap:.6rem; max-width:18rem; margin:1.4rem auto 0">
      <button class="btn" id="retry">Try again</button>
      <button class="btn ghost" id="home">Back to path</button>
    </div>
  </div>`;
  document.getElementById("retry").addEventListener("click", () => reallyStart({ mode: S.mode, idx: S.idx }));
  document.getElementById("home").addEventListener("click", renderHome);
}

renderHome();

if ("serviceWorker" in navigator && location.protocol === "https:") {
  addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script>
</body>
</html>
