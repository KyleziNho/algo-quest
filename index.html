<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Algo Quest — a bite-size, Duolingo-style revision game for CM52070 Algorithms and Complexity.">
<meta name="theme-color" content="#F2F5F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12171A" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Algo Quest">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Algo Quest · CM52070</title>
<style>
  :root {
    --bg: #F2F5F3;
    --surface: #FFFFFF;
    --ink: #21302C;
    --muted: #64756F;
    --line: #D9E2DD;
    --accent: #12866C;
    --accent-deep: #0C6350;
    --accent-soft: #DFF0EA;
    --gold: #B98A1C;
    --gold-soft: #F6ECD4;
    --good: #2E9E63;
    --good-deep: #237C4D;
    --good-soft: #DFF2E6;
    --bad: #C94F3D;
    --bad-deep: #A03A2B;
    --bad-soft: #F8E5E1;
    --locked: #C4CFC9;
    --code-bg: #EAF0ED;
    --purple: #6B5CA8;
    --purple-deep: #55488A;
    --purple-soft: #EBE7F6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12171A; --surface: #1B2225; --ink: #E3E8E5; --muted: #93A29B; --line: #2B3538;
      --accent: #3FBC9C; --accent-deep: #2E9179; --accent-soft: #1C2F2A;
      --gold: #D8AC4A; --gold-soft: #32291A;
      --good: #46B47C; --good-deep: #338A5E; --good-soft: #1C2F24;
      --bad: #DD7361; --bad-deep: #B25243; --bad-soft: #33211D;
      --locked: #3A4548; --code-bg: #232C2F;
      --purple: #9A8CD8; --purple-deep: #7A6DB5; --purple-soft: #262133;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12171A; --surface: #1B2225; --ink: #E3E8E5; --muted: #93A29B; --line: #2B3538;
    --accent: #3FBC9C; --accent-deep: #2E9179; --accent-soft: #1C2F2A;
    --gold: #D8AC4A; --gold-soft: #32291A;
    --good: #46B47C; --good-deep: #338A5E; --good-soft: #1C2F24;
    --bad: #DD7361; --bad-deep: #B25243; --bad-soft: #33211D;
    --locked: #3A4548; --code-bg: #232C2F;
    --purple: #9A8CD8; --purple-deep: #7A6DB5; --purple-soft: #262133;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: ui-rounded, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: contain;
  }
  #app {
    max-width: 34rem; margin: 0 auto; min-height: 100%;
    padding: 0
      max(1rem, env(safe-area-inset-right))
      calc(4rem + env(safe-area-inset-bottom))
      max(1rem, env(safe-area-inset-left));
  }

  button {
    font: inherit; color: inherit; cursor: pointer;
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .btn {
    display: block; width: 100%;
    background: var(--accent); color: #fff;
    border: none; border-bottom: 4px solid var(--accent-deep);
    border-radius: 14px;
    padding: .85rem 1rem;
    font-size: 1.05rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase;
    transition: transform .06s ease;
  }
  .btn:active { transform: translateY(2px); border-bottom-width: 2px; }
  .btn[disabled] { background: var(--locked); border-bottom-color: var(--locked); color: var(--surface); cursor: default; }
  .btn.ghost { background: var(--surface); color: var(--accent); border: 2px solid var(--line); border-bottom: 4px solid var(--line); }
  .btn.good { background: var(--good); border-bottom-color: var(--good-deep); }
  .btn.bad { background: var(--bad); border-bottom-color: var(--bad-deep); }
  .btn.smart { background: var(--purple); border-bottom-color: var(--purple-deep); }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  .statbar {
    position: sticky; top: 0; z-index: 5;
    display: flex; gap: .5rem; align-items: center;
    padding: calc(.8rem + env(safe-area-inset-top)) 0 .6rem;
    background: var(--bg);
    border-bottom: 2px solid var(--line);
    margin-bottom: 1rem;
  }
  .statbar .brand { font-weight: 900; font-size: 1.05rem; margin-right: auto; }
  .stat {
    display: flex; align-items: center; gap: .3rem;
    background: var(--surface); border: 2px solid var(--line);
    border-radius: 999px; padding: .2rem .65rem;
    font-weight: 800; font-variant-numeric: tabular-nums; font-size: .92rem;
  }
  .stat.fire { color: var(--bad); }
  .stat.goal { color: var(--muted); }
  .stat.goal.hit { color: var(--gold); border-color: var(--gold); }
  .iconbtn {
    background: var(--surface); border: 2px solid var(--line);
    border-radius: 999px; width: 2.1rem; height: 2.1rem;
    display: grid; place-items: center; font-size: 1rem; padding: 0;
  }

  /* continue hero */
  .hero {
    display: flex; align-items: center; gap: .9rem;
    background: var(--accent); color: #fff;
    border: none; border-bottom: 5px solid var(--accent-deep);
    border-radius: 16px; padding: 1rem 1.2rem; width: 100%;
    text-align: left; margin: .2rem 0 1rem;
    transition: transform .06s ease;
  }
  .hero:active { transform: translateY(2px); border-bottom-width: 3px; }
  .hero .h-emoji { font-size: 2rem; }
  .hero .h-kicker { font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; font-weight: 800; opacity: .85; }
  .hero .h-title { font-weight: 900; font-size: 1.15rem; }
  .hero .h-go { margin-left: auto; font-size: 1.4rem; }

  .unit-head { background: var(--accent); color: #fff; border-radius: 14px; padding: .8rem 1.1rem; margin: 1.6rem 0 1.2rem; }
  .unit-head .u-label { font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; font-weight: 800; opacity: .85; }
  .unit-head .u-title { font-weight: 900; font-size: 1.1rem; }
  .path { display: flex; flex-direction: column; align-items: center; gap: 1.05rem; }
  .node-wrap { display: flex; flex-direction: column; align-items: center; width: 9.5rem; position: relative; }
  .node {
    width: 4.4rem; height: 4.4rem; border-radius: 50%;
    font-size: 1.7rem; display: grid; place-items: center;
    background: var(--surface);
    border: 3px solid var(--line); border-bottom-width: 6px;
    position: relative;
    transition: transform .06s ease;
  }
  .node:active { transform: translateY(2px); }
  .node.avail { border-color: var(--accent); background: var(--accent-soft); }
  .node.done { border-color: var(--gold); background: var(--gold-soft); }
  .node.weak { border-color: var(--bad); }
  .node.locked { filter: grayscale(1); opacity: .55; cursor: default; }
  .node .tick {
    position: absolute; right: -4px; bottom: -4px;
    background: var(--gold); color: #fff;
    width: 1.5rem; height: 1.5rem; border-radius: 50%;
    display: grid; place-items: center;
    font-size: .8rem; font-weight: 900;
    border: 2px solid var(--bg);
  }
  .node .weakdot {
    position: absolute; left: -4px; top: -4px;
    background: var(--bad); color: #fff;
    border-radius: 999px; font-size: .62rem; font-weight: 900;
    padding: .05rem .4rem; border: 2px solid var(--bg);
  }
  .node-label { font-size: .78rem; font-weight: 700; color: var(--muted); text-align: center; margin-top: .35rem; }
  .start-pill {
    font-size: .68rem; font-weight: 900; letter-spacing: .1em;
    color: var(--accent); background: var(--surface);
    border: 2px solid var(--accent);
    border-radius: 999px; padding: .1rem .6rem; margin-bottom: .3rem;
    animation: bob 1.2s ease-in-out infinite alternate;
  }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-4px); } }

  .quickcard {
    background: var(--surface); border: 2px solid var(--line); border-radius: 14px;
    padding: 1rem 1.1rem; margin: 1rem 0; display: flex; gap: .9rem; align-items: center;
  }
  .quickcard.smartcard { border-color: var(--purple); background: var(--purple-soft); }
  .quickcard .qc-emoji { font-size: 1.8rem; }
  .quickcard .qc-text { flex: 1; }
  .quickcard .qc-title { font-weight: 900; }
  .quickcard .qc-sub { color: var(--muted); font-size: .86rem; }
  .smartcard .qc-sub b { color: var(--purple); }
  .quickcard .btn { width: auto; padding: .55rem .9rem; font-size: .85rem; }

  /* ===== cards (onboarding + topic intros) ===== */
  .cardscreen {
    min-height: 88vh;
    min-height: 88dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 1rem; cursor: pointer;
    padding: 1rem;
  }
  .cardscreen .c-emoji { font-size: 4.2rem; animation: pop .35s ease; }
  .cardscreen .c-vis { width: min(330px, 92vw); animation: pop .35s ease; }
  .cardscreen .c-vis svg { width: 100%; height: auto; display: block; font-family: inherit; }
  .cardscreen .c-formula {
    background: var(--surface); border: 2px solid var(--line); border-radius: 16px;
    padding: 1.2rem 1.5rem; max-width: min(330px, 92vw); animation: pop .35s ease;
  }
  .c-formula .fx {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 1.35rem; font-weight: 700; line-height: 1.7; letter-spacing: .01em;
  }
  .c-formula .flegend {
    display: flex; gap: .5rem 1.1rem; justify-content: center; flex-wrap: wrap;
    margin-top: .7rem; font-size: .78rem; font-weight: 800; color: var(--muted);
  }
  .fa { color: var(--accent); } .fb { color: var(--gold); } .fc { color: var(--purple); } .fd { color: var(--bad); }
  .cardscreen .c-code {
    text-align: left; margin: 0;
    background: var(--code-bg); border: 2px solid var(--line); border-radius: 14px;
    padding: 1rem 1.3rem; max-width: min(330px, 92vw); overflow-x: auto;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 1rem; font-weight: 600; line-height: 1.7; white-space: pre;
    animation: pop .35s ease;
  }
  .c-code .fa, .c-code .fc { font-weight: 800; }
  .cardscreen .c-kicker { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-weight: 800; }
  .cardscreen .c-text { font-size: 1.35rem; font-weight: 800; max-width: 22rem; text-wrap: balance; animation: rise .35s ease; }
  .cardscreen .c-hint { color: var(--muted); font-size: .85rem; }
  .cardscreen .dots { display: flex; gap: .45rem; margin-top: .6rem; }
  .cardscreen .dot { width: .55rem; height: .55rem; border-radius: 50%; background: var(--line); }
  .cardscreen .dot.on { background: var(--accent); }
  .cardscreen .btn { max-width: 16rem; margin-top: .5rem; }
  .cardscreen .skip { background: none; border: none; color: var(--muted); font-size: .85rem; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
  .cardnav { display: flex; align-items: center; gap: 1.1rem; margin-top: .5rem; }
  .navbtn {
    width: 3rem; height: 3rem; border-radius: 50%;
    background: var(--surface); color: var(--accent);
    border: 2px solid var(--line); border-bottom: 4px solid var(--line);
    font-size: 1.5rem; font-weight: 900; line-height: 1;
    display: grid; place-items: center; padding: 0 0 .15rem;
    transition: transform .06s ease;
  }
  .navbtn:active { transform: translateY(2px); border-bottom-width: 2px; }
  .navbtn[disabled] { opacity: .35; cursor: default; }
  .navbtn[disabled]:active { transform: none; border-bottom-width: 4px; }
  .navbtn.primary { background: var(--accent); color: #fff; border-color: var(--accent-deep); }
  .cardscreen .dots { margin-top: 0; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .lesson-top { display: flex; align-items: center; gap: .7rem; padding: 1rem 0 .6rem; }
  .quit { background: none; border: none; font-size: 1.3rem; color: var(--muted); padding: .2rem .4rem; }
  .pbar { flex: 1; height: 14px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .pbar .fill { height: 100%; width: 0%; background: var(--accent); border-radius: 999px; transition: width .25s ease; }
  .smart-run .pbar .fill { background: var(--purple); }
  .hearts { font-weight: 900; color: var(--bad); font-size: .98rem; white-space: nowrap; }
  .hearts.lost { animation: shake .35s ease; }
  .infobtn { background: none; border: 2px solid var(--line); border-radius: 999px; width: 1.7rem; height: 1.7rem; display: grid; place-items: center; font-size: .8rem; color: var(--muted); padding: 0; }

  .combo {
    position: fixed; top: calc(4.2rem + env(safe-area-inset-top)); right: max(1rem, env(safe-area-inset-right)); z-index: 20;
    background: var(--gold); color: #fff;
    font-weight: 900; font-size: .9rem;
    border-radius: 999px; padding: .25rem .8rem;
    animation: comboIn .3s cubic-bezier(.2, 1.6, .4, 1);
    pointer-events: none;
  }
  @keyframes comboIn { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .qtag {
    display: inline-block;
    font-size: .68rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
    color: var(--gold); background: var(--gold-soft);
    padding: .12rem .55rem; border-radius: 6px; margin: 0 .3rem .5rem 0;
  }
  .qtag.topic { color: var(--purple); background: var(--purple-soft); }
  .qtag.retry { color: var(--bad); background: var(--bad-soft); }
  .qprompt { font-size: 1.12rem; font-weight: 800; margin: .2rem 0 1rem; text-wrap: balance; }
  .qcode {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: .86rem;
    background: var(--code-bg); border: 2px solid var(--line); border-radius: 10px;
    padding: .7rem .9rem; margin: 0 0 1rem;
    overflow-x: auto; white-space: pre; line-height: 1.5;
  }
  .opts { display: flex; flex-direction: column; gap: .6rem; }
  .opt {
    text-align: left;
    background: var(--surface);
    border: 2px solid var(--line); border-bottom-width: 4px;
    border-radius: 12px;
    padding: .7rem .95rem;
    font-size: .98rem; font-weight: 600;
    display: flex; gap: .7rem; align-items: baseline;
    transition: transform .05s ease;
  }
  .opt:active { transform: translateY(1px); }
  .opt .key {
    font-size: .72rem; font-weight: 800; color: var(--muted);
    border: 1.5px solid var(--line); border-radius: 6px;
    padding: .02rem .4rem; flex: none;
  }
  .opt.sel { border-color: var(--accent); background: var(--accent-soft); }
  .opt.sel .key { color: var(--accent); border-color: var(--accent); }
  .opt.right { border-color: var(--good); background: var(--good-soft); animation: bounce .4s ease; }
  .opt.wrong { border-color: var(--bad); background: var(--bad-soft); animation: shake .4s ease; }
  .opt[disabled] { cursor: default; }
  .opt code, .qprompt code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; background: var(--code-bg); border-radius: 4px; padding: .05em .3em; font-size: .9em; }
  @keyframes bounce { 0% { transform: scale(1); } 35% { transform: scale(1.04); } 70% { transform: scale(.99); } 100% { transform: scale(1); } }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }

  .bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 2px solid var(--line); touch-action: manipulation; }
  .bottom .inner {
    max-width: 34rem; margin: 0 auto; position: relative;
    padding: .9rem
      max(1rem, env(safe-area-inset-right))
      calc(.9rem + env(safe-area-inset-bottom))
      max(1rem, env(safe-area-inset-left));
  }
  .bottom.fb-good { background: var(--good-soft); border-top-color: var(--good); cursor: pointer; }
  .bottom.fb-bad { background: var(--bad-soft); border-top-color: var(--bad); cursor: pointer; }
  .fb-head { font-weight: 900; font-size: 1.05rem; margin: 0 0 .15rem; }
  .fb-good .fb-head { color: var(--good-deep); }
  .fb-bad .fb-head { color: var(--bad-deep); }
  .fb-why { font-size: .92rem; margin: 0 0 .7rem; }
  .xpfly {
    position: absolute; right: 1.2rem; top: -0.4rem;
    font-weight: 900; color: var(--gold); font-size: 1.1rem;
    animation: flyup 1s ease forwards; pointer-events: none;
  }
  @keyframes flyup { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-2.4rem); } }
  .spacer { height: calc(10rem + env(safe-area-inset-bottom)); }

  .center { text-align: center; padding-top: 3rem; }
  .big-emoji { font-size: 3.6rem; animation: pop .4s ease; }
  @keyframes pop { from { transform: scale(.4); } to { transform: scale(1); } }
  .res-title { font-size: 1.5rem; font-weight: 900; margin: .6rem 0 1.2rem; }
  .res-cards { display: flex; gap: .7rem; justify-content: center; margin-bottom: 1.6rem; flex-wrap: wrap; }
  .res-card { background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: .6rem 1rem; min-width: 6.2rem; }
  .res-card .rc-num { font-size: 1.3rem; font-weight: 900; font-variant-numeric: tabular-nums; }
  .res-card .rc-label { font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .res-card.gold .rc-num { color: var(--gold); }
  .res-card.green .rc-num { color: var(--good); }
  .goalbanner {
    background: var(--gold-soft); color: var(--gold);
    font-weight: 900; border-radius: 12px; padding: .6rem 1rem;
    margin: 0 auto 1rem; max-width: 20rem;
    animation: pop .4s ease;
  }
  .muted { color: var(--muted); }
  .small { font-size: .86rem; }

  .stats-h { font-size: 1.35rem; font-weight: 900; margin: 1.2rem 0 .8rem; }
  .mastery-row {
    background: var(--surface); border: 2px solid var(--line); border-radius: 12px;
    padding: .7rem .9rem; margin: .5rem 0;
    display: grid; grid-template-columns: 2.1rem 1fr auto; gap: .35rem .7rem; align-items: center;
  }
  .mastery-row .m-emoji { font-size: 1.4rem; grid-row: span 2; }
  .mastery-row .m-title { font-weight: 800; font-size: .95rem; display: flex; gap: .5rem; align-items: baseline; flex-wrap: wrap; }
  .m-badge { font-size: .64rem; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; border-radius: 5px; padding: .08rem .4rem; }
  .m-badge.weak { color: var(--bad); background: var(--bad-soft); }
  .m-badge.mid { color: var(--gold); background: var(--gold-soft); }
  .m-badge.strong { color: var(--good); background: var(--good-soft); }
  .m-badge.na { color: var(--muted); background: var(--code-bg); }
  .mastery-row .m-pct { font-weight: 900; font-variant-numeric: tabular-nums; color: var(--muted); font-size: .9rem; grid-row: span 2; }
  .mbar { grid-column: 2; height: 10px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .mbar .mfill { height: 100%; border-radius: 999px; background: var(--good); transition: width .6s ease; }
  .mbar .mfill.weak { background: var(--bad); }
  .mbar .mfill.mid { background: var(--gold); }
  .weakspot {
    background: var(--surface); border: 2px solid var(--bad); border-radius: 12px;
    padding: .8rem 1rem; margin: .5rem 0;
    display: flex; gap: .8rem; align-items: center;
  }
  .weakspot .ws-text { flex: 1; }
  .weakspot .ws-title { font-weight: 900; }
  .weakspot .ws-sub { font-size: .84rem; color: var(--muted); }
  .weakspot .btn { width: auto; padding: .5rem .8rem; font-size: .8rem; }
  .howbox { background: var(--purple-soft); border-radius: 12px; padding: .8rem 1rem; font-size: .88rem; margin: 1rem 0; }
  .howbox b { color: var(--purple); }

  .confetti-bit { position: fixed; top: -20px; z-index: 100; pointer-events: none; border-radius: 3px; }

  /* touch devices: bigger targets, no keyboard hints */
  @media (pointer: coarse) {
    .iconbtn { width: 2.6rem; height: 2.6rem; font-size: 1.15rem; }
    .infobtn { width: 2.1rem; height: 2.1rem; }
    .quit { padding: .4rem .7rem; }
    .opt { padding: .85rem 1rem; }
    .opt .key { display: none; }
  }
  /* small phones: keep the stat bar on one line */
  @media (max-width: 380px) {
    .statbar { gap: .35rem; }
    .statbar .brand { font-size: .95rem; }
    .stat { padding: .2rem .5rem; font-size: .85rem; }
    .hero { padding: .9rem 1rem; }
  }

  /* ===================== PLAYGROUND ===================== */
  /* One colour language for every machine:
     idle = nothing yet · look = examining now · lock = finalised
     path = the answer · drop = rejected/worse                     */
  :root {
    --vz-look: var(--gold);   --vz-look-soft: var(--gold-soft);
    --vz-lock: var(--accent); --vz-lock-soft: var(--accent-soft);
    --vz-path: var(--purple); --vz-path-soft: var(--purple-soft);
    --vz-drop: var(--bad);    --vz-drop-soft: var(--bad-soft);
    --vz-dur: .42s;
    --vz-ease: cubic-bezier(.34, 1.32, .5, 1);
  }

  .pg-head { display: flex; align-items: center; gap: .6rem; margin: .2rem 0 1rem; }
  .pg-head .pg-back {
    background: var(--surface); border: 2px solid var(--line); border-bottom-width: 4px;
    border-radius: 999px; width: 2.6rem; height: 2.6rem; flex: none;
    display: grid; place-items: center; font-size: 1.2rem; color: var(--ink); padding: 0 0 .1rem;
  }
  .pg-head .pg-back:active { transform: translateY(2px); border-bottom-width: 2px; }
  .pg-head .pg-title { font-weight: 900; font-size: 1.15rem; line-height: 1.2; }
  .pg-head .pg-sub { color: var(--muted); font-size: .82rem; }

  /* ---- machine picker ---- */
  .pg-intro { font-size: .92rem; color: var(--muted); margin: 0 0 1rem; }
  .pg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; }
  @media (max-width: 360px) { .pg-grid { grid-template-columns: 1fr; } }
  .pg-card {
    background: var(--surface); border: 2px solid var(--line); border-bottom-width: 5px;
    border-radius: 16px; padding: .85rem .8rem; text-align: left;
    display: flex; flex-direction: column; gap: .15rem; min-height: 6.6rem;
    transition: transform .07s ease, border-color .2s ease;
  }
  .pg-card:active { transform: translateY(2px); border-bottom-width: 3px; }
  .pg-card .pc-emoji { font-size: 1.7rem; line-height: 1.1; }
  .pg-card .pc-title { font-weight: 900; font-size: .95rem; }
  .pg-card .pc-sub { color: var(--muted); font-size: .76rem; line-height: 1.35; margin-top: auto; }
  .pg-card.u1 { border-color: var(--accent); }
  .pg-card.u2 { border-color: var(--gold); }
  .pg-card.u3 { border-color: var(--purple); }
  .pg-card.u4 { border-color: var(--bad); }

  /* ---- stage ---- */
  .vz-stage {
    background: var(--surface); border: 2px solid var(--line);
    border-radius: 18px; overflow: hidden; margin-bottom: .7rem;
    touch-action: pan-y;
  }
  .vz-stage svg { width: 100%; height: auto; display: block; }
  .vz-stage svg text { font-family: inherit; }

  .vz-node, .vz-cell, .vz-slot, .vz-bar, .vz-mnode { transition: transform var(--vz-dur) var(--vz-ease); }
  .vz-node circle, .vz-cell rect, .vz-bar rect, .vz-mnode circle {
    transition: fill var(--vz-dur) ease, stroke var(--vz-dur) ease, opacity var(--vz-dur) ease;
  }
  .vz-edge line, .vz-edge path { transition: stroke var(--vz-dur) ease, stroke-width var(--vz-dur) ease, opacity var(--vz-dur) ease; }
  .vz-in { animation: vzPop .34s var(--vz-ease); }
  @keyframes vzPop { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: scale(1); } }
  .n-look circle { animation: vzPulse 1.2s ease-in-out infinite; }
  @keyframes vzPulse { 0%, 100% { opacity: 1; } 50% { opacity: .68; } }

  /* bars want solid mass, not an outline — they are the data, not a container */
  .vz-bar rect { stroke: none; }
  .vz-bar.n-idle rect { fill: var(--accent); opacity: .3; }
  .vz-bar.n-seen rect { fill: var(--accent); opacity: .5; }
  .vz-bar.n-look rect { fill: var(--vz-look); opacity: 1; }
  .vz-bar.n-lock rect { fill: var(--vz-lock); opacity: 1; }
  .vz-bar.n-look .vz-label, .vz-bar.n-lock .vz-label { fill: #fff; }

  .vz-label { font-size: 13px; font-weight: 800; fill: var(--ink); }
  /* halo so numbers stay readable where they cross an edge */
  .vz-num, .vz-w, .vz-cap {
    paint-order: stroke fill; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round;
  }
  .vz-num { font-size: 12px; font-weight: 800; fill: var(--ink); font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .vz-w { font-size: 12px; font-weight: 800; fill: var(--muted); }
  .vz-cap { font-size: 10px; font-weight: 800; fill: var(--muted); letter-spacing: .08em; }

  /* ---- narration: the star of the show ---- */
  .vz-say {
    display: flex; gap: .6rem; align-items: flex-start;
    background: var(--accent-soft); border-radius: 14px;
    padding: .75rem .9rem; margin-bottom: .7rem; min-height: 4.4rem;
  }
  .vz-say .vs-emoji { font-size: 1.2rem; line-height: 1.35; flex: none; }
  .vz-say .vs-text { font-size: .93rem; font-weight: 600; line-height: 1.45; }
  .vz-say .vs-text b { font-weight: 900; color: var(--accent-deep); }
  .vz-say.done { background: var(--gold-soft); }
  .vz-say.done .vs-text b { color: var(--gold); }

  /* ---- scrubber + transport ---- */
  .vz-scrub { display: flex; align-items: center; gap: .6rem; margin-bottom: .55rem; }
  .vz-scrub input[type=range] {
    flex: 1; -webkit-appearance: none; appearance: none;
    background: transparent; height: 1.8rem; margin: 0; padding: 0;
  }
  .vz-scrub input[type=range]::-webkit-slider-runnable-track {
    height: 10px; border-radius: 999px; background: var(--line);
  }
  .vz-scrub input[type=range]::-moz-range-track { height: 10px; border-radius: 999px; background: var(--line); }
  .vz-scrub input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 1.7rem; height: 1.7rem; border-radius: 50%; margin-top: -.42rem;
    background: var(--accent); border: 3px solid var(--surface);
    box-shadow: 0 0 0 2px var(--accent);
  }
  .vz-scrub input[type=range]::-moz-range-thumb {
    width: 1.5rem; height: 1.5rem; border-radius: 50%; border: 3px solid var(--surface);
    background: var(--accent); box-shadow: 0 0 0 2px var(--accent);
  }
  .vz-step {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: .78rem; font-weight: 800; color: var(--muted);
    flex: none; min-width: 3.6rem; text-align: right;
  }

  .vz-transport { display: flex; gap: .5rem; align-items: center; }
  .vz-tbtn {
    background: var(--surface); border: 2px solid var(--line); border-bottom-width: 4px;
    border-radius: 12px; height: 3rem; flex: 1;
    display: grid; place-items: center; font-size: 1.1rem; color: var(--ink); padding: 0 0 .15rem;
    transition: transform .06s ease;
  }
  .vz-tbtn:active { transform: translateY(2px); border-bottom-width: 2px; }
  .vz-tbtn[disabled] { opacity: .35; }
  .vz-tbtn[disabled]:active { transform: none; border-bottom-width: 4px; }
  .vz-tbtn.play {
    flex: 2.2; background: var(--accent); color: #fff;
    border-color: var(--accent-deep); border-bottom-color: var(--accent-deep);
    font-size: .95rem; font-weight: 900; letter-spacing: .05em; text-transform: uppercase;
  }
  .vz-tbtn.speed { font-size: .85rem; font-weight: 900; font-variant-numeric: tabular-nums; }

  /* ---- per-machine controls ---- */
  .vz-ctrls { display: flex; flex-wrap: wrap; gap: .45rem; margin-top: .8rem; }
  .vz-chip {
    background: var(--surface); border: 2px solid var(--line); border-bottom-width: 3px;
    border-radius: 999px; padding: .42rem .85rem;
    font-size: .84rem; font-weight: 800; color: var(--ink);
    transition: transform .06s ease;
  }
  .vz-chip:active { transform: translateY(1px); border-bottom-width: 2px; }
  .vz-chip.on { background: var(--accent); border-color: var(--accent-deep); color: #fff; }
  .vz-chip.ghost { color: var(--muted); }
  .vz-input {
    width: 4.6rem; font: inherit; font-weight: 800; text-align: center;
    background: var(--surface); color: var(--ink);
    border: 2px solid var(--line); border-bottom-width: 3px; border-radius: 999px;
    padding: .42rem .5rem;
  }
  .vz-input:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
  .vz-group { display: flex; gap: .4rem; align-items: center; width: 100%; }
  .vz-group .vz-glabel { font-size: .78rem; font-weight: 800; color: var(--muted); }

  /* ---- readouts (counters that make the point) ---- */
  .vz-reads { display: flex; gap: .5rem; margin-bottom: .7rem; }
  .vz-read {
    flex: 1; background: var(--surface); border: 2px solid var(--line);
    border-radius: 12px; padding: .45rem .5rem; text-align: center;
  }
  .vz-read .vr-num {
    font-size: 1.15rem; font-weight: 900; font-variant-numeric: tabular-nums;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  .vz-read .vr-lab { font-size: .6rem; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
  .vz-read.look .vr-num { color: var(--gold); }
  .vz-read.lock .vr-num { color: var(--accent); }
  .vz-read.path .vr-num { color: var(--purple); }
  .vz-read.drop .vr-num { color: var(--bad); }

  /* ---- legend ---- */
  .vz-key { display: flex; flex-wrap: wrap; gap: .3rem .8rem; margin: .8rem 0 0; }
  .vz-key span { display: flex; align-items: center; gap: .32rem; font-size: .74rem; font-weight: 700; color: var(--muted); }
  .vz-key i { width: .72rem; height: .72rem; border-radius: 50%; display: block; border: 2px solid var(--line); background: var(--surface); }
  .vz-key i.look { background: var(--gold-soft); border-color: var(--gold); }
  .vz-key i.lock { background: var(--accent); border-color: var(--accent-deep); }
  .vz-key i.path { background: var(--purple); border-color: var(--purple-deep); }

  .vz-note { font-size: .84rem; color: var(--muted); margin: .9rem 0 0; }
  .vz-note b { color: var(--ink); }

  /* ---- the shared state language: same five looks in every machine ---- */
  .n-idle  circle, .n-idle  rect { fill: var(--surface); stroke: var(--line);       stroke-width: 3; }
  .n-seen  circle, .n-seen  rect { fill: var(--code-bg); stroke: var(--muted);      stroke-width: 3; }
  .n-look  circle, .n-look  rect { fill: var(--vz-look-soft); stroke: var(--vz-look); stroke-width: 4; }
  .n-lock  circle, .n-lock  rect { fill: var(--vz-lock); stroke: var(--accent-deep); stroke-width: 3; }
  .n-path  circle, .n-path  rect { fill: var(--vz-path); stroke: var(--purple-deep); stroke-width: 3; }
  .n-drop  circle, .n-drop  rect { fill: var(--vz-drop-soft); stroke: var(--vz-drop); stroke-width: 3; }
  .n-empty circle, .n-empty rect { fill: transparent; stroke: var(--line); stroke-width: 2; stroke-dasharray: 4 4; }
  .n-ghost circle, .n-ghost rect { fill: var(--surface); stroke: var(--line); stroke-width: 2; opacity: .28; }
  .n-lock .vz-label, .n-path .vz-label { fill: #fff; }
  .n-ghost .vz-label { opacity: .3; }
  .n-drop .vz-label { fill: var(--bad-deep); }
  .n-look .vz-label { fill: var(--ink); }

  .e-idle line { stroke: var(--line); }
  .e-look line { stroke: var(--vz-look); }
  .e-path line { stroke: var(--vz-path); }
  .e-drop line { stroke: var(--vz-drop); opacity: .35; }
  .vz-w.hot { fill: var(--gold); font-weight: 900; font-size: 13px; }

</style>

<div id="app"></div>

<script>
"use strict";
const RM = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ================= QUESTION BANK ================= */
const LEVELS = [
{ id:"steps", emoji:"⏱️", title:"Counting steps", unit:"Unit 1 · Foundations", blurb:"What Θ, O and 'complexity' mean",
  intro:[ { t:"An app that feels instant with 10 users can crash with a million. Big-O predicts that — <b>before</b> it happens.", k:"Why it exists", e:"💡" },
          { t:"An algorithm is just a recipe of steps. Its 'complexity' = how the number of steps grows as the pile of data grows. (n = the size of the pile.)" },
          { t:"Double the pile: some recipes do a bit more work, some do WAY more. The steep curve is the killer.", v:"race" },
          { t:"To name a speed: keep the boss term, bin the rest.", f:"<div class='fx'>3n² + 5n&ensp;→&ensp;<span class='fa'>Θ(n²)</span></div><div class='flegend'><span class='fa'>keep the boss term</span><span>bin the small stuff</span></div>" },
          { t:"The speed ladder, calm → explosive. Half the questions are just knowing this order.", f:"<div class='fx'><span class='fa'>log n</span> &lt; n &lt; n log n &lt; <span class='fd'>n²</span> &lt; <span class='fd'>2ⁿ</span></div><div class='flegend'><span class='fa'>lovely</span><span>fine</span><span class='fd'>danger</span></div>" } ],
  qs:[
  { q:"“Complexity” of an algorithm measures…", o:["How hard the code is to read","How the amount of work grows as the input gets bigger","How many megabytes it uses","How long the source code is"], a:1, why:"We count rough steps as a function of input size n — the trend, not seconds." },
  { q:"What is the Θ class of 0.0001n² + 345n?", o:["Θ(n)","Θ(n²)","Θ(n³)","Θ(n log n)"], a:1, why:"Keep the fastest-growing term (n² beats n), drop its constant. Tiny constants don't save you — n² wins eventually." },
  { q:"What is the Θ class of 5n + 3n<sup>1.5</sup> + n log n?", o:["Θ(n)","Θ(n log n)","Θ(n<sup>1.5</sup>)","Θ(n²)"], a:2, why:"Compare exponents: n¹, n·log n (just above 1), n^1.5. Biggest exponent wins." },
  { q:"What is the Θ class of 2ⁿ + n² + 3ⁿ?", o:["Θ(2ⁿ)","Θ(n²)","Θ(3ⁿ)","Θ(6ⁿ)"], a:2, why:"With exponentials the bigger base always wins: (3/2)ⁿ explodes, so 3ⁿ dwarfs 2ⁿ." },
  { q:"What is the Θ class of 3log₂n + 2log₃n?", o:["Θ(log n)","Θ(n)","Θ((log n)²)","They can't be combined"], a:0, why:"Logs in different bases differ only by a constant factor — and constants get dropped. That's why we rarely write the base." },
  { q:"Slowest to fastest growth — which order is right?", o:["n, log n, n², n log n","log n, n, n log n, n²","log n, n log n, n, n²","n, n log n, log n, n²"], a:1, why:"The ladder: 1 < log n < n < n log n < n² < n³ < 2ⁿ. Memorise it." },
  { q:"A Θ(n³) algorithm does 30 operations at n = 10. Roughly how many at n = 1000?", o:["30,000","3 million","30 million","900,000"], a:2, why:"n grew ×100, so work grows ×100³ = ×1,000,000. 30 × 10⁶ = 30 million. Exam arithmetic is powers of ten — no calculator needed.", tag:"Sheet 2.1" },
  { q:"You double the input of a Θ(n²) algorithm. The work roughly…", o:["Doubles","Triples","Quadruples","Stays the same"], a:2, why:"(2n)² = 4n². Quadratic means doubling input quadruples work." },
  { q:"What does f = O(g) actually promise?", o:["f equals g","From some point on, f ≤ c·g for some fixed constant c","f is always smaller than g","f grows faster than g"], a:1, why:"O is an UPPER bound: eventually, up to a constant factor, f stays below g. Ω is the same with ≥, and Θ means both at once." },
  { q:"f is O(g) and g is O(h). What can you conclude?", o:["Nothing","f is O(h) — Big-O is transitive","h is O(f)","f = g"], a:1, why:"Chain the two constants: f ≤ c₁·g ≤ c₁·c₂·h. The same argument works for Ω and Θ.", tag:"Sheet 2.1" },
  { q:"Towers of Hanoi: n discs are stacked on one peg, biggest at the bottom. Move the whole stack to another peg — one disc at a time, never putting a bigger disc on a smaller one (a third peg is spare). This needs at least…", o:["n moves","n² moves","2ⁿ − 1 moves","n! moves"], a:2, why:"M(n) = 2M(n−1) + 1 solves to 2ⁿ − 1: move n−1 discs off, move the big one, move n−1 back — and no solution can beat it.", tag:"Sheet 2.1" },
  { q:"n! (= 1×2×…×n) compared with nⁿ:", o:["n! is O(nⁿ) but NOT Θ(nⁿ)","They grow identically","n! grows faster","n! is Θ(nⁿ)"], a:0, why:"Each of n!'s factors is ≤ n, so n! ≤ nⁿ. But half its factors are ≤ n/2, so n!/nⁿ shrinks to 0 — no constant keeps them level.", tag:"Sheet 2.1 harder" },
  { q:"Order these, slowest growth first: 2n², n log n, 0.1n, 2ⁿ", o:["0.1n, n log n, 2n², 2ⁿ","n log n, 0.1n, 2n², 2ⁿ","0.1n, 2n², n log n, 2ⁿ","2ⁿ, 2n², n log n, 0.1n"], a:0, why:"Constants don't matter: n < n log n < n² < 2ⁿ. This is sheet 2.1 Q2 verbatim.", tag:"Sheet 2.1" },
  { q:"A textbook says ‘any comparison sort needs Ω(n log n) steps’. What does f = Ω(g) actually guarantee?", o:["f ≤ c·g from some point on — a ceiling on the work","f and g are exactly equal from some point on","From some point on, f ≥ c·g for some fixed constant c — a floor: AT LEAST that much work","f grows strictly faster than g"], a:2, why:"Ω is O flipped upside down: instead of ‘never worse than’, it promises ‘never better than’. That's why lower bounds use it — ‘Ω(n log n)’ means no clever trick can beat that floor.", tag:"Sheet 2.1" },
  { q:"f = Θ(g) is the strongest of the three symbols. It means…", o:["f is squeezed between two constant multiples of g — it is O(g) AND Ω(g) at the same time","f(n) = g(n) for every single n","f ≤ g for all n, no constants allowed","f is O(g), but it might also be much smaller"], a:0, why:"Θ is a sandwich: c₁·g ≤ f ≤ c₂·g from some point on. O alone only gives the ceiling — saying bubble sort is O(n³) is true but useless. Θ pins the growth exactly.", tag:"Sheet 2.1" },
  { q:"What is the Θ class of n² log n + n(log n)²?", o:["Θ(n(log n)²)","Θ(n²)","Θ(n²(log n)²)","Θ(n² log n)"], a:3, why:"Divide both terms by their shared part, n log n: one becomes n, the other becomes log n. Since n crushes log n, the term n² log n is the boss — keep it whole, log and all.", tag:"Sheet 2.1" },
  { q:"A computer does about 10⁹ (a billion) simple steps per second. Roughly how long does a Θ(2ⁿ) algorithm take at n = 60? (Handy fact: 2¹⁰ ≈ 10³.)", o:["About a second","Around 30 years","About an hour","A few milliseconds"], a:1, why:"2⁶⁰ = (2¹⁰)⁶ ≈ (10³)⁶ = 10¹⁸ steps. Divide by 10⁹ per second → 10⁹ seconds, and a year is about 3×10⁷ seconds, so that's decades. Exponential doesn't mean ‘slow’ — it means ‘not happening’." },
  { q:"A Θ(n²) algorithm takes 2 milliseconds on 1,000 items. Roughly how long on 100,000 items?", o:["0.2 seconds","2 seconds","20 seconds","3 minutes"], a:2, why:"The input grew ×100, so quadratic work grows ×100² = ×10,000. 2 ms × 10,000 = 20,000 ms = 20 seconds. Scale the multiplier, never re-count the steps." },
  { q:"Constants vanish inside Θ — but do they vanish EVERYWHERE? Which statement is right?", o:["2ⁿ⁺¹ IS Θ(2ⁿ), but 4ⁿ is NOT Θ(2ⁿ)","Both 2ⁿ⁺¹ and 4ⁿ are Θ(2ⁿ) — constants always vanish","Neither is Θ(2ⁿ)","4ⁿ is Θ(2ⁿ), but 2ⁿ⁺¹ is not"], a:0, why:"2ⁿ⁺¹ = 2 · 2ⁿ — just a constant ×2 out front, so it vanishes. But 4ⁿ = 2ⁿ · 2ⁿ: the gap is 2ⁿ and it keeps GROWING, so no fixed constant can bridge it. Log bases never matter; exponential bases always do." },
  { q:"A brute-force search costs Θ(2ⁿ) and takes 1 second at n = 20. Roughly how long at n = 30?", o:["About 10 seconds","About 2 seconds","About 90 seconds","About 17 minutes"], a:3, why:"Adding 10 to n multiplies the work by 2¹⁰ = 1024 — so about 1024 seconds ≈ 17 minutes. With exponentials, ADDING to the input MULTIPLIES the work. (Another +10 and you're at 12 days.)" },
  { q:"Where does √n (that's n^0.5) sit on the speed ladder?", o:["Below log n — roots are tiny","Between log n and n","Between n and n log n","Above n² — roots explode"], a:1, why:"Try n = 1,000,000: log₂n ≈ 20, √n = 1,000, n = 1,000,000. Any power of n — even a small one like n^0.5 — eventually beats log n, but n^0.5 still loses to n^1. Compare exponents and you're done." },
]},
{ id:"loops", emoji:"🔁", title:"Loops → steps", unit:"Unit 1 · Foundations", blurb:"Read code, count the work",
  intro:[ { t:"GTA Online took <b>6 minutes to load — for 7 years</b>. The cause: one hidden double-loop. One fan found it. Loops are where slowness hides.", k:"Why it exists", e:"💡" },
          { t:"A loop repeats steps. A loop INSIDE a loop multiplies them: the inner line runs n × n = n² times.", code:"repeat n times:        <span class='fa'>← outer</span>\n  repeat n times:      <span class='fa'>← inner</span>\n    do_thing()         <span class='fd'>← runs n²×</span>" },
          { t:"If the inner loop only goes up to i, you fill half the square — and half of n² still counts as Θ(n²).", v:"tri" },
          { t:"A loop that HALVES the problem each time runs only log n times. 1000 → 1 takes about 10 halvings.", code:"while n > 1:\n  n = n / 2      <span class='fa'>← ~log n laps</span>" } ],
  qs:[
  { q:"One loop running i = 0 … n−1 does Θ(?) work.", o:["Θ(1)","Θ(log n)","Θ(n)","Θ(n²)"], a:2, why:"The body runs n times. One pass over the data = linear." },
  { q:"A loop to n with another loop to n inside it does Θ(?) work.", o:["Θ(n)","Θ(2n)","Θ(n²)","Θ(nⁿ)"], a:2, why:"n outer runs × n inner runs each = n². (And Θ(2n) is the same as Θ(n) — constants drop.)" },
  { q:"Inner loop runs up to i (the outer counter): 0 + 1 + 2 + … + (n−1) steps total. That's Θ(?)", o:["Θ(n)","Θ(n log n)","Θ(n²)","Θ(n³)"], a:2, why:"That sum is ≈ n²/2 — the triangle pattern. Half of n² still grows like n²." },
  { q:"How many times does tick() run?", code:"for (int i = 0; i < 2*n; i++)\n  for (int j = 0; j < i; j = j + 2)\n    tick();", o:["Θ(n)","Θ(n log n)","Θ(n²)","Θ(2ⁿ)"], a:2, why:"Inner runs ≈ i/2 times; summing over i up to 2n gives ≈ n². The 2n and the step-by-2 are constants — they vanish.", tag:"Mock Q4" },
  { q:"A loop that halves n each time (n → n/2 → n/4 → … → 1) runs Θ(?) times.", o:["Θ(n)","Θ(log n)","Θ(√n)","Θ(n/2)"], a:1, why:"“How many times can I halve n before 1?” is the definition of log₂n. Halving loops = logs." },
  { q:"A loop to n whose body always does exactly 10 operations is…", o:["Θ(10n), which is different from Θ(n)","Θ(n)","Θ(n¹⁰)","Θ(10ⁿ)"], a:1, why:"10n and n grow the same way — constant multipliers never change the Θ class." },
  { q:"Two separate loops, one AFTER the other, each running n times. Total?", o:["Θ(n²)","Θ(n) — one-after-another ADDS, nesting MULTIPLIES","Θ(2ⁿ)","Θ(n log n)"], a:1, why:"n + n = 2n = Θ(n). Only a loop INSIDE a loop multiplies. Mixing these up is the classic MCQ trap." },
  { q:"Three nested loops, each to n. The innermost line runs…", o:["Θ(n²)","Θ(3n)","Θ(n³)","Θ(nⁿ)"], a:2, why:"n × n × n. Every extra nesting level multiplies by another n." },
  { q:"EXACTLY how many runs if the inner loop goes up to i, for i = 0…n−1?", o:["n²","n(n−1)/2 — the triangle number","n log n","2ⁿ"], a:1, why:"0+1+2+…+(n−1) = n(n−1)/2. Still Θ(n²), but the exact count is what swap-counting questions use." },
  { q:"A loop over n items where each step does log n work costs…", o:["Θ(n)","Θ(log n)","Θ(n log n)","Θ(n²)"], a:2, why:"Multiply: n iterations × log n each. Exactly why heapsort (n deletes × log n sift) is Θ(n log n)." },
  { q:"This while-loop DOUBLES i each lap. Exactly how many times does tick() run?", code:"int i = 1;\nwhile (i < 64) {\n  tick();\n  i = i * 2;\n}", o:["5","6","7","64"], a:1, why:"i visits 1, 2, 4, 8, 16, 32 — six ticks — then hits 64 and the test fails. Doubling UP to n takes log₂n laps, the mirror image of halving down, and 2⁶ = 64 so the answer is 6." },
  { q:"Count carefully — exactly how many times does tick() run here?", code:"for (int i = 0; i < 20; i = i + 3)\n  tick();", o:["5","6","7","20"], a:2, why:"i lands on 0, 3, 6, 9, 12, 15, 18 — seven values. The trap is 20 ÷ 3 rounded down (6): because the count starts at 0, a stride-s loop to bound B runs ⌈B/s⌉ times. When in doubt, just list the values." },
  { q:"The inner loop STARTS at i instead of stopping at it. Exactly how many ticks?", code:"for (int i = 0; i < 4; i++)\n  for (int j = i; j < 4; j++)\n    tick();", o:["10","16","6","12"], a:0, why:"Row by row: i=0 gives 4 ticks, then 3, then 2, then 1 — total 10. Starting at i builds the same triangle as stopping at i, just mirrored: still about half the full 4×4 = 16 square, and still Θ(n²) in general." },
  { q:"Two blocks of code, one AFTER the other — but the second block is a nested pair. Total cost?", code:"for (int i = 0; i < n; i++)\n  tick();\n\nfor (int i = 0; i < n; i++)\n  for (int j = 0; j < n; j++)\n    tick();", o:["Θ(n)","Θ(n³) — the blocks multiply","Θ(n² log n)","Θ(n²) — when blocks add, the biggest term wins"], a:3, why:"One-after-another ADDS: n + n². When you add, the fastest-growing term swallows the rest, so the lonely n vanishes and the total is Θ(n²). Getting n³ would need the first loop wrapped AROUND the other two." },
  { q:"The inner loop scans all n items — but n HALVES after every scan. Total ticks?", code:"while (n > 1) {\n  for (int j = 0; j < n; j++)\n    tick();\n  n = n / 2;\n}", o:["≈ 2n, so Θ(n) — the rounds shrink too fast to matter","Θ(n log n) — log n rounds × n work each","Θ(log n)","Θ(n²)"], a:0, why:"The rounds cost n + n/2 + n/4 + … which never exceeds 2n — like repeatedly eating half a chocolate bar, you never total more than two bars. 'log n rounds × n each' overcharges: only the FIRST round actually costs n." },
  { q:"Sneaky one: j is declared OUTSIDE the loops and never reset. How many ticks in total?", code:"int j = 0;\nfor (int i = 0; i < n; i++) {\n  while (j < n) {\n    tick();\n    j = j + 1;\n  }\n}", o:["Θ(n²) — n outer laps × n inner laps","Θ(n log n)","Θ(n) — after the first outer lap, j is already n and the while never fires again","Θ(1)"], a:2, why:"All n ticks happen while i = 0; every later lap finds j still equal to n and skips the while instantly. Nested-LOOKING code only earns n² if the inner counter genuinely restarts each time." },
  { q:"A loop TRIPLES its counter each lap: i = 1, 3, 9, 27, … stopping once i ≥ n. How many laps, in Θ terms?", o:["Θ(n/3)","Θ(log n) — tripling and doubling land in the same class","Θ(√n)","Θ(3ⁿ)"], a:1, why:"It runs log₃n times, and log₃n is just log₂n divided by the constant 1.58-ish — and constants always vanish inside Θ. Any loop that MULTIPLIES its counter each lap is Θ(log n), whatever the multiplier." },
  { q:"The outer counter doubles; the inner loop is a full scan every time. How many ticks, in Θ terms?", code:"for (int i = 1; i < n; i = i * 2)\n  for (int j = 0; j < n; j++)\n    tick();", o:["Θ(n)","Θ(log n)","Θ(n²)","Θ(n log n)"], a:3, why:"The doubling outer loop runs about log₂n laps, and each lap pays a full n ticks: log n × n = Θ(n log n). Contrast with the shrinking-scan loop, where the inner bound itself halves and the total collapses to ≈ 2n." },
]},
{ id:"master", emoji:"🧮", title:"Master Theorem", unit:"Unit 1 · Foundations", blurb:"The 3-line recipe for recurrences",
  intro:[ { t:"Lots of fast recipes work by <b>splitting the job, solving the pieces, and gluing them back</b>. This theorem tells you the speed of ANY splitter — in one line.", k:"Why it exists", e:"💡" },
          { t:"The formula is just that sentence written down. Read it out loud:", f:"<div class='fx'>T(n) = <span class='fa'>a</span>·T(n/<span class='fb'>b</span>) + <span class='fc'>nᶜ</span></div><div class='flegend'><span class='fa'>a = how many pieces</span><span class='fb'>b = how much smaller</span><span class='fc'>nᶜ = glue work</span></div>" },
          { t:"So the job keeps splitting into smaller copies — and every box pays its own little bit of work.", v:"mt1" },
          { t:"Two rivals: the ONE big job at the top vs the SWARM of tiny jobs at the bottom.", v:"mt2" },
          { t:"Heavier side wins. Perfectly balanced? Multiply by log n. That's all three cases.", v:"mt3" },
          { t:"Try one: merge sort splits into 2 halves + n glue work. c = 1, log₂2 = 1 → a tie. Done — that's a full exam answer.", f:"<div class='fx'>T(n) = 2T(n/2) + n&ensp;⇒&ensp;<span class='fa'>Θ(n log n)</span></div><div class='flegend'><span>merge sort</span><span class='fa'>the tie case</span></div>" } ],
  qs:[
  { q:"T(n) = a·T(n/b) + n^c describes an algorithm that…", o:["Loops a times over n items","Solves a smaller copies of size n/b, plus n^c extra work","Solves b copies of size n/a","Always takes n^c steps"], a:1, why:"Read it out loud: a sub-problems, each 1/b of the size, plus n^c to split/combine. Merge sort: 2 halves + n merge = 2T(n/2) + n." },
  { q:"What is log₂8?", o:["2","3","4","8"], a:1, why:"2³ = 8. The magic number log_b a asks: what power of b gives a? Cheat table: log₂2=1, log₂3≈1.58, log₂4=2, log₂8=3." },
  { q:"Master Theorem, the whole recipe: compare c with log_b a. Which line is WRONG?", o:["c < log_b a → Θ(n^(log_b a))","c = log_b a → Θ(n^c · log n)","c > log_b a → Θ(n^c)","c = log_b a → Θ(n^c)"], a:3, why:"The tie case bolts on a log: Θ(n^c log n). The other three lines are the entire theorem — recursion wins, tie, or combine-work wins." },
  { q:"Merge sort: T(n) = 2T(n/2) + n. Solution?", o:["Θ(n)","Θ(n log n)","Θ(n²)","Θ(log n)"], a:1, why:"a=2, b=2, c=1. log₂2 = 1 = c → tie case → Θ(n¹ · log n) = Θ(n log n)." },
  { q:"T(n) = 3T(n/2) + n². Solution?", o:["Θ(n²)","Θ(n^1.58)","Θ(n² log n)","Master Theorem doesn't apply"], a:0, why:"log₂3 ≈ 1.58 < c = 2, so the n² combine work dominates → Θ(n²).", tag:"Mock Q2" },
  { q:"T(n) = 8T(n/2) + n³. Solution?", o:["Θ(n³)","Θ(n^2.5)","Θ(n³ log n)","Θ(n⁴)"], a:2, why:"log₂8 = 3 = c → tie → Θ(n³ log n).", tag:"Mock Q3" },
  { q:"Which recurrence can the Master Theorem NOT solve?", o:["T(n) = 2T(n/2) + n","T(n) = T(n−1) + T(n−2) + 1","T(n) = 3T(n/3) + n","T(n) = 8T(n/2) + n³"], a:1, why:"Master needs the size to shrink by DIVISION (n/b). Fibonacci's shrinks by subtraction — you handle it with induction instead. The lecturer said knowing this limit is examinable.", tag:"Lecturer tip" },
  { q:"Buggy merge sort where merging costs n²: T(n) = 2T(n/2) + n². Solution?", o:["Θ(n log n)","Θ(n²)","Θ(n² log n)","Θ(n³)"], a:1, why:"c = 2 > log₂2 = 1 → the combine step dominates → Θ(n²). One bad line makes the whole sort quadratic.", tag:"Sheet 2.3" },
  { q:"Stoogesort (sort first ⅔, last ⅔, first ⅔ again): T(n) = 3T(2n/3) + 1. Result? (log₁.₅3 ≈ 2.71)", o:["Θ(n log n)","Θ(n²)","Θ(n^2.71) — worse than insertion sort!","Θ(n)"], a:2, why:"a=3, b=3/2, c=0 → the recursion tree wins massively. Moral: being recursive doesn't make it fast.", tag:"Sheet 2.3" },
  { q:"Recursive minimum of an n×n matrix: 4 quadrants + 3 comparisons → C(n) = 4C(n/2) + 3. Result?", o:["Θ(n)","Θ(n²)","Θ(n² log n)","Θ(log n)"], a:1, why:"a=4, b=2, c=0. log₂4 = 2 > 0 → Θ(n²). Sensible: there are n² entries and no algorithm can skip looking at them.", tag:"Sheet 2.3" },
  { q:"Miracle merge that costs only √n: T(n) = 2T(n/2) + √n. Result?", o:["Θ(√n)","Θ(n log n)","Θ(n) — the recursion side dominates","Θ(n√n)"], a:2, why:"c = ½ < log₂2 = 1 → case 1 → Θ(n). When the combine step is cheap, the tree of copies sets the price.", tag:"Sheet 2.3" },
  { q:"3-way merge sort (split into thirds): T(n) = 3T(n/3) + n. Result?", o:["Θ(n log n) — same as 2-way","Θ(n²)","Θ(n^1.58)","Θ(n)"], a:0, why:"log₃3 = 1 = c → tie → Θ(n log n). Splitting into more pieces doesn't change the class.", tag:"Sheet 2.3" },
  { q:"An algorithm splits a size-n job into 2 jobs of size n/4, plus n work. Its recurrence is…", o:["T(n) = 4T(n/2) + n","T(n) = 2T(n/4) + n","T(n) = 2T(n/2) + n/4","T(n) = T(n/2) + 4n"], a:1, why:"a = number of sub-jobs = 2; b = shrink factor = 4. Reading a and b off a description is half the exam skill." },
  { q:"You're solving T(n) = 9T(n/3) + n². Step one is the magic number log₃9. What is it?", o:["2","3","9","1.5"], a:0, why:"log₃9 asks: what power of 3 gives 9? 3² = 9, so it's 2. And since the glue exponent c = 2 ties it exactly, this recurrence lands in the tie case: Θ(n² log n)." },
  { q:"An algorithm makes 2 recursive calls, each on a piece <b>two-thirds</b> the original size, plus n glue work. Its recurrence is…", o:["T(n) = 2T(n/3) + n","T(n) = 3T(2n/3) + n","T(n) = 2T(2n/3) + n","T(n) = 2T(n/2) + 2n/3"], a:2, why:"Two-thirds the size means the piece is 2n/3 — NOT n/3. In Master Theorem clothes that's b = 3/2, because dividing n by 3/2 gives 2n/3. Misreading 'two-thirds' as n/3 is the classic trap.", tag:"Sheet 2.3" },
  { q:"Binary search makes ONE recursive call on half the list plus 1 comparison: T(n) = T(n/2) + 1. Solution?", o:["Θ(1)","Θ(log n)","Θ(n)","Θ(n log n)"], a:1, why:"a = 1, b = 2, c = 0. log₂1 = 0 (because 2⁰ = 1), which equals c → tie case → Θ(n⁰ · log n) = Θ(log n). Even the humble binary search obeys the theorem." },
  { q:"A clever multiplication trick makes only 3 recursive calls on half-sized numbers: T(n) = 3T(n/2) + n. Solution? (log₂3 ≈ 1.58)", o:["Θ(n)","Θ(n log n)","Θ(n²)","Θ(n^1.58)"], a:3, why:"log₂3 ≈ 1.58 > c = 1, so the swarm of sub-problems wins and the answer is Θ(n^(log_b a)) = Θ(n^1.58). This is Karatsuba's multiplication — beating the schoolbook Θ(n²) by making 3 calls instead of 4." },
  { q:"T(n) = 2T(n/2) + n³. Solution?", o:["Θ(n log n)","Θ(n³ log n)","Θ(n³)","Θ(n⁴)"], a:2, why:"c = 3 is way bigger than log₂2 = 1, so the glue work at the top level dominates everything: Θ(n³). No log bolted on — the log only appears in an exact tie." },
  { q:"Which of these recurrences can the Master Theorem NOT solve?", o:["T(n) = 4T(n/2) + n²","T(n) = T(n/2) + 1","T(n) = 2T(2n/3) + n","T(n) = n·T(n/2) + n"], a:3, why:"The number of pieces a must be a FIXED constant — here it grows with n, so the theorem's shape a·T(n/b) + nᶜ doesn't match. The others are fine: a = 4, 1, and 2 with b = 2, 2, and 3/2.", tag:"Lecturer tip" },
  { q:"Two teams multiply n×n matrices. Team A: T(n) = 8T(n/2) + n². Team B: T(n) = 7T(n/2) + n². Who's asymptotically faster? (log₂7 ≈ 2.81)", o:["Team B — log₂7 ≈ 2.81 beats log₂8 = 3, so Θ(n^2.81) beats Θ(n³)","Team A — 8 pieces split more evenly into powers of 2","They tie — the n² glue work is identical","Team A — more sub-problems means each one is smaller"], a:0, why:"Both are case 1 (recursion wins), so the answer is Θ(n^(log₂a)). Shaving just ONE sub-problem off — 7 instead of 8 — drops n³ to n^2.81. That's Strassen's famous trick, and it's why people fight to reduce a." },
  { q:"Stoogesort: sort the first ⅔ of the array, then the final ⅔, then the first ⅔ again. After the FIRST call, where must the biggest one-third of all the elements be?", o:["Already in their final sorted places","Somewhere within the final two-thirds — so the next call can sweep them to the end","Still stuck in the first third","Anywhere — nothing is guaranteed yet"], a:1, why:"Any big element caught in the first ⅔ gets pushed to that region's right end — the middle third — which overlaps the final ⅔. So call 2 sees ALL the big elements and parks them, sorted, in the final third; call 3 then tidies the rest. That's the whole inductive correctness proof.", tag:"Sheet 2.3" },
]},
{ id:"sorting", emoji:"🃏", title:"Sorting & inversions", unit:"Unit 2 · Data structures", blurb:"Insertion sort, Shell sort, counting swaps",
  intro:[ { t:"Early computers spent <b>half their lives just sorting</b>. The 'slide cards into place' trick is still inside Python and Java today.", k:"Why it exists", e:"💡" },
          { t:"Insertion sort = sorting cards in your hand: take the next card, slide it left until it fits." },
          { t:"An 'inversion' = a pair in the wrong order. A neighbour swap fixes one. A long throw can fix several.", v:"swap" },
          { t:"That one equation answers every 'how many swaps?' question in the exam.", f:"<div class='fx'>swaps = <span class='fa'>inversions</span></div><div class='flegend'><span class='fa'>count the wrong-order pairs</span><span>that's the work</span></div>" } ],
  qs:[
  { q:"An 'inversion' in an array is…", o:["A pair in the wrong order (bigger one first)","An element in the wrong half","A swap performed by a sort","A reversed subarray"], a:0, why:"Any pair where the left element is bigger than the right one. A sorted array has 0; a reversed one has all n(n−1)/2." },
  { q:"How many inversions does [2, 1, 3] have?", o:["0","1","2","3"], a:1, why:"Check pairs: (2,1) ✓ inverted, (2,3) no, (1,3) no. Just one." },
  { q:"How many inversions does [1, 5, 0, 3, 2, 4] have?", o:["4","5","6","8"], a:2, why:"1 beats 0 (1); 5 beats 0,3,2,4 (4); 3 beats 2 (1). Total 6.", tag:"Sheet 2.2" },
  { q:"Insertion sort's number of swaps equals…", o:["n−1, always","The number of inversions in the input","n²/2, always","The number of distinct values"], a:1, why:"Each neighbour-swap fixes exactly one inversion — no more, no fewer. That single fact powers all swap-counting questions." },
  { q:"Why is insertion sort Θ(n²) on average?", o:["It compares every pair twice","A random array has ≈ n²/4 inversions, and each swap fixes one","It always scans the whole array per element","Because it's recursive"], a:1, why:"A random pair is inverted with probability ½ → expected inversions = n(n−1)/4 → that many swaps." },
  { q:"Shell sort's stride-3 pass sorts each interleaved slot-family (slots {0,3}, {1,4}, {2,5}) separately. Run it on [4, 2, 6, 1, 0, 3]. Result?", o:["[1, 0, 3, 4, 2, 6]","[2, 4, 6, 0, 1, 3]","[1, 2, 6, 4, 0, 3]","[4, 2, 6, 0, 1, 3]"], a:0, why:"Stride 3 pairs slots {0,3}, {1,4}, {2,5}: (4,1)→(1,4), (2,0)→(0,2), (6,3)→(3,6). Write back: [1,0,3,4,2,6].", tag:"Mock Q5" },
  { q:"On [4, 2, 6, 1, 0, 3], insertion sort needs 10 swaps but Shell sort (strides 3, then 1) needs only 3 + 3 = 6. Why can Shell win?", o:["It skips some elements entirely","A long-distance swap can fix several inversions at once","It uses extra memory","It doesn't need to finish sorting"], a:1, why:"Neighbour swaps fix exactly 1 inversion; Shell's stride-3 swaps fixed 7 inversions with 3 swaps. That's the entire idea of Shell sort.", tag:"Mock Q6" },
  { q:"Insertion sort on an ALREADY sorted array takes…", o:["Θ(n²)","Θ(n log n)","Θ(n)","Θ(1)"], a:2, why:"Zero inversions → zero swaps — it just walks through once checking. Best case linear." },
  { q:"Which ordering of 0…5 has the MOST inversions, and how many?", o:["Random order — 30","Reverse order — 15","Reverse order — 36","Sorted order — 15"], a:1, why:"Reversed, every pair is wrong: 6·5/2 = 15. In general the max is n(n−1)/2 and sorted order has 0.", tag:"Sheet 2.2" },
  { q:"On average, a random shuffle of n items contains how many inversions?", o:["n(n−1)/2","n(n−1)/4 — each pair is wrong half the time","n","n²"], a:1, why:"Each of the n(n−1)/2 pairs is inverted with probability ½. This is exactly WHY insertion sort's average case is Θ(n²).", tag:"Sheet 2.2" },
  { q:"A 'loop invariant' (course definition) is a statement that…", o:["Is always true everywhere","If true before the loop body runs, is true after it runs","Is checked by the compiler","Makes loops faster"], a:1, why:"That's the whole definition. To prove code correct you ALSO need it true at the start and strong enough at the end — next question.", tag:"Sheet 2.2" },
  { q:"Which invariant actually proves insertion sort correct?", o:["'The array contains numbers'","'a[0..i−1] is sorted' — true at start, kept by each insert, implies sorted at the end","'2+2=4'","'The array is fully sorted'"], a:1, why:"The others technically pass the definition but are USELESS — trivial, or not true on entry. Useful = true initially + preserved + implies the goal. Sheet 2.2's trick question.", tag:"Sheet 2.2 Q7" },
  { q:"Your data is ALMOST sorted (a log file with a few stragglers). Best sort?", o:["Insertion sort — cost ≈ n + the few inversions","Stoogesort","Selection sort","Always mergesort"], a:0, why:"Insertion sort costs one pass plus swaps = inversions. Few inversions → nearly Θ(n). This is why Timsort (Python/Java) uses it inside." },
  { q:"How many inversions does [3, 1, 4, 2] have? (An inversion = a pair where the bigger number sits to the left of the smaller.)", o:["2","3","4","6"], a:1, why:"Hunt the wrong-order pairs: 3 beats 1 and 2 (that's 2), and 4 beats 2 (1 more). Total 3 — and that's exactly how many swaps insertion sort will spend fixing it." },
  { q:"Insertion sort fixes an array one neighbour-swap at a time. On the fully REVERSED array [5, 4, 3, 2, 1], how many swaps does it perform?", o:["4","5","10","25"], a:2, why:"Reversed means EVERY pair is in the wrong order: 5·4/2 = 10 pairs, and each neighbour-swap fixes exactly one. That's the worst case — n(n−1)/2 swaps, which is where insertion sort's Θ(n²) comes from." },
  { q:"Selection sort works by scanning the whole unsorted part for its minimum, swapping it to the front, and repeating. Feed it an array that is ALREADY sorted. How long does it take?", o:["Θ(n) — it notices the array is already sorted","Θ(n log n)","Θ(1)","Θ(n²) — it still scans the whole leftover part to confirm each minimum"], a:3, why:"Selection sort can't take shortcuts: to be sure slot i holds the minimum it must check everything to the right, sorted or not. Same step count on every input of size n — unlike insertion sort, which flies on sorted data. Sheet 2.1's timing experiment is designed to make you notice this.", tag:"Sheet 2.1" },
  { q:"Selection sort repeatedly finds the minimum of the leftover part and swaps it into place — one swap per position. For n = 100 items, roughly how many swaps and how many comparisons does it make?", o:["≈99 swaps but ≈4950 comparisons","≈4950 swaps but ≈99 comparisons","≈99 swaps and ≈99 comparisons","≈4950 swaps and ≈4950 comparisons"], a:0, why:"Finding each minimum is the expensive bit: 99 + 98 + … + 1 = 100·99/2 = 4950 comparisons. But it only ever swaps once per position — at most n−1 = 99 swaps. Cheap swaps, pricey scanning: the opposite trade-off to insertion sort.", tag:"Sheet 2.1" },
  { q:"An insertion sort takes about 2 ms to sort 1,000 randomly shuffled items. Roughly how long should it take on 10,000 randomly shuffled items?", o:["20 ms","200 ms","2000 ms","4 ms"], a:1, why:"Quadratic scaling: multiply the input by 10, multiply the time by 10² = 100. So 2 ms becomes about 200 ms. This 'scale the input, square the factor' arithmetic is a classic machine-marked question.", tag:"Sheet 2.1" },
  { q:"Insertion sort takes each new element and compares leftwards until it meets something smaller (then stops). On the ALREADY sorted array [1, 2, 3, 4, 5, 6, 7], exactly how many comparisons does it make in total?", o:["0","21","6 — one comparison per element after the first","7"], a:2, why:"Each of the 6 elements after the first compares once with its left neighbour, immediately finds it's smaller, and stops. n−1 comparisons, zero swaps — the concrete numbers behind 'best case Θ(n)'." },
  { q:"Shell sort with stride 2 splits [6, 3, 5, 1, 4, 2] into two interleaved families — slots {0,2,4} holding [6, 5, 4] and slots {1,3,5} holding [3, 1, 2] — and sorts each family within its own slots. What does the array look like after this pass?", o:["[1, 2, 3, 4, 5, 6]","[4, 5, 6, 1, 2, 3]","[3, 1, 4, 2, 6, 5]","[4, 1, 5, 2, 6, 3]"], a:3, why:"Sort [6,5,4] → [4,5,6] and pour it back into slots 0, 2, 4; sort [3,1,2] → [1,2,3] into slots 1, 3, 5. The families stay interleaved — the array is not fully sorted yet, just much tidier for the final stride-1 pass." },
  { q:"A stride-2 Shell pass turns [6, 3, 5, 1, 4, 2] (which had 11 inversions) into [4, 1, 5, 2, 6, 3]. How many swaps does the finishing stride-1 pass — ordinary insertion sort — still need?", o:["6","11","5","0"], a:0, why:"Final-pass swaps = inversions left over. Count them in [4,1,5,2,6,3]: 4 beats 1, 2, 3; 5 beats 2, 3; 6 beats 3 — that's 6. The stride-2 pass already killed 5 of the original 11 inversions on the cheap, which is Shell sort's whole sales pitch." },
]},
{ id:"trees", emoji:"🌳", title:"BSTs & AVL trees", unit:"Unit 2 · Data structures", blurb:"Search trees and rotations",
  intro:[ { t:"1962: the first data structure that <b>tidies itself</b>. It's why finding one row among a billion takes ~30 steps, not a billion.", k:"Why it exists", e:"💡" },
          { t:"A search tree: smaller things hang left, bigger things hang right. Finding = walking down, ditching half the tree at every step." },
          { t:"But if it droops into a chain, the magic dies. AVL rule: no branch may be 2 deeper than its sibling." },
          { t:"The fix is a 'rotation': of the 3 trouble nodes, promote the middle one.", v:"rot" } ],
  qs:[
  { q:"In a binary search tree, values smaller than a node go…", o:["Left","Right","Either side","To the leaves"], a:0, why:"Smaller left, bigger right — at every node. That's the whole definition, and it's what makes searching fast: each step discards half the tree (if it's balanced)." },
  { q:"Insert 1, 2, 3 in order into a plain BST (no balancing). You get…", o:["A perfectly balanced tree","A chain leaning right","A chain leaning left","An error"], a:1, why:"Each value is bigger than the last, so it keeps going right. Chains are why plain BSTs can degrade to O(n) search." },
  { q:"The AVL rule at every node is…", o:["Left and right subtree HEIGHTS differ by at most 1","Left and right have equal node counts","The tree is a perfect triangle","Every level is full"], a:0, why:"Only heights, only off-by-one. That's cheap to maintain and enough to force height ≈ log n." },
  { q:"The exam shortcut for any single AVL rotation: of the three nodes on the trouble path…", o:["The biggest becomes parent","The middle value becomes the parent, other two its children","The newest becomes the root","The smallest becomes parent"], a:1, why:"Promote the middle value. Insert 1,2,3 → trouble path 1,2,3 → 2 becomes parent of 1 and 3. Works for every rotation case, single or double." },
  { q:"Insert 3, 6, 10, 9, 8, 7 into an AVL tree (rebalancing throughout). The final root is…", o:["6","8","9","10"], a:1, why:"Three fixes: 3,6,10 → promote 6. Then 8 breaks node 10 (path 10,9,8) → promote 9. Then 7 breaks the root 6 (path 6,9,8 towards 7) → promote 8. Root = 8.", tag:"Mock Q7 · 4 marks" },
  { q:"An AVL tree holds 7 elements. Its height can be… (single node = height 0)", o:["Exactly 2","2 or 3","2, 3 or 4","Anything up to 6"], a:1, why:"Perfectly balanced 7 nodes → height 2. The thinnest legal height-3 AVL tree needs exactly N(3) = 7 nodes, so 3 is possible; height 4 needs 12+. Plain BSTs manage 2–6." },
  { q:"Why are AVL operations O(log n)? Because the thinnest AVL tree of height h…", o:["Has exactly 2^h nodes","Grows like Fibonacci — exponentially — so n nodes force h = O(log n)","Has h² nodes","Is a chain"], a:1, why:"N(h) = N(h−1) + N(h−2) + 1: Fibonacci in a hat. Exponential node count per height means height stays logarithmic in n.", tag:"Sheet 2.6" },
  { q:"Searching a PLAIN unbalanced BST in the worst case costs…", o:["O(1)","O(log n)","O(n)","O(n log n)"], a:2, why:"Worst case it's a chain and you walk every node. Balance (AVL) is exactly what buys the O(log n) guarantee." },
  { q:"Delete the root of a BST. What replaces it?", o:["Its largest descendant","Its predecessor (rightmost of the LEFT subtree) or successor (leftmost of the RIGHT subtree)","Whichever child is bigger","You can't delete roots"], a:1, why:"Both choices preserve smaller-left/bigger-right. Sheet 2.6 makes you try both and check whether the result is still AVL.", tag:"Sheet 2.6" },
  { q:"Walk a BST left-subtree → node → right-subtree ('in-order'). What comes out?", o:["Random order","The values in SORTED order","Reverse sorted","Level by level"], a:1, why:"Smaller-left/bigger-right means in-order traversal visits values ascending. A handy check for 'is this a valid BST?'." },
  { q:"A plain BST holds 7 values. Which heights are possible? (One node = height 0.)", o:["Only 2","Anything from 2 to 6","Exactly 3","1 to 7"], a:1, why:"Best: perfectly balanced, height 2 (2³−1 = 7 nodes). Worst: a chain, height 6. AVL crushes that range to just 2–3.", tag:"Sheet 2.6" },
  { q:"Thinnest AVL tree: N(0)=1, N(1)=2, N(h)=N(h−1)+N(h−2)+1. What is N(3)?", o:["5","6","7","12"], a:2, why:"N(2) = 2+1+1 = 4, then N(3) = 4+2+1 = 7. So 7 nodes only just reach height 3 — which is why mock Q7's final tree is legal.", tag:"Sheet 2.6" },
  { q:"Where is the smallest value in any BST?", o:["The root","The leftmost node — keep walking left until you can't","The deepest leaf","Anywhere"], a:1, why:"Left always means smaller. (Largest = keep walking right.) Cost: O(height) steps." },
  { q:"Insert 7, 3, 9, 1, 2, 0, 12 into a plain BST in that order. Where does the value 2 end up?", o:["Left child of 3","Right child of 3","Right child of 1","Left child of 1"], a:2, why:"Walk it in: 2 < 7 so go left, 2 < 3 so left again, 2 > 1 so right — and that slot is free. Every insert is just repeated smaller-left/bigger-right until you fall off the tree.", tag:"Sheet 2.6" },
  { q:"You build a plain BST by inserting 7, 3, 9, 1, 2, 0, 12 in that order: root 7; 7's left child is 3; 3's left child is 1; 1's children are 0 and 2; 7's right child is 9; 9's right child is 12. Is this an AVL tree?", o:["No — node 3's left side reaches 2 levels down but its right side is empty","Yes — the root's two sides differ by only one level","No — node 9 breaks the rule","No — the root 7 breaks the rule"], a:0, why:"The AVL rule must hold at EVERY node, not just the root. The root is fine (left height 2, right height 1), but node 3 has a left subtree 2 deep and nothing at all on its right — that off-by-two is exactly what a rotation would fix.", tag:"Sheet 2.6" },
  { q:"A BST has root 7; 7's left child is 3; 3's left child is 1; 1's children are 0 and 2; 7's right child is 9; 9's right child is 12. Delete the root 7 and fill the gap with its PREDECESSOR. Which value becomes the new root?", o:["2","3","9","1"], a:1, why:"Predecessor = rightmost node of the LEFT subtree: start at 3 and keep following right children — but 3 has no right child, so it is 3 itself. Sorted order confirms it: 0, 1, 2, 3, 7… the value just before 7 is 3, not 2.", tag:"Sheet 2.6" },
  { q:"Same tree — root 7; left subtree 3 → 1 → children 0 and 2; right subtree 9 → 12. This time delete 7 and fill the gap with its SUCCESSOR. What happens?", o:["Successor is 12, and the tree stays AVL","Successor is 9, and the tree stays AVL","Successor is 12, and the AVL rule breaks","Successor is 9 — and the new root then breaks the AVL rule, its left side 2 levels deeper than its right"], a:3, why:"Successor = leftmost node of the RIGHT subtree; 9 has no left child, so 9 moves up. But now root 9's left side (3 → 1 → 0 and 2) is 2 levels deeper than its right side (just 12). Moral of Sheet 2.6: predecessor and successor are both legal, but one can leave a balanced tree and the other a wonky one.", tag:"Sheet 2.6" },
  { q:"Into an empty AVL tree insert 5, then 3, then 4. What happens after the 4 goes in?", o:["Nothing — the tree is still balanced","A DOUBLE rotation: 4 is promoted, giving root 4 with children 3 and 5","A single rotation: 3 is promoted, giving root 3 with children 4 and 5","4 simply becomes the right child of 5"], a:1, why:"The trouble path 5 → 3 → 4 zigzags (left, then right), so one single rotation can't straighten it — that's the double-rotation case. But the promote-the-middle trick still works: of 5, 3 and 4, the middle VALUE is 4, so 4 becomes the parent of 3 and 5.", tag:"Sheet 2.6" },
  { q:"Insert 7, 3, 9, 1, 2, 0, 12 in that order into an AVL tree, rotating whenever the rule breaks. What is the FINAL root?", o:["2","7","3","9"], a:0, why:"Two fixes along the way: inserting 2 breaks node 3 (path 3, 1, 2 → promote 2 locally), then inserting 0 breaks the root 7 (path 7, 2, 1 → promote 2 to the very top). 12 slides in without trouble, so 2 stays as root — nowhere near where a plain BST would leave things.", tag:"Sheet 2.6" },
  { q:"An AVL tree holds exactly 12 nodes. Which heights are possible? (Single node = height 0. Helpful facts: a completely full tree of height 2 holds 7 nodes; the THINNEST legal AVL trees need 7 nodes for height 3, 12 for height 4 and 20 for height 5.)", o:["Exactly 3","2 or 3","3 or 4","3, 4 or 5"], a:2, why:"Squash it flat: height 2 maxes out at 7 nodes, so 12 nodes force at least height 3. Stretch it thin: the skinniest height-4 AVL tree needs exactly 12 nodes — just reachable — but height 5 demands 20. So 3 or 4, and nothing else.", tag:"Sheet 2.6" },
  { q:"A right rotation is fixing node 7: its left child is 2, and 2's own children are 1 and 3. The rotation lifts 2 to the top and makes 7 its right child. What happens to 3, the child 2 leaves behind?", o:["It is deleted and re-inserted from scratch","It stays put as 2's right child","It becomes a child of 1","It hops across to become 7's LEFT child"], a:3, why:"3 sits between 2 and 7 in value, so the only legal home left is 7's freshly emptied left slot. Every rotation re-homes exactly one orphan subtree like this — forgetting it is THE classic slip when drawing rotations under exam pressure.", tag:"Sheet 2.6" },
]},
{ id:"heaps", emoji:"⛰️", title:"Heaps", unit:"Unit 2 · Data structures", blurb:"Priority queues in an array",
  intro:[ { t:"Your phone picks '<b>most urgent thing next</b>' thousands of times a second. The queue it uses is a heap.", k:"Why it exists", e:"💡" },
          { t:"One rule only: every parent beats its kids. So the winner always sits on top." },
          { t:"And it's secretly just a flat list. Slot k's kids live at 2k+1 and 2k+2.", v:"heap" },
          { t:"New item? It bubbles UP until its parent beats it. Remove the top? The last item takes its place and sinks DOWN.", f:"<div class='fx'>kids of k → <span class='fa'>2k+1</span>, <span class='fa'>2k+2</span></div><div class='flegend'><span>parent of k → <span class='fb'>(k−1)÷2</span></span><span>every heap MCQ uses these</span></div>" },
          { t:"Party trick: turning n jumbled items into a heap ('make-heap') costs only Θ(n) — because half the items sit at the bottom and never need to move. The exam LOVES this surprise.", e:"🏗️" } ],
  qs:[
  { q:"The one promise a min-heap makes:", o:["The array is fully sorted","Every parent is smaller than its children","Left children are smaller than right children","The smallest element is at the end"], a:1, why:"Parent beats children — that's all. Left/right order means nothing. Consequence: the root (slot 0) is always the minimum." },
  { q:"A heap lives in a plain array. The children of slot k are at…", o:["k+1 and k+2","2k and 2k+1","2k+1 and 2k+2","k/2 and k/2+1"], a:2, why:"Root at 0; children of k at 2k+1, 2k+2; parent of k at ⌊(k−1)/2⌋. Learn these three formulas — every heap MCQ uses them." },
  { q:"With n elements in slots 0…n−1, the largest slot that can have a child is…", o:["n−1","n/2","⌊n/2⌋ − 1","⌊(n−1)/2⌋ + 1"], a:2, why:"Slot k has a child iff 2k+1 ≤ n−1, i.e. k ≤ n/2 − 1. Everything past that is a leaf — which is why make-heap starts sifting there.", tag:"Sheet 2.7" },
  { q:"Removing the minimum from a heap starts by…", o:["Deleting slot 0 and shifting everything left","Moving the LAST element into slot 0, then sifting it down","Swapping slots 0 and 1","Re-sorting the array"], a:1, why:"Fill the hole with the last element (keeps the shape compact), then sift down: swap with the smaller child until both children lose." },
  { q:"Min-heap [4, 8, 16, 15, 42, 23] — remove the minimum. Resulting array?", o:["[8, 15, 16, 23, 42]","[8, 16, 15, 23, 42]","[8, 15, 23, 16, 42]","[8, 16, 15, 42, 23]"], a:0, why:"23 goes to the root → swap with smaller child 8 → then its children are 15, 42 → swap with 15. Result [8,15,16,23,42]. Always the SMALLER child.", tag:"Mock Q8" },
  { q:"Inserting into a heap costs…", o:["O(1)","O(log n)","O(n)","O(n log n)"], a:1, why:"Drop it in the next free slot, sift UP by swapping with the parent while it beats the parent — at most the tree's height ≈ log n swaps." },
  { q:"Building a heap from n unordered items (make-heap) costs…", o:["Θ(n log n)","Θ(n²)","Θ(n)","Θ(log n)"], a:2, why:"Surprisingly, it's LINEAR — cheaper than it looks. Make-heap works bottom-up, sifting each node down: half the nodes are leaves (zero work), a quarter sink at most 1 level, an eighth at most 2… That adds up to only about n swaps in total — only the root ever pays the full log n. A favourite examiner surprise.", tag:"Sheet 2.7" },
  { q:"Parent of slot 8 in a heap array?", o:["Slot 4","Slot 3 — ⌊(8−1)/2⌋","Slot 7","Slot 2"], a:1, why:"Parent of k = ⌊(k−1)/2⌋ = ⌊7/2⌋ = 3. It's the inverse of the kids formula 2k+1, 2k+2 — check: kids of 3 are 7 and 8 ✓." },
  { q:"Heapsort = make-heap, then n × delete-the-top. Total complexity?", o:["Θ(n)","Θ(n log n) — Θ(n) build + n deletes at O(log n) each","Θ(n²)","Θ(log n)"], a:1, why:"The linear build is dominated by n sift-downs of log n each. Same class as mergesort, and it sorts in place.", tag:"Sheet 2.7" },
  { q:"In a min-heap, where can the SECOND-smallest element be?", o:["Anywhere at all","Only in the last slot","It must be one of the root's two children","Slot 3 exactly"], a:2, why:"Everything below a node is bigger than that node — so the 2nd-smallest can't sit under anything except the root itself." },
  { q:"Is the sorted array [1, 2, 3, 4, 5] a valid min-heap?", o:["No — heaps can't be sorted","Yes — every parent is smaller than its children","Only if n is odd","Only after sifting"], a:1, why:"Check the formulas: slot k's kids at 2k+1, 2k+2 always hold bigger numbers here. Sorted ⇒ heap (the reverse is NOT true)." },
  { q:"make-heap turns a jumbled array into a heap by sifting nodes DOWN, starting from the last parent and working back to the root. How much sifting do the leaves (the bottom row) need?", o:["log n swaps each","One swap each","None at all — and leaves are about HALF of all the nodes","n swaps in total"], a:2, why:"A leaf has no children, so there's nothing below it to sift into — zero work. Half the heap is finished before you even start. That's the first clue that make-heap beats Θ(n log n).", tag:"Sheet 2.7" },
  { q:"In make-heap, a node's sift-down cost is its height above the bottom: half the nodes have height 0, a quarter height 1, an eighth height 2… The grand total n/2·0 + n/4·1 + n/8·2 + … comes to…", o:["≈ n log n — every node pays log n","≈ n² ","≈ n — the tiny jobs hugely outnumber the big ones","≈ log n"], a:2, why:"Each extra level has half as many nodes but only one more swap — the series settles at about n swaps total. Only ONE node (the root) ever pays the full log n. THAT's why make-heap is Θ(n).", tag:"Sheet 2.7" },
  { q:"Build a MAX-heap (every parent BEATS its children — biggest on top) by inserting 7, 3, 9, 1, 2, 0, 12 one at a time into an empty array. Each newcomer lands in the next free slot and bubbles UP while it beats its parent. Final array?", o:["[12, 9, 7, 3, 2, 0, 1]","[9, 3, 12, 1, 2, 0, 7]","[12, 3, 9, 1, 2, 0, 7]","[7, 3, 9, 1, 2, 0, 12]"], a:2, why:"Only two inserts actually move: 9 bubbles over 7 to the root, and 12 bubbles over 7 and then over 9 to the top. Everyone else lands and stays put — most inserts are cheap, and the array is heap-ordered, NOT sorted.", tag:"Sheet 2.7 Q2" },
  { q:"A max-heap (parents beat children) is stored as [12, 3, 9, 1, 2, 0, 7]. Perform deleteMax: remove the 12, move the LAST element into the root, then sift it down — swapping with its BIGGER child while any child beats it. Resulting array?", o:["[9, 3, 7, 1, 2, 0]","[7, 3, 9, 1, 2, 0]","[9, 7, 3, 1, 2, 0]","[9, 3, 1, 2, 0, 7]"], a:0, why:"7 takes the root, sees children 3 and 9, swaps with the BIGGER one (9). Its only remaining child is 0, which loses — stop. Max-heap deletion mirrors min-heap deletion exactly, just with the comparison flipped.", tag:"Sheet 2.7 Q2" },
