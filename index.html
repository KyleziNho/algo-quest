  { q:"Sheet 2.7 rediscovers make-heap's cost with the Master Theorem: heapify the two half-trees, then sift the root down (at most log₂n swaps), giving T(n) = 2·T(n/2) + Θ(log n). Comparing log n against n^(log₂2) = n¹, the Master Theorem concludes…", o:["Θ(n log n) — the middle case","Θ(n) — log n is polynomially SMALLER than n, so the bottom of the tree dominates","Θ(log²n)","Θ(n²)"], a:1, why:"With a = 2 and b = 2 the benchmark is n¹, and log n is dwarfed by that — case 1, answer Θ(n). Same verdict as the lecture's counting argument, reached by a totally different road. Nice exam crossover: a heap fact proved by THE central exam tool.", tag:"Sheet 2.7 Q3" },
  { q:"Insert 14 into the max-heap [15, 9, 12, 3, 7] (parents beat children; the newcomer starts in the next free slot and bubbles UP while it beats its parent). Resulting array?", o:["[15, 9, 12, 3, 7, 14]","[15, 14, 12, 3, 7, 9]","[14, 9, 15, 3, 7, 12]","[15, 9, 14, 3, 7, 12]"], a:3, why:"14 lands in slot 5, whose parent is slot ⌊(5−1)/2⌋ = 2 holding 12. 14 beats 12 → swap. New parent is 15, which wins → stop after ONE swap. Sift-up rarely goes all the way to the top." },
  { q:"Exactly ONE of these arrays is a valid max-heap (slot k's children sit at 2k+1 and 2k+2, and every parent must be ≥ its children). Which?", o:["[10, 8, 9, 4, 7, 3]","[10, 4, 9, 8, 7, 3]","[10, 8, 9, 4, 7, 11]","[8, 9, 10, 4, 7, 3]"], a:0, why:"Check parents only: 10 beats 8 and 9; 8 beats 4 and 7; 9 beats 3 ✓. The others each hide one broken pair: 4 has child 8, 9 has child 11, and 8 has children 9 and 10. One bad parent–child pair anywhere ruins the whole heap." },
  { q:"In-place heapsort on the max-heap [9, 3, 7, 1, 2, 0]: one round = swap the root with the LAST active slot, declare that slot finished (shrink the heap by one), then sift the new root down within what's left. The array after ONE round?", o:["[0, 3, 7, 1, 2, 9]","[9, 3, 7, 1, 2, 0]","[7, 3, 0, 1, 2, 9]","[7, 3, 2, 1, 0, 9]"], a:2, why:"Swap puts 9 safely at the end and 0 at the root; 0 then sifts down past its bigger child 7 and stops (its next children would be off the end of the 5-slot heap). Repeat n times and the sorted list grows from the RIGHT — that's why heapsort needs a MAX-heap for ascending order and no extra array.", tag:"Sheet 2.7" },
  { q:"A heap holds 1,000,000 elements. At WORST, roughly how many swaps can one single sift-down cost?", o:["About 2","About 20 — the tree is only log₂(1,000,000) ≈ 20 levels tall","About 1,000","About 500,000"], a:1, why:"Each swap drops the element one level, and doubling per level means a million elements stack up only ~20 levels high. That absurdly short tree is the whole magic of heaps: million-item priority queue, twenty-step operations." },
  { q:"In a MAX-heap, where is the SMALLEST element guaranteed to live?", o:["In slot 1 or slot 2, just under the root","Always in the very last slot of the array","Anywhere at all, even the root","In a slot with NO children (a leaf) — though not necessarily the last slot"], a:3, why:"Nothing can sit below the smallest — a child would have to be even smaller, impossible — so it must be a leaf. But any leaf will do: in the valid max-heap [9, 3, 7, 0, 2, 1] the smallest, 0, sits at slot 3, nowhere near the end. Mirror of the min-heap fact about the second-smallest." },
]},
{ id:"hash", emoji:"#️⃣", title:"Hash tables", unit:"Unit 2 · Data structures", blurb:"Instant lookup & collisions",
  intro:[ { t:"1953: instead of SEARCHING for a thing, make its name <b>compute where it lives</b>. Every Python dict is this one trick.", k:"Why it exists", e:"💡" },
          { t:"One division and you know exactly where to look. ('mod' = the remainder after dividing.)", f:"<div class='fx'>slot = key <span class='fa'>mod</span> 7</div><div class='flegend'><span class='fa'>mod = remainder</span><span>13 mod 7 = <span class='fb'>6</span></span></div>" },
          { t:"Two keys want the same slot? Chain them in a mini-list — or step right until there's a gap.", v:"hashv" },
          { t:"Stepping right has a danger: keys steal other keys' homes, and pile-ups snowball." } ],
  qs:[
  { q:"With h(k) = k mod 7, which slot does key 13 go to? (mod = remainder after dividing)", o:["1","3","6","13"], a:2, why:"13 = 7 + 6, so remainder 6. This is why lookup is O(1): one division tells you exactly where to look." },
  { q:"Keys 14, 7 and 77 all hash to slot 0 (they're multiples of 7). This is called…", o:["A collision","An inversion","An overflow","A rotation"], a:0, why:"Two keys, same slot = collision. The two standard fixes are chaining and probing." },
  { q:"'Chaining' handles collisions by…", o:["Rejecting the second key","Each slot holding a little linked list","Doubling the table","Re-hashing with mod 11"], a:1, why:"Latecomers join the list in their slot. Finding 77 behind 14 → 7 → 77 costs 3 looks." },
  { q:"'Linear probing' handles a taken slot by…", o:["Stepping right (wrapping) until a free slot appears","Going to the mirror slot","Storing in slot 0","Giving up"], a:0, why:"Just walk right until there's space. Danger: keys steal other keys' homes, and pile-ups snowball." },
  { q:"Hash table with h(k) = k mod 7 and linear probing (a taken slot sends you to the next slot along). Insert 13, 14, 18, 7, 1, 5, 77 in that order. Key 7 wants slot 0 (taken by 14) so it sits in slot 1. What happens to key 1?", o:["It sits in slot 1 anyway","Slot 1 is stolen, so it probes on to slot 2","It replaces 7","It goes to slot 0"], a:1, why:"7 stole 1's home! 1 probes to slot 2. Then 77 probes 0→1→2→3: four looks to find later. That snowball is probing's weakness — exam questions love it.", tag:"Sheet 2.5" },
  { q:"With a good hash function and sensible load, hash lookup is expected…", o:["O(1)","O(log n)","O(n)","O(n²)"], a:0, why:"Compute slot, look there — constant. Worst case (everything colliding) degrades to O(n), which is why the collision strategy matters." },
  { q:"WORST case for a hash table — every key lands in one slot. Lookup costs…", o:["Still O(1)","O(log n)","O(n) — it degrades into scanning a list","O(n²)"], a:2, why:"One giant chain, walked end to end. The O(1) promise depends on keys spreading out — hash function and table size are what protect it." },
  { q:"A hash table resolves collisions by chaining. Slot 0 holds the linked list 14 → 7 → 77. Looking up 77 inspects…", o:["1 key","2 keys","3 keys","7 keys"], a:2, why:"Walk the chain: 14, then 7, then 77. Chain position = cost. (Probing needed 4 looks for the same key — which wins is data-dependent.)", tag:"Sheet 2.5" },
  { q:"Why do PRIME table sizes (like 4013) often beat round ones (like 4000)?", o:["Primes are lucky","Real keys share factors with round sizes, so they cluster; a prime shares factors with almost nothing and spreads remainders evenly","Primes make division faster","They don't"], a:1, why:"Sheet 2.5's Weaver-words experiment tests exactly this — including why sizes that are multiples of 31 misbehave with Java's hashCode.", tag:"Sheet 2.5" },
  { q:"A hash table uses h(k) = k mod 7 (mod = remainder after dividing). Key 25 lives in slot 4. Which of these NEW keys would collide with it — landing in slot 4 too?", o:["30","44","39","50"], a:2, why:"39 = 35 + 4, so remainder 4 — same slot as 25. Two keys collide exactly when they differ by a multiple of the table size (39 − 25 = 14 = 2×7). The others leave remainders 2, 2 and 1.", tag:"Sheet 2.5" },
  { q:"Fresh 5-slot table, h(k) = k mod 5, linear probing (a taken slot sends you one step right, wrapping round). Insert 12, then 22, then 7, in that order. Which slot does 7 end up in?", o:["Slot 2","Slot 3","Slot 0","Slot 4"], a:3, why:"All three keys leave remainder 2, so they all want slot 2. 12 takes it, 22 probes to slot 3, so 7 has to walk 2→3→4. Three keys in and the newest already needs three looks — that is the pile-up snowballing." },
  { q:"A hash table has 20 slots and currently stores 15 keys. Its ‘load factor’ is…", o:["20/15 ≈ 1.33","15/20 = 0.75","15","5"], a:1, why:"Load factor = keys stored ÷ slots available — simply how full the table is. At 0.75 things are getting cosy; most real tables (Python dicts included) quietly grow themselves at around two-thirds full to keep lookups near O(1)." },
  { q:"Which collision strategy can keep accepting new keys even when the load factor climbs ABOVE 1 (more keys than slots)?", o:["Chaining — each slot’s little list just grows longer","Linear probing — it wraps around the ends","Both can","Neither can"], a:0, why:"Probing stores keys IN the slots themselves, so a completely full table is a hard wall — there is literally nowhere left to step. Chains have no such ceiling; lookups just get slower as the lists grow." },
  { q:"With h(k) = k mod 7, inserting 13, 14, 18, 7, 1, 5, 77: chaining’s worst lookup inspects 3 keys (77, last in the chain 14 → 7 → 77), while linear probing’s worst inspects 4 (77 again, probing slots 0→1→2→3). Does chaining keep the worst case lower for ANY collection of data?", o:["Yes — chaining always wins","Yes, as long as the table size is prime","No — it depends on the data; if every key hashes to one slot, both degrade to scanning all n keys","No — probing always wins on bigger tables"], a:2, why:"Chaining wins here because probing mixes keys from DIFFERENT home slots into one pile-up, while a chain only holds its own slot’s keys. But the gap is data-dependent — in the all-collide nightmare both are just walking n keys. This is sheet 2.5’s closing gotcha.", tag:"Sheet 2.5" },
  { q:"Linear probing table with h(k) = k mod 7: slot 0 holds 14, slot 1 holds 7, and slot 2 holds 1 (key 1 probed there because slot 1 was taken). You delete 7 by simply EMPTYING slot 1. What goes wrong when you next look up key 1?", o:["Nothing — 1 is still sitting safely in slot 2","The search checks slot 1, finds it empty, and stops — wrongly reporting that 1 isn’t in the table","Key 1 gets deleted as well","The table rehashes itself automatically"], a:1, why:"A probing search stops at the first empty slot — that emptiness is normally its proof a key is absent. Blanking a slot breaks that promise for every key that once probed past it, so real tables leave a special ‘deleted’ marker (a tombstone) meaning: keep looking past me.", tag:"Sheet 2.5" },
  { q:"Your 7-slot table using h(k) = k mod 7 is nearly full, so you move everything to a new 13-slot array using h(k) = k mod 13. What must happen to the keys already stored?", o:["Every key must be re-hashed — k mod 13 usually lands somewhere completely different from k mod 7","Copy each slot straight across — slot 3 stays slot 3","Only keys bigger than 7 need to move","Nothing — the table just gains 6 spare slots at the end"], a:0, why:"A key’s home depends on the table size: 13 mod 7 = 6, but 13 mod 13 = 0 — totally different slot. Growing a hash table means re-inserting every key, which is why tables grow rarely but by a lot (roughly doubling) rather than one slot at a time." },
  { q:"You store 4029 four-letter words in a 100-slot table with chaining, but choose the hash function h(word) = number of letters, mod 100. What happens?", o:["A nice even spread — words vary a lot","About 40 words per slot","Lookups stay O(1), since computing 4 mod 100 is fast","Every word hashes to slot 4 — one chain of 4029 keys, and lookup degrades to O(n)"], a:3, why:"Every four-letter word gives h = 4, so the entire dictionary lands in a single slot and you are back to scanning a list. A hash function’s ONE job is to spread keys out — sheet 2.5’s Weaver-words experiment exists to test how well real hash functions manage it.", tag:"Sheet 2.5" },
]},
{ id:"dijkstra", emoji:"🗺️", title:"Dijkstra", unit:"Unit 3 · Graphs & DP", blurb:"Shortest paths, step by step",
  intro:[ { t:"1956: invented in <b>20 minutes at a café — no pen, no paper</b>. Today it's Google Maps.", k:"Why it exists", e:"💡" },
          { t:"The question: from home, what's the shortest route to EVERY other place? Keep a notebook of 'best distance found so far'." },
          { t:"Grow a 'done' bubble: always lock in the NEAREST place you haven't finished — that number is final, forever.", v:"dij" },
          { t:"Then ask: is going THROUGH the new place a shortcut to its neighbours? Update the notebook, repeat.", f:"<div class='fx'>new = <span class='fa'>min</span>(old, there <span class='fb'>+</span> edge)</div><div class='flegend'><span>the 'relax' step</span><span class='fa'>keep whichever is shorter</span></div>" } ],
  qs:[
  { q:"Dijkstra's algorithm answers:", o:["Shortest routes from ONE start node to all others","Shortest routes between ALL pairs","Whether a graph has a cycle","The minimum spanning tree"], a:0, why:"Single source → everywhere. (All pairs at once is Floyd–Warshall.)" },
  { q:"Each round, Dijkstra 'settles'…", o:["The most recently updated node","The unsettled node with the SMALLEST distance estimate","A random neighbour","The node with fewest edges"], a:1, why:"Settle the closest unfinished node — its number is now final. Then update its neighbours. That's the whole loop." },
  { q:"Why can the closest unsettled node u be safely finalised?", o:["Because we process nodes alphabetically","Any other route to u passes through something already further away — and edges only ADD distance","Because u has the fewest neighbours","It can't — Dijkstra sometimes revisits"], a:1, why:"That's the invariant (sheet 2.8 Q2). It's also why Dijkstra REQUIRES non-negative weights — a negative edge could sneak in later and break the promise." },
  { q:"After settling node u at distance 5, you find u's neighbour v via an edge of length 6, and v currently shows 14. You…", o:["Leave v at 14","Update v to 11, since 5 + 6 beats 14","Update v to 6","Settle v immediately"], a:1, why:"'Relaxing': new candidate = settled distance + edge. 11 < 14 → write it in. v stays unsettled — something even better might appear." },
  { q:"Dijkstra from s (edges: x–s 10, s–y 1, s–v 2, y–w 4, …): what is x's estimate JUST BEFORE v is settled?", o:["9","10","11","∞"], a:1, why:"Settle s (y←1, v←2, w←9, x←10), settle y (w←5). Pause BEFORE v settles: x has only the direct s–x edge = 10. The trap, 9 = 2+7 via v, only appears AFTER v settles. Read 'just before' like a lawyer.", tag:"Mock Q1 · 4 marks" },
  { q:"Nodes end up settled in…", o:["Insertion order","Increasing order of their final distance","Decreasing order","Random order"], a:1, why:"Direct consequence of always settling the closest remaining node. Handy exam check: if your trace settles 14 before 11, you slipped." },
  { q:"If every edge has weight 1, Dijkstra behaves exactly like…", o:["Depth-first search","Breadth-first search","Insertion sort","Floyd–Warshall"], a:1, why:"The priority queue only ever holds distances d and d+1 — a plain FIFO queue. BFS is Dijkstra for unit weights.", tag:"Sheet 2.8" },
  { q:"With a binary-heap priority queue, Dijkstra costs…", o:["O(V³)","O(E + V log V)","O(V)","O(2^V)"], a:1, why:"Each node extracted once (V log V), each edge relaxed once (E updates). You'll reuse this in the bandwidth question." },
  { q:"A Dijkstra trace from node a ends with e at final distance 14. Only one of these routes (edge lengths shown) actually adds up to 14 — which?", o:["a→d→e = 5+15","a→b→e = 7+7","a→d→f→e = 5+6+8","a→b→d→e"], a:1, why:"14 beats d→e's 20 and f→e's 19. Exam tip: write WHICH route gave each number — it's free partial marks if you slip elsewhere.", tag:"Sheet 2.8" },
  { q:"A Dijkstra run from a ends with final distances a:0, d:5, b:7, f:11, and every other node further away. The first four nodes to settle were…", o:["a, b, c, d","a, d, b, f — increasing distance order","a, b, d, e","Alphabetical order"], a:1, why:"Settling order = increasing final distance, always. If your trace settles 14 before 11, you've made a slip — use this as a self-check.", tag:"Sheet 2.8" },
  { q:"Add one NEGATIVE-weight edge to the graph. Dijkstra…", o:["Still works fine","May give wrong answers — the 'closest is final' promise breaks","Runs slower but stays correct","Refuses to run"], a:1, why:"A negative edge discovered later could undercut an already-settled node. Non-negative weights are the algorithm's one big precondition — a favourite MCQ." },
  { q:"Why use a heap for the queue instead of scanning all nodes for the minimum each round?", o:["It looks professional","Extract-min drops from O(V) to O(log V) per round — O(E + V log V) overall instead of O(V²)","It saves memory","No real reason"], a:1, why:"The heap IS the reason for the good complexity — and mock Q10e explicitly awards marks for naming this data structure and its costs." },
  { q:"Before Dijkstra takes its very first step from start node s, what does the notebook of distance estimates say?", o:["s gets 0, every other node gets ∞ — ‘no route found yet’","Every node gets 0","Every node gets ∞, including s","s gets 0, neighbours get their edge weights, the rest get ∞"], a:0, why:"You start knowing exactly one fact: getting to s costs nothing. ∞ just means ‘I haven’t found ANY route yet’ — the neighbours only get their edge weights after s is settled, which is the first real step, not the setup." },
  { q:"Run Dijkstra from s on this graph (edges usable both ways): s–a 3, s–b 8, a–b 4, a–c 9, b–c 2. What is the final shortest distance to c?", o:["12","9","10","11"], a:1, why:"Settle s, then a at 3 (b drops to 3+4=7, c gets 3+9=12), then b at 7 (c drops to 7+2=9), then c. The winning route s→a→b→c hops through TWO middlemen — the direct-looking options 12 and 10 are the half-finished answers.", tag:"Sheet 2.8 style" },
  { q:"Dijkstra from a. Edges (both ways): a–b 7, a–d 5, b–e 7, d–e 15, d–f 6, e–f 8. Which sequence of values does node e’s estimate go through before it settles?", o:["∞ → 20 → 14","∞ → 15 → 14","∞ → 20 → 19 → 14","∞ → 14"], a:0, why:"Settling d writes e←5+15=20; settling b improves it to 7+7=14; settling f offers 11+8=19, which LOSES to 14, so nothing is written. Relaxing means min(old, new) — a worse offer changes nothing, it doesn’t overwrite.", tag:"Sheet 2.8" },
  { q:"During a Dijkstra run, a node’s distance estimate can…", o:["Go up if traffic through it gets heavy","Reset to ∞ when its neighbour settles","Only ever DECREASE — and once the node settles, it never changes again","Go up or down until the very end"], a:2, why:"Every update is new = min(old, offer), and min never makes things bigger. Great self-check for traces: if a number in your table ever grew, you’ve made a slip somewhere." },
  { q:"Dijkstra from a on the graph with edges (both ways): a–b 7, a–d 5, b–c 8, b–d 9, b–e 7, c–e 5, d–e 15, d–f 6, e–f 8, e–g 2, f–g 11. What is the final shortest distance to g?", o:["22","18","16","13"], a:2, why:"The tempting route a→d→f→g costs 5+6+11=22, but a→b→e→g costs 7+7+2=16 — that cheap 2-edge out of e is the whole game. The far side of a graph is often reached through the ‘long way round’.", tag:"Sheet 2.8 Q1" },
  { q:"Same graph, same run — edges (both ways): a–b 7, a–d 5, b–c 8, b–d 9, b–e 7, c–e 5, d–e 15, d–f 6, e–f 8, e–g 2, f–g 11. Dijkstra from a settles a, d, b, f first. Which node settles FIFTH?", o:["c","g","f","e"], a:3, why:"After f settles, the unsettled estimates are e:14 (via b, 7+7), c:15 (via b, 7+8), g:22 (via f, so far). Smallest wins: e at 14. You can’t just eyeball this — you have to run the relaxations, which is exactly what the exam trace question checks.", tag:"Sheet 2.8 Q1" },
  { q:"Feeling lazy, you skip the heap: each round you scan ALL the unsettled nodes to find the smallest estimate. Total cost on V nodes?", o:["Still O(E + V log V)","O(V²) — V rounds, each scanning up to V nodes. And on a DENSE graph (E ≈ V²) that’s actually just as good as the heap version","O(V³)","O(V log V)"], a:1, why:"V settle-rounds × an O(V) scan = O(V²). The heap only pays off when the graph is sparse — if nearly every pair of nodes is connected anyway, E ≈ V² swamps everything and the humble scan keeps up." },
  { q:"Directed edges: s→a costs 2, s→b costs 5, b→a costs −4. If you run Dijkstra from s anyway, what happens at node a?", o:["Dijkstra locks a in at distance 2 — but the real shortest route, s→b→a, costs 5 + (−4) = 1. Wrong answer, no error message","It correctly reports 1, since relaxation still works","It crashes when it meets the negative edge","It reports −4"], a:0, why:"a looks closest (2 < 5), so it settles first and is never looked at again — then the negative edge sneaks a cheaper route in through the ‘further’ node b. That’s the scary part: no crash, no warning, just a confidently wrong number." },
]},
{ id:"bandwidth", emoji:"🌉", title:"Floyd–Warshall & bandwidth ⭐", unit:"Unit 3 · Graphs & DP", blurb:"The mock's 20-mark question",
  intro:[ { t:"Video calls don't want the SHORTEST route — they want the route with the <b>strongest weak link</b>. Real network engineering… and your exam's 20-mark question.", k:"Why it exists", e:"💡" },
          { t:"Floyd–Warshall fills one big table of best routes between ALL pairs, by allowing 'layovers' through one node at a time." },
          { t:"For bandwidth: a chain of pipes carries only what its skinniest pipe allows.", v:"pipes" },
          { t:"Same algorithm, two words swapped. That's the 6-mark adaptation.", f:"<div class='fx'>short: min(d, d₁ <span class='fd'>+</span> d₂)<br>wide: max(b, <span class='fa'>min</span>(b₁, b₂))</div><div class='flegend'><span class='fd'>+ becomes min</span><span class='fa'>min becomes max</span></div>" },
          { t:"Huge sparse network? The table way costs Θ(V³) = days. Run Dijkstra from every node instead = minutes." } ],
  qs:[
  { q:"Floyd–Warshall computes…", o:["Shortest paths from one source","Shortest paths between EVERY pair of nodes","Maximum flow","A spanning tree"], a:1, why:"One big table of best distances for all pairs. Think airline layovers: allow routing through airports one at a time." },
  { q:"Floyd–Warshall's update rule is d[i][j] ← …", o:["min(d[i][j], d[i][k] + d[k][j])","d[i][k] + d[k][j]","max(d[i][j], d[i][k])","min(d[i][k], d[k][j])"], a:0, why:"“Is going through k cheaper than what I have?” Three nested loops over k, i, j make every layover available." },
  { q:"Floyd–Warshall's complexity on V nodes is…", o:["Θ(V log V)","Θ(V²)","Θ(V³)","Θ(2^V)"], a:2, why:"Three nested loops over all V nodes. Cubic — fine for hundreds of nodes, fatal for 10⁵." },
  { q:"A chain of connections with bandwidths 100, 56, 1000 has overall bandwidth…", o:["1156","1000","100","56"], a:3, why:"A chain is as good as its weakest link: the MINIMUM along the route. And you want the route whose weakest link is strongest — 'widest path'.", tag:"Mock Q10" },
  { q:"To adapt Floyd–Warshall from shortest-path to best-bandwidth, the update becomes b[i][j] ← …", o:["min(b[i][j], b[i][k] + b[k][j])","max(b[i][j], min(b[i][k], b[k][j]))","min(b[i][j], max(b[i][k], b[k][j]))","b[i][k] · b[k][j]"], a:1, why:"min combines a route (weakest link), max picks the better route. Two-operator swap, same loops, same Θ(V³). This exact adaptation is worth 6 marks on the mock.", tag:"Mock Q10b" },
  { q:"10⁵ devices, 10⁹ operations/second, a Θ(V³) algorithm daily. Feasible?", o:["Yes — about 17 minutes","Yes — about 3 hours","No — about 10⁶ seconds ≈ 11.6 days","No — about 300 years"], a:2, why:"(10⁵)³ = 10¹⁵ ops ÷ 10⁹ = 10⁶ seconds. A day is ~10⁵ seconds. Two powers-of-ten divisions = 2 marks.", tag:"Mock Q10d" },
  { q:"Each device has ~3 connections (so E ≈ 1.5V). The fast alternative for all-pairs bandwidth is…", o:["Floyd–Warshall but optimised","Widest-path Dijkstra (max-heap, min at each relax) run from EVERY node: O(V² log V)","Brute force over all routes","Sorting the edges"], a:1, why:"Sparse graph → each Dijkstra run is O(V log V); V runs → V² log V ≈ 2×10¹¹ ops → minutes. Name the data structures: adjacency list + binary heap.", tag:"Mock Q10e · 6 marks" },
  { q:"In a network where a route's bandwidth = its weakest link, you want ONE structure that contains a best-bandwidth route between EVERY pair of nodes. It's…", o:["A shortest-path tree","A hash table","A MAXIMUM spanning tree (Kruskal, biggest edges first)","A sorted array"], a:2, why:"Run Kruskal taking edges in DECREASING bandwidth order, skip edges that close a cycle. The resulting tree's unique path between any pair is a widest path.", tag:"Sheet 2.9 Q5" },
  { q:"How is the Floyd–Warshall table initialised, before any layovers are allowed?", o:["All zeros","Direct edge weights; ∞ where there's no edge; 0 from each node to itself","All ∞","Randomly"], a:1, why:"Start from the 'no layovers' truth, then let each k improve it. (Bandwidth flavour: direct bandwidths, 0 for no link, ∞ to yourself.)" },
  { q:"Smaller network: 10⁴ devices, so V³ = 10¹². At 10⁹ ops/sec, daily Floyd–Warshall is…", o:["Hopeless — a year","Fine — about 1000 seconds ≈ 17 minutes","Hopeless — 11 days","Instant"], a:1, why:"10¹² ÷ 10⁹ = 10³ seconds. Feasibility FLIPS with scale — always do the powers-of-ten division rather than guessing.", tag:"Exam skill" },
  { q:"Kruskal for the maximum spanning tree: sort edges by decreasing bandwidth, add unless a cycle forms. Complexity?", o:["Θ(V³)","O(E log E) — the sort dominates","O(V)","O(2^E)"], a:1, why:"Sort all edges, then near-constant union–find work per edge. On the sparse network that's about V log V — even cheaper than Dijkstra-from-everywhere.", tag:"Sheet 2.9 Q5" },
  { q:"Why does ONE maximum spanning tree contain a widest path between EVERY pair?", o:["Trees are always optimal","For any cut of the network, the tree kept the strongest edge crossing it — so no detour can offer a better bottleneck","It doesn't — you need V different trees","Because trees have no cycles"], a:1, why:"Kruskal met each cut's strongest edge first and only rejects cycle-closers. One tree answers all queries — the elegant end of sheet 2.9.", tag:"Sheet 2.9 Q5" },
  { q:"Bandwidth Floyd–Warshall, mid-run. The table currently says: best A→C = 20, best A→B = 50, best B→C = 30. The outer loop now allows layovers through B. After the update b[A][C] ← max(b[A][C], min(b[A][B], b[B][C])), the entry b[A][C] is…", o:["20 — the update changes nothing","50","30","80"], a:2, why:"Work inside-out: min(50, 30) = 30 is the weakest link of the two-leg route A→B→C. Then max(20, 30) keeps whichever route is better — the new detour beats the old 20, so the table improves to 30.", tag:"Sheet 2.9 Q1" },
  { q:"Floyd–Warshall has three nested loops over k (the layover node), i (start) and j (end). Which index MUST be the OUTERMOST loop?", o:["k — switch on one layover node at a time, updating the whole table before allowing the next","i — always loop over start nodes first","j — always loop over end nodes first","Any of the three orders computes the same table"], a:0, why:"The algorithm's logic is staged: after processing layover k, every entry is the best route using only the first k nodes as stopovers. Bury k inside and that staging collapses — routes get built from permissions you haven't granted yet. Classic exam trap.", tag:"Mock Q10a" },
  { q:"Shortest-path Floyd–Warshall initialises ‘no direct edge’ as ∞. In the best-BANDWIDTH version, a missing connection between two devices should start as…", o:["∞ — same as the shortest-path version","−1, as an error flag","The average of all bandwidths","0 — a non-existent link carries nothing, so max() will never prefer it"], a:3, why:"The ‘worst possible’ value flips with the goal: for min-cost the unbeatable-bad value is ∞, for max-bandwidth it's 0. (And to yourself the roles flip too: bandwidth ∞, since you needn't send anything anywhere.)", tag:"Sheet 2.9 Q1" },
  { q:"Widest-path Dijkstra: node u is settled with bottleneck 40 (the best route from the source to u has weakest link 40). Edge u–v has bandwidth 25, and v's current label is 10. After relaxing edge u–v, v's label becomes…", o:["10 — settled labels never improve","40","65","25"], a:3, why:"A route to v through u is only as good as its skinniest pipe: min(40, 25) = 25. That beats v's current 10, so overwrite. (65 is the shortest-path habit of ADDING — the exact habit this adaptation asks you to break.)", tag:"Mock Q10e" },
  { q:"A network has 1000 devices and the computer runs 10⁹ operations per second. Roughly how long does one Θ(V³) Floyd–Warshall run take?", o:["About a millisecond","About 1 second","About 17 minutes","About 11 days"], a:1, why:"1000³ = 10⁹ operations, divided by 10⁹ per second = about 1 second. Feel the cliff: 10³ devices ≈ 1 s, 10⁴ ≈ 17 min, 10⁵ ≈ 11.6 days — cubing punishes every extra power of ten with three more.", tag:"Mock Q10d" },
  { q:"A network has links A–B (bandwidth 90), B–C (80), A–C (70) and C–D (60). You build a maximum spanning tree with Kruskal: take edges biggest-first, skipping any that close a cycle. Which edge gets REJECTED?", o:["C–D (60)","A–B (90)","A–C (70)","Nothing is rejected"], a:2, why:"Take 90, take 80 — now A, B, C are all connected. The 70 edge would close a cycle, and it's safe to drop: A already reaches C through the tree with bottleneck min(90, 80) = 80, wider than 70. Then 60 joins D. Rejected cycle-closers are never missed.", tag:"Sheet 2.9 Q5" },
  { q:"Devices S and T have a direct link of bandwidth 10. There's also a longer route S–A–T whose two links have bandwidths 100 and 90. Which route does widest-path routing choose, and what's its bandwidth?", o:["The direct link — fewer hops always wins, so 10","The two-hop route, bandwidth min(100, 90) = 90","The two-hop route, bandwidth 100","The two-hop route, bandwidth 100 + 90 = 190"], a:1, why:"Unlike shortest paths, extra hops cost nothing by themselves — only a skinny link hurts. Two fat pipes beat one thin one, and the chain carries what its weakest pipe allows: 90. This is why ‘shortest’ intuition must be switched off for bandwidth.", tag:"Sheet 2.9 Q1" },
  { q:"Floyd–Warshall is paused part-way: the outer loop has processed layover nodes 1 to k (out of V). What does a table entry b[i][j] hold at this moment?", o:["The best-bandwidth route from i to j that only uses nodes 1…k as intermediate stops","The final, fully optimal answer already","Just the direct-edge bandwidth from i to j","A meaningless partial value that only makes sense at the end"], a:0, why:"That's the algorithm's whole story: each pass of the outer loop asks ‘does a layover through the newly allowed node help any pair?’. The table is always correct FOR THE LAYOVERS GRANTED SO FAR — and once k reaches V, every stopover has been offered, so it's final.", tag:"Mock Q10a" },
]},
{ id:"dp", emoji:"🐇", title:"Fibonacci & DP ⭐", unit:"Unit 3 · Graphs & DP", blurb:"The other 20-mark question",
  intro:[ { t:"Named '<b>dynamic programming</b>' to hide maths from a boss who hated the word 'research'. It just means: write answers down so you never solve the same thing twice.", k:"Why it exists", e:"💡" },
          { t:"The lazy way asks the same question again and again and again. The table answers it once.", v:"dpv" },
          { t:"Here is ALL of dynamic programming — fill the list left to right:", code:"fib = [1, 1]\nfor i in 2..n:\n  fib[i] = fib[i-1] + fib[i-2]" },
          { t:"Result: fib(12) takes 11 additions instead of 232. Exponential → linear, just by writing things down." } ],
  qs:[
  { q:"fib: 1, 1, 2, 3, 5, 8, 13, … what's next?", o:["18","20","21","26"], a:2, why:"Each number is the sum of the previous two: 8 + 13 = 21." },
  { q:"Why is the naive recursive fib(n) horribly slow?", o:["Recursion itself is slow in Java","It recomputes the same sub-values exponentially many times","It uses too much memory","Addition is expensive"], a:1, why:"fib(n−2) is computed twice, fib(n−3) three times… the duplication snowballs into an exponential call tree." },
  { q:"Dynamic programming fixes it by…", o:["Using a faster formula","Filling a table bottom-up so each value is computed exactly ONCE","Using two recursions instead of one","Guessing and checking"], a:1, why:"Write fib(0), fib(1), then each entry = sum of previous two. Store, don't recompute — that one sentence is dynamic programming." },
  { q:"How many additions does the DP table use to reach fib(12)?", o:["11","12","144","232"], a:0, why:"One addition per entry fib(2)…fib(12) → 11. In general n−1 → O(n). The naive recursion needs 232 — that contrast is the point.", tag:"Mock Q9d" },
  { q:"How many additions does NAIVE recursion need for fib(12)?", o:["66","144","232","4096"], a:2, why:"A(n) = A(n−1) + A(n−2) + 1 tabulates to A(12) = 232 (neat pattern: A(n) = fib(n) − 1).", tag:"Mock Q9a" },
  { q:"To prove T(n) ≤ 2ⁿ for T(n) = T(n−1) + T(n−2) + 1, the induction step is…", o:["2ⁿ⁻¹ + 2ⁿ⁻² + 1 ≤ 2ⁿ⁻¹ + 2ⁿ⁻¹ = 2ⁿ ✓","2ⁿ⁻¹ × 2ⁿ⁻² = 2ⁿ ✓","2ⁿ + 2ⁿ = 2ⁿ⁺¹ ✓","It needs the Master Theorem"], a:0, why:"Assume the bound for smaller n, substitute, massage: the two smaller powers sum to at most 2ⁿ. Template: guess → substitute → algebra.", tag:"Mock Q9b" },
  { q:"The naive recursion's cost T(n) is squeezed between…", o:["n² and n³","(3/2)ⁿ and 2ⁿ","log n and n","n and n log n"], a:1, why:"O(2ⁿ) from the last question; Ω((3/2)ⁿ) via the same trick using 3/2 + 1 = 5/2 ≥ (3/2)². Exponential either way — recursion without storing = doom.", tag:"Mock Q9e" },
  { q:"Why doesn't the Master Theorem apply to T(n) = T(n−1) + T(n−2) + 1?", o:["Too many terms","The size shrinks by SUBTRACTION, not division","T(0) isn't defined","It does apply"], a:1, why:"Master needs T(n/b)-shaped calls. Subtractive recurrences get induction instead — which is exactly what mock Q9 makes you do." },
  { q:"Naive-recursion additions A(n) = A(n−1) + A(n−2) + 1 follow a pretty pattern:", o:["A(n) = 2ⁿ","A(n) = fib(n) − 1","A(n) = n²","A(n) = n!"], a:1, why:"Check it: A(3) = 2 = 3−1 ✓, A(6) = 12 = 13−1 ✓, A(12) = 232 = 233−1 ✓. Lets you answer 'how many additions?' instantly.", tag:"Mock Q9a" },
  { q:"Memoisation (caching results inside the recursion) vs the bottom-up table:", o:["Only the table counts as dynamic programming","Both are DP — each subproblem still gets computed exactly once","Memoisation stays exponential","They give different answers"], a:1, why:"Same principle, opposite direction: top-down remembers as it goes, bottom-up pre-fills. Both turn fib exponential → linear." },
  { q:"To prove both T(n) = O(2ⁿ) and T(n) = Ω((3/2)ⁿ) for T(n) = T(n−1) + T(n−2) + 1, the same proof template works for both directions. It is…", o:["Guess the bound → assume it for smaller n → substitute into the recurrence → algebra out the same bound","Try n = 1, 2, 3 and stop","Apply the Master Theorem","Draw the whole call tree"], a:0, why:"O(2ⁿ): 2ⁿ⁻¹ + 2ⁿ⁻² + 1 ≤ 2ⁿ. Ω((3/2)ⁿ): (3/2)ⁿ⁻¹ + (3/2)ⁿ⁻² = (5/2)·(3/2)ⁿ⁻² ≥ (3/2)ⁿ. Same machine, two directions — 10 marks on the mock.", tag:"Mock Q9" },
  { q:"What does T(n) = Ω((3/2)ⁿ) actually claim?", o:["T is at most (3/2)ⁿ","T is AT LEAST (3/2)ⁿ (times a constant, eventually) — a lower bound","T equals (3/2)ⁿ exactly","Nothing useful"], a:1, why:"Ω is the ≥ twin of O. Together with O(2ⁿ) it traps naive fib between two exponentials — slow no matter what." },
  { q:"The induction proof that T(n) ≤ 2ⁿ for T(n) = T(n−1) + T(n−2) + 1 needs base cases checked by hand before the step can take over. How many, and which?", o:["None — induction never needs base cases","One: just n = 0","Two: n = 0 AND n = 1, because the step reaches back TWO values","One for every single n"], a:2, why:"The step for n leans on both n−1 and n−2, so the first n it can handle is 2 — you must verify n = 0 and n = 1 yourself (0 additions ≤ 1 ✓). Forget one and the whole proof has a hole under it.", tag:"Mock Q9b" },
  { q:"To prove T(n) = Ω(cⁿ) for T(n) = T(n−1) + T(n−2) + 1, the induction step needs cⁿ⁻¹ + cⁿ⁻² ≥ cⁿ. Divide everything by cⁿ⁻² and this becomes a simple condition on the base c. Which?", o:["c ≥ 2","c + 1 ≥ c²","2c ≥ c²","c² ≥ c + 1"], a:1, why:"For c = 3/2: 5/2 ≥ 9/4 ✓, so Ω((3/2)ⁿ) goes through. For c = 2: 3 ≥ 4 ✗ — which is exactly why the mock’s lower bound uses 3/2, not 2. (Any c up to the golden ratio ≈ 1.618 would work.)", tag:"Mock Q9e" },
  { q:"You ask naive recursive fib for fib(6) (with fib(0) = fib(1) = 1). How many separate times does the call tree end up computing fib(2)?", o:["5","3","4","8"], a:0, why:"fib(6) calls fib(5) and fib(4), and BOTH eventually want fib(2) again — the repeat-counts themselves grow like Fibonacci (1, 1, 2, 3, 5 as the target rises). That snowballing duplication IS the exponential blow-up." },
  { q:"This memoised fib caches every result it computes. How many + operations does it perform when you call fib(20)?", code:"memo = {}\nfib(n):\n  if n in memo: return memo[n]\n  if n ≤ 1: return 1\n  memo[n] = fib(n-1) + fib(n-2)\n  return memo[n]", o:["2²⁰","10945","20","19"], a:3, why:"The cache check means each of fib(2)…fib(20) gets computed exactly once — one addition each, so 19. That’s the same n−1 additions as the bottom-up table: memoisation is just the table filled top-down." },
  { q:"The bottom-up table stores all of fib(0)…fib(n) in n+1 slots. If you only want the single number fib(n), how much storage does the loop actually need?", o:["Still all n+1 slots","Just TWO variables shuffled along — O(1) space","About log₂n slots","fib(n) slots"], a:1, why:"Each step only ever reads the previous two values, so keep two variables and slide them forward. The full table is only needed if you genuinely want ALL the answers, not just the last one." },
  { q:"In the bottom-up loop <code>for i in 2..n: fib[i] = fib[i-1] + fib[i-2]</code>, why must i climb UP from 2 rather than start at n and count down?", o:["Counting down would overflow the array","It makes no difference either way","Entry i needs entries i−1 and i−2 already filled — going up, they always are","Counting up uses less memory"], a:2, why:"DP’s golden rule: fill the table in an order where every subproblem’s ingredients are already cooked. Start at n and fib[n-1] is still empty — the whole trick collapses." },
  { q:"Let T(n) count the + operations this code performs. Which recurrence defines T?", code:"fib(n):\n  if n ≤ 1: return 1\n  return fib(n-1) + fib(n-2)", o:["T(n) = T(n−1) + T(n−2) + 1, with T(0) = T(1) = 0","T(n) = 2T(n/2) + 1","T(n) = T(n−1) + 1","T(n) = T(n−1) + T(n−2)"], a:0, why:"The cost is everything inside fib(n−1), plus everything inside fib(n−2), plus the ONE addition joining them — and the base cases add nothing. Writing this down is step one of the mock’s 20-marker, before any bounds.", tag:"Mock Q9b" },
  { q:"A computer performs 10⁹ additions per second. Computing fib(100) naively needs about fib(100) ≈ 6×10²⁰ additions. Roughly how do naive recursion and the DP table compare?", o:["Both finish in under a second","Naive takes about a minute; DP is instant","Both take years","Naive takes tens of THOUSANDS of years; DP does 99 additions and is instant"], a:3, why:"6×10²⁰ ÷ 10⁹ = 6×10¹¹ seconds ≈ twenty thousand years, while the table pays one addition per entry — 99 total, done in a microsecond. That’s what exponential vs linear means on a wall clock.", tag:"Mock Q9" },
]},
{ id:"machines", emoji:"🤖", title:"Machines & languages", unit:"Unit 4 · Semester 1", blurb:"DFAs, grammars, and the power ladder",
  intro:[ { t:"1936: Turing designs the computer <b>on paper, before computers existed</b>, to answer one question: what can never be computed?", k:"Why it exists", e:"💡" },
          { t:"A 'language' here just means a set of strings — like 'all words ending in ab'. The game: which machine can spot which sets?" },
          { t:"Three machines. Each one = the last one plus a better memory. The stack is what unlocks counting.", v:"ladder" },
          { t:"Names to remember: DFA spots 'regular' sets, PDA spots 'context-free' sets, Turing machine spots everything computable." } ],
  qs:[
  { q:"In this course, a 'language' is…", o:["A programming language","Just a SET of strings","A grammar","A compiler"], a:1, why:"E.g. “all strings ending in ab”, or “aⁿbⁿ”. Every Semester-1 question is really: can machine X recognise set L?" },
  { q:"A DFA is basically…", o:["A flowchart with finitely many states and no other memory","A computer with unlimited memory","A stack machine","A random process"], a:0, why:"Read one letter, follow the arrow. Its ONLY memory is which circle it's standing in — that limitation is what the pumping lemma exploits." },
  { q:"NFAs (which may 'try options in parallel') recognise…", o:["Strictly more than DFAs","Exactly the same languages as DFAs","Strictly less","Only finite languages"], a:1, why:"Surprising but true: subset construction converts any NFA to a DFA (possibly exponentially bigger). Both = the regular languages." },
  { q:"A PDA is a DFA plus…", o:["A second tape","A stack (push/pop pile)","A dictionary","Unlimited states"], a:1, why:"The stack is what lets it match counts: push per a, pop per b → aⁿbⁿ. PDAs = context-free languages." },
  { q:"{aⁿbⁿ : equal a's then b's} is…", o:["Regular","Context-free but not regular","Not context-free","Finite"], a:1, why:"A DFA can't count unboundedly (no memory), but a PDA's stack does it easily. The classic language separating the two levels." },
  { q:"The grammar rule X → aXb (with X → ε) generates…", o:["Any mix of a's and b's","aⁿbⁿ — matched counts","Alternating abab…","Only ab"], a:1, why:"Each use wraps one a and one b around the outside — counts stay matched automatically. THE tool for building CFGs with matching.", tag:"Sheet 5" },
  { q:"Which closure claim is FALSE?", o:["Regular languages are closed under complement","Regular languages are closed under union","Context-free languages are closed under intersection","Context-free languages are closed under reversal"], a:2, why:"CFLs fail intersection: {aⁿbⁿcᵐ} ∩ {aᵐbⁿcⁿ} = {aⁿbⁿcⁿ}, not context-free. Memorise both closure lists — cheap exam marks.", tag:"Lecturer tip" },
  { q:"A question says 'ARGUE why L₁ ∪ L₂ is regular' (both regular). Full marks =", o:["A full product-automaton construction","One sentence citing the closure property shown in class","A pumping lemma proof","A truth table"], a:1, why:"“Regular languages are closed under union (shown in class), so L₁ ∪ L₂ is regular.” The lecturer explicitly said citing class results is fine — only 'prove' demands the construction." },
  { q:"Converting an NFA to a DFA (the 'subset construction') can blow up to…", o:["n states","n² states","2ⁿ states — one per SET of NFA states","No conversion exists"], a:2, why:"The DFA tracks 'every state the NFA could currently be in' — a subset. Same power, possibly exponential size. A favourite MCQ fact.", tag:"Sheet 2" },
  { q:"How do you get a machine for the COMPLEMENT of L (everything NOT in L)?", o:["Reverse all the arrows","Take L's (complete) DFA and flip accepting ↔ non-accepting states","Add a stack","It's impossible"], a:1, why:"Same walk, opposite verdict. That's the one-line reason regular languages are closed under complement — citable in 'argue why' answers.", tag:"Sheet 1" },
  { q:"A FINITE set of strings, say exactly {ab, ba}, is…", o:["Regular — write the words as a regex: ab|ba","Context-free but not regular","Not recognisable","Needs a Turing machine"], a:0, why:"Any finite list is a regex of alternatives. It's only INFINITE patterns where the machine hierarchy starts to bite." },
  { q:"Regular expressions and finite automata recognise…", o:["Different sets of languages","Exactly the same class — convertible both ways","Regexes strictly more","DFAs strictly more"], a:1, why:"regex → NFA (build with ε-links) → DFA (subsets), and DFA → regex (state elimination, sheet 4). Fully interchangeable — cite it freely." },
  { q:"A language is 'in P' (the complexity class P) exactly when…", o:["It's regular","Some Turing machine DECIDES it in polynomial time (n, n², n³…)","It has a PDA","It's finite"], a:1, why:"P = decidable in polynomially many steps. Sheet 8's pattern: describe the TM, count its passes, conclude 'therefore the language is in P'.", tag:"Sheet 8" },
  { q:"A DFA has states 1, 2, 3 — start in state 1, and ONLY state 3 accepts. The rules: in state 1, a→2 and b→1; in state 2, a→2 and b→3; in state 3, a→2 and b→1. Feed it the word <code>abba</code>, one letter at a time. Where does it end up?", o:["State 3 — the word is accepted","State 2 — the word is rejected","State 1 — the word is rejected","It jams: no rule applies to the last letter"], a:1, why:"Trace it: 1 —a→ 2 —b→ 3 —b→ 1 —a→ 2. Not accepting, so reject. Secret decoder: this machine accepts exactly the words ending in ab (state 3 means 'just saw ab') — and abba ends in ba.", tag:"Sheet 1" },
  { q:"Which set of words does the regex <code>b*ab*</code> describe? (Star means 'zero or more copies of'.)", o:["All words that start with a","All words containing at least one a","Words with EXACTLY one a (b's anywhere around it)","Words where a's and b's strictly alternate"], a:2, why:"Read it left to right: some b's, then ONE compulsory a, then some b's. That lone a in the pattern is the only a a matching word can have — 'at least one' would need something like (a|b)*a(a|b)*.", tag:"Sheet 4" },
  { q:"A grammar has rules S → XY, X → aXb | ε, Y → bYa | ε (ε is the empty string). Which language does S generate?", o:["aᵐbᵐ⁺ⁿaⁿ — a's, then a b-block whose length is the SUM of the two counts, then a's","All words with equal numbers of a's and b's, in any order","Exactly {aⁿbⁿ}","All palindromes over {a, b}"], a:0, why:"X wraps to build aᵐbᵐ, Y wraps to build bⁿaⁿ, and gluing them fuses the two b-blocks into one of length m+n. Splitting a language into two matching jobs, one variable each, is THE standard CFG design move.", tag:"Sheet 5" },
  { q:"Grammar: S → aSbb | ε. Which of these words can it derive?", o:["abab","aabb","ab","aabbbb"], a:3, why:"Every rule use adds ONE a at the front and TWO b's at the back, so the words are exactly aⁿb²ⁿ. Watch: S ⇒ aSbb ⇒ aaSbbbb ⇒ aabbbb. Tempting trap aabb has matched counts — but the wrong 1:2 ratio." },
  { q:"You have a context-free grammar for L. How do you get a grammar for Lᴿ, the language of every word of L written BACKWARDS?", o:["You can't — context-free languages aren't closed under reversal","Reverse the right-hand side of every rule: X → aYb becomes X → bYa","Swap every a for a b and vice versa","Swap the start symbol with a terminal"], a:1, why:"Flip each rule and every parse tree becomes its own mirror image, so every generated word comes out reversed. That one-line construction IS the proof that CFLs are closed under reversal — citable in 'argue why' answers.", tag:"Sheet 5" },
  { q:"Which chain of containments is the true 'power ladder' of language classes?", o:["regular ⊆ context-free ⊆ computable — and each step is STRICT (something new appears each rung)","context-free ⊆ regular ⊆ computable","regular = context-free, both ⊆ computable","The classes overlap but none contains another"], a:0, why:"A DFA is just a PDA that never touches its stack, and a Turing machine can simulate a PDA — so each rung can do everything below it. aⁿbⁿ (needs the stack) and aⁿbⁿcⁿ (beats the stack) prove each step is strict." },
  { q:"L = all words over {a, b} where the NUMBER of a's is divisible by 3 (b's can appear anywhere). What's the smallest machine that recognises L?", o:["A PDA — counting always needs a stack","A Turing machine — arithmetic needs full power","A 3-state DFA that tracks the a-count mod 3","No machine — L isn't recognisable"], a:2, why:"You never need the actual count, only the remainder 0, 1 or 2 — three memories, three states, ignore b's. Counting mod a FIXED number is easy for a DFA; it's unbounded comparisons like aⁿbⁿ that outgrow finite memory.", tag:"Sheet 8" },
  { q:"A Turing machine checks whether aⁱbʲcᵏ satisfies i × j = k like this: for each a, it sweeps along the word crossing off one c per b. On an input of length n, that's at most n sweeps, each at most n steps. What can you conclude?", o:["About 2ⁿ steps — the language is outside P","Roughly n² steps — polynomial, so the language is in P","About n! steps — far too slow","Nothing — Turing machines say nothing about P"], a:1, why:"'In P' just means SOME Turing machine decides it in polynomially many steps — and n² qualifies. This is the sheet-8 recipe in full: describe the machine, count its passes, conclude 'therefore in P'.", tag:"Sheet 8" },
]},
{ id:"pumping", emoji:"🎈", title:"Pumping lemma", unit:"Unit 4 · Semester 1", blurb:"Proving languages too hard for a machine",
  intro:[ { t:"The most famous Stack Overflow answer ever: <b>you can't parse HTML with regex</b>. This lemma is the proof — maths for showing a tool can NEVER do a job.", k:"Why it exists", e:"💡" },
          { t:"A small machine reading a long word must go round a LOOP — and lapping the loop again must be fine too. Unless that breaks the pattern… gotcha.", v:"pump" },
          { t:"Your job in a proof: pick a word so that EVERY possible loop placement breaks it. You pick the word; your enemy picks the loop." } ],
  qs:[
  { q:"Why must a DFA with 50 states, reading a 60-letter word, repeat a state?", o:["Because words are random","Pigeonhole: more steps than states forces a revisit — the path contains a loop","Because DFAs are slow","It needn't"], a:1, why:"That loop is the 'y' you pump: going round it more (or zero) times can't change the machine's verdict. The whole lemma is this one observation." },
  { q:"Regular pumping lemma: long words split as w = xyz where…", o:["|xy| ≤ n, y non-empty, and x yⁱ z stays in L for ALL i ≥ 0","x is empty and z is empty","y is the whole word","|z| ≤ n and z repeats"], a:0, why:"The loop y sits within the first n letters and can be repeated or skipped freely. 'For all i' includes i = 0 — pumping DOWN is allowed." },
  { q:"In a pumping-lemma proof, who chooses what?", o:["You choose the word AND the split","You choose the word; the split is your adversary's — you must beat EVERY legal split","The adversary chooses the word","Nobody chooses anything"], a:1, why:"Choose your word cleverly (to force y somewhere useful), then show every allowed split breaks. Beating one split proves nothing." },
  { q:"Proving aⁿbⁿ not regular with w = aⁿbⁿ: why is y guaranteed to be all a's?", o:["Because y is always first","|xy| ≤ n traps x and y inside the first n letters — the a-block","Because b's can't be pumped","It isn't guaranteed"], a:1, why:"That's why we chose THIS word: the constraint pins y in the a's. Pump once: more a's than b's → not in L → contradiction.", tag:"The template" },
  { q:"The CONTEXT-FREE pumping lemma splits w = uvxyz and pumps…", o:["Only v","Only y","v and y together (u vⁱ x yⁱ z), with |vxy| ≤ n","The whole word"], a:2, why:"A repeated grammar symbol in a tall parse tree splices in TWO synchronized chunks, one each side. Five parts, pump the 2nd and 4th." },
  { q:"Proving aⁿbⁿcⁿ not context-free with w = aⁿbⁿcⁿ: the key observation about the window vxy is…", o:["It's always at the start","Being ≤ n letters long, it touches at most TWO of the three letter blocks","It contains no a's","It equals the whole word"], a:1, why:"So pumping grows at most two letter types — the third is left behind, counts break, contradiction. The lecturer worked exactly this and called it the expected exam level.", tag:"Lecturer benchmark" },
  { q:"For L = {ww : w any string} (two copies), a good word to pump is…", o:["aⁿ","abab","aⁿbⁿaⁿbⁿ","aⁿbⁿcⁿ"], a:2, why:"The short window can only disturb one region, unbalancing the two copies. Choosing the right word is 80% of every pumping proof.", tag:"Sheet 6" },
  { q:"Pumping DOWN (i = 0) means…", o:["Deleting the v and y chunks — useful when you need counts to SHRINK","Reversing the word","Removing one letter","Nothing — i starts at 1"], a:0, why:"For {aⁱbʲcᵏ : i ≤ j ≤ k}, pumping up can't break 'k biggest' if the window sits in the c's — pump DOWN instead to drag j or k below i. Keep both directions in your toolbox." },
  { q:"In the pumping game, the pumping length n is…", o:["Chosen by you","Unknown — your proof must work whatever n turns out to be","Always 5","The length of your word"], a:1, why:"You only know n EXISTS. That's why proofs pick words WRITTEN IN TERMS OF n, like aⁿbⁿ — one choice beats every possible n at once." },
  { q:"Prove {bᵏab³ᵏ} not regular: which word, and where is y forced?", o:["w = bab³; y is the a","w = bⁿab³ⁿ; |xy| ≤ n traps y inside the FIRST b-block","w = aⁿ; y anywhere","No proof exists"], a:1, why:"Pump y (some front b's): the front block grows but the back 3k doesn't follow → out of the language. Choosing a word that FORCES y somewhere useful is the whole skill.", tag:"Sheet 4" },
  { q:"{a^(k²)} — word lengths 1, 4, 9, 16… — is not regular because…", o:["Pumping adds at most n letters, but gaps between squares eventually exceed n — the pumped word lands BETWEEN squares","You can't write squares as words","It's context-free instead","Pumping changes the letters"], a:0, why:"n² + |y| ≤ n² + n < (n+1)². The loop is too small to jump the gap. The same 'gaps outgrow the loop' trick kills {a^p : p prime}.", tag:"Sheet 4" },
  { q:"For {aⁱbʲcᵏ : i ≤ j ≤ k}, the adversary puts the whole window inside the c-block. Your move?", o:["Pump UP — more c's","Pump DOWN (i = 0) — deleting c's drags k below j","Concede the case","Move the window"], a:1, why:"Extra c's keep i ≤ j ≤ k perfectly happy — pumping up proves nothing here. Deleting breaks it. Ask per case: up or down?", tag:"Sheet 6" },
  { q:"Sneaky alternative to pumping: L ∩ a*b* = {aⁿbⁿ}. If L were regular…", o:["Nothing follows","Then aⁿbⁿ would be regular too (closure under intersection with a regular language) — contradiction, so L isn't regular","L must be context-free","The intersection is empty"], a:1, why:"Closure properties as a weapon: intersect with something regular to distil a KNOWN non-regular core. Often faster than pumping — and citable.", tag:"Exam trick" },
  { q:"Practice run: take w = aaabbb split as x = a, y = aa, z = bbb. Pumping to i = 2 means writing the y chunk twice. What word is x y² z?", o:["aaabbbbb","aaabbb","aaaaabbb","aaaaaaabbb"], a:2, why:"Pumping is just photocopying the y chunk: a · aa · aa · bbb = a⁵b³. Five a's against three b's — so if the language demanded equal counts, this word just fell out of it. That falling-out IS the contradiction in every pumping proof." },
  { q:"You want to prove L = {words with an EQUAL number of a's and b's} is not regular, and you pick the word w = ababab…ab, that is (ab)ⁿ. Why is this a losing move?", o:["The adversary can choose y = ab — pumping extra copies of ab keeps the counts equal forever, so no split ever breaks","(ab)ⁿ is too short for the lemma to apply","Words used in pumping proofs must end in a block of b's","Equal-count languages are actually regular, so no word works"], a:0, why:"Your word must break under EVERY legal split, and here one split survives all pumping — proof dead on arrival. Choose aⁿbⁿ instead: it lives in L, and |xy| ≤ n traps y among the a's, where pumping wrecks the balance.", tag:"Word choice" },
  { q:"Is L = {aᵐbⁿ : m, n ≥ 0} — some a's followed by some b's, with NO link between the two counts — regular?", o:["No — pumping the a-block breaks it","No — it needs a stack to hold the a's","Only the words where m = n are regular","Yes — it's just the pattern a*b*; trouble only starts when the counts must MATCH"], a:3, why:"A machine for this never counts anything — it only checks that no a appears after a b, which two states can do. Non-regularity comes from remembering an unbounded NUMBER, not from the shape of the word. Same trap as HTML: nesting DEPTH is what regex can't track." },
  { q:"Suppose a language L passes the pumping test: every long word in L can be pumped safely. What have you learned?", o:["L is regular — that's the whole point of the lemma","Nothing — the lemma only runs one way, so it can prove languages NOT regular but never certify one as regular","L must be finite","L is context-free but not regular"], a:1, why:"The lemma says regular ⇒ pumpable, full stop. Passing is like passing one medical test — it can catch a disease but never certifies health, and some genuinely non-regular languages pump just fine. To prove a language IS regular, build a DFA or a regex instead.", tag:"Common trap" },
  { q:"Pumping w = aⁿbⁿcⁿ with the context-free lemma (w = uvxyz), the adversary hands you a chunk v containing BOTH a's and b's, say v = aab. Why does pumping to i = 2 fail instantly?", o:["v² = aabaab puts a b before an a — the pumped word no longer even has the shape a…ab…bc…c, before you count a thing","The pumped word becomes too long to check","v is only allowed to contain one kind of letter","The c's get deleted when v is repeated"], a:0, why:"Every word in the language is a's, then b's, then c's, strictly in that order. Repeating a mixed chunk smashes the ordering — that's the quick case of the proof. The slower case (v and y each pure) breaks the COUNTS instead. Two cases, both dead.", tag:"The mixed case" },
  { q:"A pushdown automaton is a finite machine plus an unbounded stack. How does one accept {aᵏb³ᵏ} — k a's followed by exactly 3k b's?", o:["It can't — no stack machine can multiply by three","Store the number k in its states","Push THREE tokens per a read, then pop ONE per b — the stack empties exactly when 3k b's have arrived","Read the b's first and divide by three"], a:2, why:"The stack is a counter, and pushing three-per-a bakes the ×3 into the count. So aᵏb³ᵏ is context-free even though pumping shows it isn't regular — while cousins like aⁿbⁿcⁿ beat even the stack. One added stack is exactly one level up the food chain.", tag:"Sheet 6" },
  { q:"L = {ab, aabb, aaabbb} — just those three words, nothing else. Does the pumping lemma make any trouble for L being regular?", o:["Yes — aaabbb cannot be pumped, so L is not regular","No — take the pumping length n bigger than 6: no word in L is long enough for the lemma to bite, so it holds for free","Yes — languages built from aⁿbⁿ words are never regular","Only if the pumping length happens to be 1"], a:1, why:"The lemma only makes demands on words of length at least n — shorter words are exempt. Every finite language is regular (a DFA can simply hard-code the list), and it dodges the lemma vacuously: there's nothing long enough to pump. Infinity is where the fight starts." },
  { q:"Context-free pumping on w = aaabbb with the split u = aa, v = a, x = (empty), y = b, z = bb. What is u v² x y² z?", o:["aaaabbb","aaabbbb","aabbaabb","aaaabbbb"], a:3, why:"aa · aa · (nothing) · bb · bb = a⁴b⁴ — still perfectly balanced! The chunks v and y pump in LOCKSTEP, one on each side of x, which is exactly why aⁿbⁿ sails through the context-free lemma (it IS context-free) despite flunking the regular one." },
]},
];

/* ================= PROFILE & ADAPTIVE MODEL ================= */
const XP_FIRST = 10, XP_RETRY = 5, XP_COMBO = 2, HEARTS = 3, QUICK_N = 5, SMART_N = 7, LESSON_N = 7, DAY_GOAL = 30;
const KEY = "cm52070-algo-quest";
const BOX_DAYS = [0, 1, 3, 7, 14];
const EMA_A = 0.3;

function fresh() { return { v: 3, xp: 0, done: {}, streak: 0, lastDay: null, sound: true, q: {}, t: {}, totAtt: 0, totFirst: 0, dayXP: 0, dayDate: null, goalDay: null, onboarded: false, seenIntro: {} }; }
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.v === 3) {
      if (s.introV !== 4) { s.introV = 4; s.seenIntro = {}; }  /* re-show intros once: simpler text + formula/code cards */
      return s;
    }
    if (s && (s.v === 1 || s.v === 2)) {
      const f = fresh();
      f.xp = s.xp || 0; f.done = s.done || {}; f.streak = s.streak || 0; f.lastDay = s.lastDay || null;
      f.sound = s.sound !== false; f.q = s.q || {}; f.t = s.t || {}; f.totAtt = s.totAtt || 0; f.totFirst = s.totFirst || 0;
      f.onboarded = true; /* returning player — don't re-onboard */
      return f;
    }
  } catch (e) {}
  return fresh();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} }
let P = load();

function today() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function touchDay() { const t = today(); if (P.dayDate !== t) { P.dayDate = t; P.dayXP = 0; } }
function addXP(n) { touchDay(); P.xp += n; P.dayXP += n; }

function record(q, right) {
  const now = Date.now();
  const qs = P.q[q.id] || (P.q[q.id] = { box: 0, last: 0, att: 0, wrong: 0 });
  qs.att++; qs.last = now;
  if (right) qs.box = Math.min(qs.box + 1, BOX_DAYS.length - 1);
  else { qs.box = 0; qs.wrong++; }
  const t = P.t[q.lvlId] || (P.t[q.lvlId] = { att: 0, first: 0, ema: 0.5 });
  t.att++; if (right) t.first++;
  t.ema = t.ema * (1 - EMA_A) + (right ? 1 : 0) * EMA_A;
  P.totAtt++; if (right) P.totFirst++;
}
function isDue(q, now) {
  const qs = P.q[q.id];
  if (!qs) return true;
  return (now - qs.last) / 86400000 >= BOX_DAYS[qs.box];
}
function mastery(lvlId) {
  const t = P.t[lvlId];
  if (!t || t.att === 0) return null;
  return 0.5 * (t.first / t.att) + 0.5 * t.ema;
}
function weakTopics(min) {
  return LEVELS
    .map(L => ({ L, m: mastery(L.id), att: (P.t[L.id] || {}).att || 0 }))
    .filter(x => x.att >= (min || 3) && x.m !== null && x.m < 0.75)
    .sort((a, b) => a.m - b.m);
}
function smartQueue() {
  const now = Date.now();
  const unlocked = LEVELS.slice(0, Math.max(1, firstLockedIdx()));
  const pool = [];
  unlocked.forEach(L => L.qs.forEach(q => pool.push(q)));
  const scored = pool.map(q => {
    const qs = P.q[q.id];
    const m = mastery(q.lvlId);
    const weakness = m === null ? 0.5 : 1 - m;
    const missed = qs ? Math.min(qs.wrong, 3) / 3 : 0;
    const due = isDue(q, now) ? 1 : 0;
    const freshB = qs ? 0 : 0.35;
    const doneToday = qs && (now - qs.last) < 36e5 && qs.box > 0 ? 1 : 0;
    const r = Math.random() * 0.5;
    return { q, s: 2.2 * weakness + 1.5 * missed + 1.0 * due + freshB + r - 1.6 * doneToday };
  });
  scored.sort((a, b) => b.s - a.s);
  return shuffle(scored.slice(0, SMART_N).map(x => x.q));
}
function bumpStreak() {
  const t = today();
  if (P.lastDay === t) return;
  const y = new Date(); y.setDate(y.getDate() - 1);
  const yStr = y.getFullYear() + "-" + String(y.getMonth() + 1).padStart(2, "0") + "-" + String(y.getDate()).padStart(2, "0");
  P.streak = (P.lastDay === yStr) ? P.streak + 1 : 1;
  P.lastDay = t;
}
function streakLive() {
  if (!P.lastDay) return 0;
  if (P.lastDay === today()) return P.streak;
  const y = new Date(); y.setDate(y.getDate() - 1);
  const yStr = y.getFullYear() + "-" + String(y.getMonth() + 1).padStart(2, "0") + "-" + String(y.getDate()).padStart(2, "0");
  return (P.lastDay === yStr) ? P.streak : 0;
}
function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function firstLockedIdx() {
  for (let i = 0; i < LEVELS.length; i++) if (!P.done[LEVELS[i].id]) return i;
  return LEVELS.length;
}

let AC = null;
function tone(freq, start, dur, type, vol) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || "sine"; o.frequency.value = freq;
  const t0 = AC.currentTime + start;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.18, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(AC.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
function snd(kind, combo) {
  if (!P.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
    if (kind === "pick") tone(700, 0, 0.05, "sine", 0.06);
    if (kind === "right") {
      const r = Math.pow(2, Math.min(combo || 0, 8) / 12);   /* pitch climbs a semitone per combo step */
      tone(659 * r, 0, 0.10, "sine", 0.16); tone(880 * r, 0.09, 0.16, "sine", 0.16);
    }
    if (kind === "wrong") { tone(196, 0, 0.20, "triangle", 0.14); tone(147, 0.10, 0.24, "triangle", 0.12); }
    if (kind === "win") { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.09, 0.16, "sine", 0.15)); tone(1319, 0.36, 0.30, "sine", 0.12); }
    if (kind === "goal") { [784, 988, 1175, 1568].forEach((f, i) => tone(f, i * 0.07, 0.14, "sine", 0.14)); }
    if (kind === "fail") { tone(220, 0, 0.25, "triangle", 0.12); tone(175, 0.18, 0.35, "triangle", 0.12); }
  } catch (e) {}
}

/* ===================== PLAYGROUND =====================
   Every machine is a list of pre-computed frames. The player just
   indexes into that list, so scrubbing backwards is free and the SVG
   elements (keyed by a stable id) glide between frames on their own. */

const NS = "http://www.w3.org/2000/svg";
const PG = { m: null, frames: [], i: 0, playing: false, timer: null, speed: 1, els: null, seen: null, opts: {} };
const SPEEDS = [0.5, 1, 2];

function mk(tag, attrs) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function pick(layer, id, tag) {
  let e = PG.els.get(id);
  if (!e) {
    e = document.createElementNS(NS, tag);
    PG.els.set(id, e);
    PG.layers[layer].appendChild(e);
    if (!RM) e.classList.add("vz-in");
  }
  PG.seen.add(id);
  return e;
}
function sweep() {
  PG.els.forEach((e, id) => { if (!PG.seen.has(id)) { e.remove(); PG.els.delete(id); } });
}
/* a circle-with-label that keeps its identity across frames, so a node
   promoted by an AVL rotation visibly travels to its new home */
function orb(layer, id, x, y, r, label, cls, sub) {
  const g = pick(layer, id, "g");
  if (!g.firstChild) {
    g.appendChild(mk("circle", { r: r }));
    g.appendChild(mk("text", { class: "vz-label", "text-anchor": "middle", dy: "0.34em" }));
    g.appendChild(mk("text", { class: "vz-num", "text-anchor": "middle" }));
  }
  g.setAttribute("class", "vz-node " + (cls || "n-idle"));
  g.style.transform = "translate(" + x + "px," + y + "px)";
  g.children[0].setAttribute("r", r);
  g.children[2].setAttribute("y", -(r + 7));   /* clear of the circle, not on top of it */
  g.children[1].textContent = label;
  g.children[2].textContent = sub == null ? "" : sub;
  return g;
}
function cell(layer, id, x, y, w, h, label, cls, sub) {
  const g = pick(layer, id, "g");
  if (!g.firstChild) {
    g.appendChild(mk("rect", { rx: 8 }));
    g.appendChild(mk("text", { class: "vz-label", "text-anchor": "middle", dy: "0.34em" }));
    g.appendChild(mk("text", { class: "vz-num", "text-anchor": "middle" }));
  }
  g.setAttribute("class", "vz-cell " + (cls || "n-idle"));
  g.style.transform = "translate(" + x + "px," + y + "px)";
  const r = g.children[0];
  r.setAttribute("width", w); r.setAttribute("height", h);
  g.children[1].setAttribute("x", w / 2); g.children[1].setAttribute("y", h / 2);
  g.children[1].textContent = label;
  const s = g.children[2];
  s.setAttribute("x", w / 2); s.setAttribute("y", h + 13);
  s.textContent = sub == null ? "" : sub;
  return g;
}
function link(id, x1, y1, x2, y2, cls, w) {
  const g = pick("edge", id, "g");
  if (!g.firstChild) g.appendChild(mk("line", { "stroke-linecap": "round" }));
  g.setAttribute("class", "vz-edge " + (cls || "e-idle"));
  const l = g.children[0];
  l.setAttribute("x1", x1); l.setAttribute("y1", y1);
  l.setAttribute("x2", x2); l.setAttribute("y2", y2);
  l.setAttribute("stroke-width", w || 3);
  return g;
}
function tag(id, x, y, text, cls) {
  const t = pick("edge", id, "text");
  t.setAttribute("class", cls || "vz-w");
  t.setAttribute("text-anchor", "middle");
  t.setAttribute("x", x); t.setAttribute("y", y);
  t.textContent = text;
  return t;
}

const DG = {
  pos: { a: [44, 56], b: [172, 44], c: [304, 70], d: [64, 168], e: [190, 156], f: [308, 198] },
  edges: [["a", "b", 7], ["a", "d", 5], ["b", "d", 9], ["b", "e", 7], ["c", "e", 5],
          ["c", "f", 6], ["d", "e", 15], ["d", "f", 6], ["e", "f", 8]],
};
function drawGraph(f) {
  DG.edges.forEach(([u, v, w], i) => {
    const [x1, y1] = DG.pos[u], [x2, y2] = DG.pos[v];
    const onPath = f.tree && (f.tree[v] === u || f.tree[u] === v);
    const hot = f.edge && ((f.edge[0] === u && f.edge[1] === v) || (f.edge[0] === v && f.edge[1] === u));
    link("e" + i, x1, y1, x2, y2, hot ? "e-look" : onPath ? "e-path" : "e-idle", hot ? 6 : onPath ? 5 : 3);
    tag("w" + i, (x1 + x2) / 2, (y1 + y2) / 2 - 4, w, hot ? "vz-w hot" : "vz-w");
  });
  tag("dgcap", 180, 236, "GREY NUMBERS ARE GUESSES · TEAL IS FINAL", "vz-cap");
  for (const id in DG.pos) {
    const [x, y] = DG.pos[id];
    const d = f.dist[id];
    orb("node", "n" + id, x, y, 21, id.toUpperCase(),
      f.settled.includes(id) ? "n-lock" : id === f.cur ? "n-look" : d < Infinity ? "n-seen" : "n-idle",
      d === Infinity ? "∞" : d);

function mDijkstra(o) {

          { cur: u, edge: [u, v] });
      } else {
        snap("Via <b>" + u.toUpperCase() + "</b>, node <b>" + v.toUpperCase() + "</b> would cost " + dist[u] + " + " + w + " = " + via + ", which loses to <b>" + old + "</b>. Keep what I had.", { cur: u, edge: [u, v] });

    reads: f => [["lock", f.settled.length + "/6", "locked in"], ["look", f.dist[f.cur] === undefined || f.cur === null ? "–" : f.dist[f.cur], "settling"]],

function mBST(o) {
